}

function dioDress(g) {
  dioClaims.length = 0;
  // The alien stands here and claims it before anything else is placed, so the crowd forms
  // around him rather than through him.
  dioClaim(.93, 1.65, 5.5, .55);
  const put = (url, lat, lon, span, spin, lift, foot) => {
    const dir = dioClaim(lat, lon, span, foot);
    return loadModel(url, e => {
    const inst = cloneModel(e.root), sz = e.box.getSize(new THREE.Vector3());
    const s = span / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z));
    inst.scale.setScalar(s);
    inst.position.y = -e.box.min.y * s;
    inst.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; dioMat(o); } });
    const holder = new THREE.Group(); holder.add(inst);
    // Leaning something lifts the far edge of its base off the sphere, so it is sunk by
    // roughly what the lean costs it. Wide things lean off more and sink more.
    dioStand(holder, dir, DIO.R, spin || 0);          // orientation only; the seat sets the height
    dioSeat(holder, dir, span * DIO.upright * .17 + .10 - (lift || 0) * DIO.R);
    g.add(holder);
    return inst;
    });
  };
  // A creature, facing roughly out of the picture and breathing. They are the only things on
  // this planet that are supposed to look back at you.
  const beast = (url, lat, lon, span, upK) => {
    const dir = dioClaim(lat, lon, span, 1.15);   // a creature is all footprint, and wants room
    return loadModel(url, e => {
    const inst = cloneModel(e.root), sz = e.box.getSize(new THREE.Vector3());
    const s = span / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z));
    inst.scale.setScalar(s); inst.position.y = -e.box.min.y * s;
    inst.traverse(o => { if (o.isMesh) { o.castShadow = true; dioMat(o); } });
    const holder = new THREE.Group(); holder.add(inst);
    dioStand(holder, dir, DIO.R, 0, upK);
    dioFace(holder, dir, _dfCam.set(0, 0, 1));
    dioSeat(holder, dir, span * (upK === undefined ? DIO.upright : upK) * .17 + .10);
    g.add(holder);
    const idle = pickClip(e.anims || [], 'idle', 'idle', 'walk|run|die');
    if (idle) { const mx = new THREE.AnimationMixer(inst); mx.clipAction(idle).play(); DIO.mixes.push(mx); }
    });
  };

  // ---- the base, on the left shoulder ----
  // Brought round toward the front and made properly big. At lon 2.46 the base was half off
  // the left limb, showing the camera its own side; the reference has the whole of it.
  put('models/space_base.glb', .62, 2.34, 12.5, .34, 0, .80);
  put('models/sp_sci_fi_antenna.glb', .52, 2.62, 7.6, 0, 0, .30);      // a mast is a pole

  // ---- THREE big caps, in the three places the reference puts them ----
  // .35 of footprint: what a mushroom stands on is its stalk, and standing under a cap is
  // something the reference does deliberately.
  // Measured against the reference: its big cap is about a quarter of the planet's diameter
  // and mine were nearly two fifths. Two thirds the span, and the front-left one moved down
  // and round so its canopy stops hanging over the base's shoulder -- a claim is what a thing
  // stands on, so it cannot know that a cap overhangs a neighbour it is technically clear of.
  put('models/fantasy_mushroom_colorful.glb', .56, 0.92, 4.6, rnd(6.3), 0, .35);   // beside the alien
  put('models/fantasy_mushroom_colorful.glb', .22, 0.34, 5.2, rnd(6.3), 0, .35);   // the right limb
  put('models/fantasy_mushroom_colorful.glb', .26, 1.74, 5.6, rnd(6.3), 0, .35);   // front left

  // ---- the fall, which is a model and no longer six boxes and a scrolling canvas ----
  put('models/waterfall_rock.glb', .26, 1.15, 7.4, .5, 0, .78);       // a rock mass is all footprint
  // AND THE HUT, which I was wrong to take out. c28 gated the whole bay works behind the
  // procedural planet because the PIER needs water to stand over -- but the hut does not. It
  // is a building, it stands on ground like the base does, and it is one of the first things
  // you modelled for this screen. Only the pier and the mill actually needed the bay.
  put('models/dome_hut.glb', .17, 0.72, 6.2, 2.5, 0, .85);

  // ---- one spray of crystals, not five scattered ones ----
  for (let i = 0; i < 5; i++)
    put('models/orange_crystal.glb', .48 + rnd(-.05, .05), 0.52 + rnd(-.13, .13), rnd(2.6, 4.4), rnd(6.3));

  // ---- the creatures the reference has looking out of it ----
  // Bigger, and round toward the front where the lens can see their faces rather than the
  // tops of their heads. They lean the most of anything here -- a creature IS its face, so
  // there is nothing to be gained by standing one honestly on a normal.
  beast('models/purple_horny.glb', .48, 1.06, 4.8, .62);
  beast('models/tucann.glb', .36, 1.86, 4.2, .62);
  // Spread along the limb rather than stepped by a fraction of a radian: three of the same
  // model within a couple of units of each other reads as one heap however well it resolves.
  // Two, not three. Spread wide enough along the limb to read as two animals rather than a
  // clump -- which is what three of one model within arm's reach always reads as, however far
  // the resolver manages to push them apart.
  beast('models/creature_green.glb', .30, 2.34, 2.9, .62);
  beast('models/creature_green.glb', .11, 2.86, 3.2, .62);

  // ---- and the planting. A BAND along the line where the green gives out, plus a few bushes
  // up on the grass -- which is where the reference has all of its, and nowhere else.
  for (let i = 0; i < 10; i++) {
    const lon = 0.25 + i / 9 * 2.55 + rnd(-.10, .10);
    put(pick(['models/sp_tree01.glb', 'models/sp_tree03.glb']), rnd(.34, .62), lon, rnd(2.0, 3.2), rnd(6.3));
  }
  for (let i = 0; i < 16; i++) {
    const lon = 0.15 + i / 15 * 2.75 + rnd(-.08, .08);
    put(pick(['models/sp_plant02.glb', 'models/sp_plant04.glb', 'models/sp_plant07.glb']),
      rnd(.10, .30), lon, rnd(1.2, 2.2), rnd(6.3));
  }
  // the pink flowers along the bottom of the green, right on the rock line
  for (let i = 0; i < 7; i++)
    put('models/sp_plant05.glb', rnd(-.02, .12), 0.5 + i / 6 * 2.1 + rnd(-.10, .10), rnd(1.0, 1.8), rnd(6.3));
  // and moss and rock clinging to the cliffs under it
  for (let i = 0; i < 8; i++)
    put(pick(['models/sp_rock02.glb', 'models/sp_rock09.glb']), rnd(-.30, -.02), rnd(0.2, 2.9), rnd(1.6, 3.0), rnd(6.3));
}

// ---------- the bay: a pier and a mill ----------
// The headland and the fall used to be built here out of three grey boxes, two scrolling
// planes and five spheres for the churn. They are one model now, placed in dioDress with
// everything else, and all of that went with them.
// Everything down here is placed relative to DIO_BAY rather than at absolute latitudes,
// because the bay is the planet's one big feature and the rest of the shore is only
// interesting in relation to it. `dioBayDir` gives a direction `ang` radians from the middle
// of the bay on a compass `bear` around it, so "just outside the water on the north side" is
// a thing that can be written down -- and the water's edge is at acos(0.90) = 0.451 radians,
// which is the number every placement below is measured against.
const _bbE = new THREE.Vector3(), _bbN = new THREE.Vector3(), _bbT = new THREE.Vector3();
function dioBayDir(ang, bear, out) {
  _bbE.set(0, 1, 0).cross(DIO_BAY).normalize();

  return (out || new THREE.Vector3()).copy(DIO_BAY).multiplyScalar(Math.cos(ang))
    .addScaledVector(_bbE, Math.sin(ang) * Math.cos(bear))
    .addScaledVector(_bbN, Math.sin(ang) * Math.sin(bear)).normalize();
}

const _bfZ = new THREE.Vector3(), _bfC = new THREE.Vector3();
function dioFace(o, dir, toward) {
  _bbT.copy(toward).addScaledVector(dir, -toward.dot(dir)).normalize();   // the tangent that points at it
  _bfZ.set(0, 0, 1).applyQuaternion(o.quaternion);

function dioBayWorks(g) {
  const R = DIO.R;
  const M = {
    wood: new THREE.MeshStandardMaterial({ color: 0xa97c4e, roughness: .95, metalness: 0 }),
    post: new THREE.MeshStandardMaterial({ color: 0x8a6339, roughness: .95, metalness: 0 }),
    trim: new THREE.MeshStandardMaterial({ color: 0xe08a34, roughness: .8, metalness: 0 }),
  };
  for (const k in M) M[k].userData.noHole = true;
  const box = (par, mat, sx, sy, sz, px, py, pz, rx, ry, rz) => {
    const m = new THREE.Mesh(dioOwn(new THREE.BoxGeometry(sx, sy, sz)), mat);
    m.position.set(px, py, pz); m.rotation.set(rx || 0, ry || 0, rz || 0);
    m.castShadow = m.receiveShadow = true; par.add(m); return m;
  };
  const cyl = (par, mat, r0, r1, h, px, py, pz, seg) => {
    const m = new THREE.Mesh(dioOwn(new THREE.CylinderGeometry(r0, r1, h, seg || 10)), mat);
    m.position.set(px, py, pz); m.castShadow = m.receiveShadow = true; par.add(m); return m;
  };

  // ---- the pier, the dome and the mill ----
  {
    const dir = dioBayDir(.26, -.62);
    const hold = new THREE.Group();
    dioStand(hold, dir, R * .972, 0);          // the water sits at .972 of the radius
    dioFace(hold, dir, DIO_BAY);
    g.add(hold);
    // a walkway running out over the water, on its own legs
    for (let i = 0; i < 6; i++) {
      box(hold, M.wood, 2.4, .16, .62, 0, .92, -1.9 + i * .66);
      if (i % 2 === 0) {
        cyl(hold, M.post, .11, .11, 1.9, -.95, 0, -1.9 + i * .66, 7);
        cyl(hold, M.post, .11, .11, 1.9, .95, 0, -1.9 + i * .66, 7);
      }
    }
    // the deck it ends on
    box(hold, M.wood, 4.2, .18, 3.0, 0, .92, 3.0);
    for (const [px, pz] of [[-1.7, 1.8], [1.7, 1.8], [-1.7, 4.2], [1.7, 4.2]])
      cyl(hold, M.post, .13, .13, 1.9, px, 0, pz, 7);
    // a rail down one side, so it reads as somewhere you walk rather than a raft
    for (let i = 0; i < 5; i++) cyl(hold, M.post, .06, .06, .7, -1.9, 1.35, 1.9 + i * .58, 6);
    box(hold, M.post, .1, .09, 2.6, -1.9, 1.68, 3.0);
    // The hut is the owner's model now rather than six primitives doing an impression of one.
    // It arrives normalised to a unit with its base on zero, so it needs a scale and nothing
    // else -- and it loads late, which is why it goes on by callback rather than in sequence.
    loadModel('models/dome_hut.glb', e => {
      const inst = cloneModel(e.root), bs = e.box.getSize(new THREE.Vector3());
      const k = 3.1 / Math.max(1e-4, Math.max(bs.x, bs.z));
      inst.scale.setScalar(k);
      inst.position.set(.5, 1.0 - e.box.min.y * k, 3.2);
      inst.rotation.y = -.35;
      inst.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; dioMat(o); } });
      hold.add(inst);
    });
    // the mill on the corner of the deck
    const mill = new THREE.Group(); mill.position.set(-1.5, 1.0, 4.0); hold.add(mill);
    cyl(mill, M.post, .1, .13, 2.9, 0, 1.45, 0, 8);
    const hub = new THREE.Group(); hub.position.set(0, 2.85, .22); mill.add(hub);
    for (let i = 0; i < 4; i++) {
      const b = box(hub, M.wood, .18, 1.5, .05, 0, .82, 0);
      b.rotation.z = i / 4 * Math.PI * 2;
      b.position.set(Math.sin(-i / 4 * Math.PI * 2) * .82, Math.cos(i / 4 * Math.PI * 2) * .82, 0);
    }
    cyl(hub, M.trim, .14, .14, .22, 0, 0, 0, 10).rotation.x = Math.PI * .5;
    DIO.mill = hub;
  }
}

// ---------- shooting stars ----------
// In frame coordinates like everything else in the sky, because a meteor is a thing that
// crosses the PICTURE. Each one waits, then draws itself across in a second and a half on a
// shallow diagonal, and the tail is a stretched quad rather than a trail of particles: one
// draw, no allocation, and it looks the same.
function dioMeteorTex() {
  const W = 128, H = 8, c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = x / (W - 1), v = Math.abs(y / (H - 1) - .5) * 2;
    const a = Math.pow(u, 2.6) * (1 - v) * (1 - v);
    const i = (y * W + x) * 4;
    img.data[i] = 210; img.data[i + 1] = 244; img.data[i + 2] = 255;
    img.data[i + 3] = Math.round(255 * clamp(a, 0, 1));

  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}
function dioMeteors(sc) {
  const tex = dioMeteorTex();

    // ONE MATERIAL EACH. They share a texture but not a material: each streak fades on its own
    // clock, and opacity lives on the material -- shared, the last one to be stepped would
    // set the alpha for all three and they would blink in unison.
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, toneMapped: false });
    mat.userData.noHole = true;
    const m = new THREE.Mesh(dioOwn(new THREE.PlaneGeometry(1, .10)), mat);
    // depthTest stays ON: these are in the sky, so the planet has to be able to pass in front
    // of one. With it off a meteor draws over the world it is meant to be behind.
    m.frustumCulled = false; m.visible = false;
    sc.add(m);
    DIO.meteors.push({ m, wait: rnd(1, 9), t: -1, sx: 0, sy: 0, dx: 0, dy: 0, len: 1 });
  }
}
function dioMeteorStep(dt, place) {
  if (!DIO.meteors) return;

    if (s.t < 0) {
      if ((s.wait -= dt) > 0) { s.m.visible = false; continue; }
      // start off one edge, run down and across: the reference's all fall the same way
      // Upper right to lower left. It ran the other way: cos of an angle in (-.95, -.55) is
      // POSITIVE, so every streak was travelling right and down, off the wrong corner.
      s.sx = rnd(-.15, 1.30); s.sy = rnd(.40, 1.20);
      const a = Math.PI + rnd(.55, .95);
      s.dx = Math.cos(a) * 2.6; s.dy = Math.sin(a) * 2.6;

    s.m.material.opacity = Math.sin(k * Math.PI) * .9;
    place(s.m, s.sx + s.dx * k, s.sy + s.dy * k, 330);
    s.m.scale.set(s.len * 330 * .7, s.len * 330 * .7, 1);
    s.m.quaternion.copy(DIO.cam.quaternion);
    s.m.rotateZ(Math.atan2(s.dy, s.dx));

}

function buildDiorama() {
  if (DIO.built) return;
  DIO.built = true;
  const sc = DIO.scene = new THREE.Scene();
  // A fallback ground only: the plate covers this the moment the image arrives, but the
  // renderer's clear colour belongs to the world's sky and inheriting it for even one frame
  // would flash a daylight blue behind the planet.
  sc.background = new THREE.Color('#05060f');
  DIO.cam = new THREE.PerspectiveCamera(46, camera.aspect, 1, 900);

  // EXPOSURE. The first cut ran key 2.5 + rim 1.05 + hemi 1.05 + ambient .55, which is about
  // five units of light on a diffuse white-ish surface -- so every colour on the planet
  // clipped, the whole ball went white, and the bloom pass then threw a halo round it because
  // a clipped ball is by definition over the bright threshold. None of the vertex colour
  // survived to be seen. One key, and everything else only enough to keep the dark side
  // readable.
  const key = new THREE.DirectionalLight(0xfff2e0, 1.22);
  // Higher than it was. At (-38, 44, 40) it grazed the ball and every tree laid a shadow
  // halfway round it, which is what those long dark streaks across the underside were.
  key.position.set(-28, 62, 34);
  // It casts. A ball this size with no shadow on it reads as a sticker, and the alien's own
  // shadow on the grass is most of what sells him as standing there.
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  const sh = key.shadow.camera;
  sh.left = -26; sh.right = 26; sh.top = 26; sh.bottom = -26; sh.near = 1; sh.far = 160;
  key.shadow.bias = -.0012;
  sc.add(key); sc.add(key.target);
  const rim = new THREE.DirectionalLight(0x7fb0ff, .40);
  rim.position.set(46, 10, -34); sc.add(rim);
  sc.add(new THREE.HemisphereLight(0x9fbcf0, 0x241f42, .30));
  sc.add(new THREE.AmbientLight(0x5a5f8c, .16));

  const spin = DIO.spin = new THREE.Group(); sc.add(spin);
  DIO.ball = dioPlanet(); spin.add(DIO.ball);
  dioClouds(spin);
  dioDress(spin);
  // ONLY WHEN THERE IS A BAY TO BUILD ON. The pier and the mill are placed against the
  // procedural planet's water -- a patch sunk into one named shoulder, which is why they can
  // be positioned at all. A model planet has its own geography and I checked this one rather
  // than assuming: 7.4% of its vertices sample as sea, and they are spread 1.42 radians from
  // their own centroid with the furthest at 3.06. That is not a bay, that is blue scattered
  // round the whole ball. There is nowhere on it to stand a pier, so it does not get one.
  if (!DIO.model) dioBayWorks(spin);
  const sky = new THREE.Group(); sc.add(sky); DIO.sky = sky;
  dioSky(sky);
  titleBackdrop(sc);
  dioMeteors(sc);

  // the alien, standing on top of the world at a size no real body would be
  loadModel('models/alien_orange.glb', e => {
    const inst = cloneModel(e.root), h = e.box.max.y - e.box.min.y;
    // 195 of the reference's 1660 pixels tall against a planet whose 700 pixels are 28 units:
    // 7.8, not the 8.6 I had guessed at.
    const s = 7.8 / Math.max(1e-4, h);
    inst.scale.setScalar(s); inst.position.y = -e.box.min.y * s;
    inst.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; dioMat(o);
      // He is the subject, so he carries a little of his own light: his own map as an
      // emissive, low, which lifts him off the planet without turning him into a lamp.
      for (const m of [].concat(o.material)) { m.emissiveMap = m.map; m.emissive.setScalar(.34); }
    });
    const holder = new THREE.Group(); holder.add(inst);
    const dir = dioDir(.93, 1.65);      // just off the crown and toward the lens, as he is there
    dioStand(holder, dir, DIO.R, 0);
    // Turned to face the lens rather than left on an arbitrary yaw. The camera sits out along
    // +Z, and this rig's forward is +Z -- the same convention the whole game uses.
    dioFace(holder, dir, _dfCam.set(0, 0, 1));
    dioSeat(holder, dir, .12);
    DIO.spin.add(holder); DIO.alien = inst;
    const idle = pickClip(e.anims || [], 'idle', 'idle', 'walk|run|rifle');
    if (idle) { const mx = new THREE.AnimationMixer(inst); mx.clipAction(idle).play(); DIO.mixes.push(mx); }
  });
  // and our ship, up on the left where the reference puts its saucer
  loadModel(SHIP.url, e => {
    const inst = cloneModel(e.root), sz = e.box.getSize(new THREE.Vector3());
    const s = 1 / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z));
    inst.scale.setScalar(s);
    inst.traverse(o => { if (o.isMesh) dioMat(o); });
    const holder = new THREE.Group();
    holder.add(inst); holder.frustumCulled = false;

  });

}

// The shot. Distance comes off the frustum rather than a constant, so the planet holds the
// same share of the picture on any screen -- a fixed standoff is a different composition on
// every device, which is the one thing a title card cannot be.
function dioramaFrame(dt, k) {
  if (!DIO.built) buildDiorama();
  DIO.t += dt;
  const cam3 = DIO.cam;
  if (cam3.aspect !== camera.aspect) { cam3.aspect = camera.aspect; cam3.updateProjectionMatrix(); }
  const vHalf = cam3.fov * Math.PI / 360, tv = Math.tan(vHalf);
  const th = tv * cam3.aspect;
  // Distance straight out of the width rule: the planet's screen width is 2R / (2 d tan(hHalf)),
  // so asking for a fraction of the frame fixes d. No constant, no tuning per device.
  const d = DIO.R / Math.max(.02, DIO.fill * th);
  // And it is pushed DOWN the frame by aiming above it, which is cheaper and steadier than
  // moving the camera: the lens keeps pointing at the same place while the world drops.
  const up = -(DIO.drop + DIO.shiftY) * tv * d;
  cam3.position.set(Math.sin(DIO.t * .035) * d * .035, up + Math.sin(DIO.t * .06) * .4, d);
  cam3.lookAt(0, up, 0);
  cam3.updateMatrixWorld(true);
  // Everything that is placed in the FRAME rather than in the world: the neighbours, the
  // lumps in the corners, and the ship. Half-frame at a given distance is dist*tan(half), so
  // sx = 1 lands exactly on the right edge whatever the screen is doing.
  _dfF.set(0, 0, -1).applyQuaternion(cam3.quaternion);
  _dfR.set(1, 0, 0).applyQuaternion(cam3.quaternion);
  _dfU.set(0, 1, 0).applyQuaternion(cam3.quaternion);
  const place = (o, sx, sy, dist, rf) => {
    const hh = dist * tv, hw = hh * cam3.aspect;
    o.position.copy(cam3.position).addScaledVector(_dfF, dist)
      .addScaledVector(_dfR, sx * hw).addScaledVector(_dfU, (sy + DIO.shiftY) * hh);
    if (rf !== undefined) o.scale.setScalar(rf * hw);
  };
  for (const b of DIO.bodies) place(b.m, b.spec.sx, b.spec.sy, b.spec.d, b.spec.rf);
  dioSettle();                       // the moment the ball exists, everything sits down on it
  titleBackdropFrame(cam3);
  dioMeteorStep(dt, place);
  if (DIO.mill) DIO.mill.rotation.z -= dt * 1.15;
  // IT DOES NOT TURN. A spinning planet swings the base, the bay and the grove out of the
  // frame they were composed for, and takes the alien's facing with it. The shot is a fixed
  // composition; the camera's drift, the mill, the fall and the meteors are what move.
  for (const mx of DIO.mixes) mx.update(dt);
  if (DIO.ship) {
    // Up on the left, under the name and clear of the world -- where the reference puts its
    // saucer. In frame coordinates for the same reason everything else is.
    // It was never too big -- rf .50 is a quarter of the frame across, which is the
    // reference's saucer exactly. It was too HIGH: at sy .56 its top reached .637 and the
    // wordmark's underside was at .572, so they shared a band. With the mark lifted to a
    // bottom edge of .63 and the ship at .50, its top lands at .577 and they just clear.
    place(DIO.ship, -.54, .45 + Math.sin(DIO.t * .5) * .02, 70, .50);
    DIO.ship.quaternion.copy(cam3.quaternion);
    DIO.ship.rotateY(.55); DIO.ship.rotateZ(.14 + Math.sin(DIO.t * .37) * .04); DIO.ship.rotateX(-.12);
  }
  titleMarkFrame(k, cam3);
}

const INTRO = {
  on: true,
  // The wide end is a long way out on purpose. At 224 the planet fills the frame and reads
  // as a hillside; at 640 it is a ball with space around it and the star field behind, which
  // is what the title screen is meant to be -- the whole world floating there with all its
  // regions on it, the ship going round the outside, and the name standing on top of it.
  // Pitch matters as much as distance out here. At 1.02 the lens ends up nearly over the
  // island looking down, and what fills the frame is the half of the world the sun is not on.
  // Lower (a bigger polar angle is a lower camera) puts it side-on, so the lit limb and the
  // horizon are what you see, with the island hanging above them.
  // HOW FAR OUT IS DECIDED BY ARITHMETIC, not taste, and the arithmetic has a ceiling. The
  // lens is 46 degrees vertical and the far plane is at 1600. At r = 660 the camera sits
  // about 1060 from the planet's centre, the planet's half-angle is asin(400/1060) = 22.2
  // degrees against 23 degrees of half-frame, and it fills the picture edge to edge -- which
  // is why the old title screen showed a hillside with its ends running off both sides.
  // At 900 it is asin(400/1300) = 17.9 degrees, so the world takes about four fifths of the
  // frame height and the name goes in the fifth above it. The far horizon at that boom is
  // 1237 units out, still inside the far plane, so nothing gets sliced.

  // phone -- 11 degrees of half-frame across -- needs about 3800 units of standoff, twice the
  // far plane, and at that range the island is four hundred pixels of nothing. The reference
  // is a DIORAMA, a small planet built to be looked at, not this one seen from further away.
  wide: { r: 900, pol: 1.26, up: 0 },      // the world, as much of it as the lens can hold
  // And the plaque grows with the boom, so it holds its size on screen the whole way in: a
  // monument you could walk around at seventy units, and something the size of a mountain
  // range standing on the world at six hundred. Without this the title screen's own title is
  // four pixels tall. It eases back to 1 during the descent.
  // IT DOES NOT CRANE ANY MORE. The shot used to run all the way in to seventy units and back
  // out again on a sixty-second cycle, which meant the composition the title screen is FOR --
  // the whole world in the frame, the name across the top of it, space behind both -- existed
  // for about four seconds a minute and was the frame you were least likely to be looking at.
  // It holds wide now and only breathes: a slow sway across, and a drift in and out of a few
  // per cent so it is a held shot rather than a still.
  breathe: .045, breatheT: 26,
  sweep: .40, rate: .045,                  // how far the shot swings, and how lazily

};
const introEl = document.getElementById('intro'), startB = document.getElementById('startB');
function introFrame(dt) {
  INTRO.t += dt;
  // The camera hangs on whatever centrepiece the island produced: the letters if placeTitle
  // stood them up, the Elderwillow if it could not, the origin if neither.
  // world.titleAt is the plaque's place in chart coordinates. world.title itself is now a
  // child of the floating island, so its own .position is local to it and no use here.
  // The card is the diorama now. The world camera below is only being parked somewhere
  // sensible, so the descent has an honest place to start from when the scene changes.
  dioramaFrame(dt, smooth(.15, 2.0, INTRO.t));
  const c = world.titleAt || (world.greatTree ? world.greatTree.pos : null);
  const tx = c ? c.x : 0, tz = c ? c.z : 0;
  const W1 = INTRO.wide;
  // Aimed at the island, held at the wide end. The world is four hundred units across and the
  // lens a thousand off its centre, so what is in frame is the lit limb with the whole of the
  // land on it -- and the mark rides above that rather than standing on it.
  const gy = groundY(tx, tz);
  cam.tgt.set(tx, lerp(gy, c ? c.y : gy, .52) + W1.up, tz);
  // It does not orbit. placeTitle turns the monument's reading side toward the middle of
  // the island, so there is exactly one direction the letters are legible from -- a full
  // turn spends half of itself round the back of them. Sit in front and sway.
  const face = c ? Math.atan2(-tx, -tz) : 0;
  cam.az = face + Math.sin(INTRO.t * INTRO.rate) * INTRO.sweep;
  cam.pol0 = W1.pol;
  cam.r = W1.r * (1 + Math.sin(INTRO.t / INTRO.breatheT * Math.PI * 2) * INTRO.breathe);
  cam.idle = 0;
  INTRO.plaque0 = 1;
  // The monument on the island stays the size it really is. It used to be swollen to three
  // times itself so it could be read from orbit, and with a wordmark across the top of the
  // frame that is simply a second title in the same shot.
  if (world.title) world.title.scale.setScalar(1);
  // and send the ship round the island. This is the sortie it has always known how to fly
  // -- lift, one lap at altitude, land -- which is switched off in play because it is his
  // ship now, and is exactly the right thing for a title screen.
  const sh = world.ship;
  if (sh && sh.bones && sh.state === 'landed' && !player.aboard) {
    sh.goHome(); sh.planFlight(); sh.begin('lift');
    if (sh.ob) { obRemove(sh.ob); sh.ob = null; }
  }
}
function startGame() {
  if (!INTRO.on) return;
  // The scene swaps underneath in a single frame, so cover it. Black on its way out reads as
  // an arrival; the same cut uncovered reads as a glitch.
  const veil = document.createElement('div');
  veil.id = 'veil'; document.body.appendChild(veil);
  requestAnimationFrame(() => { veil.style.opacity = '0'; });
  setTimeout(() => veil.remove(), 1500);
  INTRO.on = false; INTRO.r0 = cam.r; INTRO.dive = INTRO.diveT;
  titleMarkFrame(0);
  // Hand the diorama back. It is a planet, a sky and a couple of dozen props that will never
  // be looked at again, and it is the one thing in this file that is genuinely disposable.
  if (DIO.scene) {
    for (const g of DIO.own) g.dispose();
    DIO.own.length = 0;
    DIO.scene = null; DIO.spin = null; DIO.sky = null; DIO.mixes.length = 0;
  }
  if (weap.ready) wdock.hidden = false;
  if (/[?&]obs\b/.test(location.search)) setTimeout(showObstacles, 400);
  introEl.classList.add('go');
  setTimeout(() => introEl.remove(), 1000);
  document.body.classList.remove('intro');
}
// The descent. cam.tgt and the pitch are already easing themselves toward the wanderer in
// the main loop; all this owns is the boom length, on a curve slow at both ends so it
// reads as a landing rather than a cut.
function diveFrame(dt) {
  INTRO.dive = Math.max(0, INTRO.dive - dt);
  const k = 1 - INTRO.dive / INTRO.diveT;
  const e = k * k * (3 - 2 * k);
  cam.r = lerp(INTRO.r0, 20, e);
  // The plaque comes back down to the size it is in the world as you arrive at it, so the
  // thing you were reading from orbit turns out to be a monument standing in a meadow.
  if (world.title) world.title.scale.setScalar(lerp(INTRO.plaque0, 1, e));
  if (INTRO.dive <= 0) { cam.rWalk = 0; if (world.title) world.title.scale.setScalar(1); }
}

// ---------- camera + input ----------

// holding one angle keeps the island reading the way it was framed. solveCam still drops

// Polar angle from straight up, so a bigger number is a lower camera. 1.05 put the lens
// thirty degrees above the horizon and fifteen units over his head: you saw the ground he
// stood on and very little of what was ahead. 1.28 is seventeen degrees above the horizon
// and nine over his head, which puts the treeline and the sky in frame without the boom

  const p = player;

  //     second, so on a flick-and-release the barrel still points where he was facing while
  //     the bolt already flies where the stick pointed. Swing the muzzle onto the shot line.
  //   * rifle_idle holds the blaster low and out -- measured at 1.4 to the right and 0.79 up
  //     on a body 2.8 tall, which is hip height. A bolt that starts there is inside whatever
  //     he is standing next to and bursts on it immediately. Lift it to chest height and push

  // stream must not make him un-decide to be carrying it, which is what clearing armWant

  // free camera genuinely do put it away.

  // sideways, so the test is one dot product.

  // charge you can abandon.

function fireNet() {
  const p = player;
  if (p.cool > 0) return;
  p.cool = NET.cool; p.shootT = WEAPON.hold;

  // shot line, lift it to chest height, and buy it a couple of units of grace.

  _wmz.x = p.pos.x + Math.sin(p.aimH) * reach;
  _wmz.z = p.pos.z + Math.cos(p.aimH) * reach;
  _wmz.y = Math.max(_wmz.y, p.pos.y + RIG.height * WEAPON.high);
  weap.lastMuzzle.copy(_wmz);
  world.effects.push(new NetShot(_wmz.x, _wmz.y, _wmz.z, Math.sin(p.aimH), Math.cos(p.aimH)));
  world.effects.push(new Burst(_wmz.x, _wmz.y, _wmz.z, '#dff6ea', 2.2, .18));
}

// ---------- rope, drawn as rope ----------
// A LineSegments cord is one pixel wide however close you get to it, which is why the net
// read as a wireframe rather than as something woven. Every strand here is a camera-facing
// ribbon instead: a quadratic Bezier that bows under its own slack, cut into segments, each
// segment a quad turned edge-on to the lens. Thickness for the price of a cross product per
// vertex, and the curve comes free with the sampling -- a cord under tension samples to a
// straight line by itself, and only a slack one bows.

// walk cycle at the speed it was authored for so the feet do not skate.

// off and overshoots when he stops; it drifts on its own noise; and now and then it darts.

// the distance, so a pass at one unit is four times the light of a pass at two, and at night

  space: 1.7,     // it can never be nearer than this to the body

  pos: new THREE.Vector3(), vel: new THREE.Vector3(), off: new THREE.Vector3(2.2, 2.4, -.5),   // replaced from the rig's own bounds once it loads

function updateRig(dt) {
  const p = player;
  // Which way he is travelling in his OWN frame, which is what the armed set blends on. Off
  // the velocity rather than the stick, so the blend follows the body through a turn instead
  // of snapping the instant the thumb moves.
  // Forward is (sin h, cos h) and HIS RIGHT is forward x up, which is (-cos h, sin h) --
  // not up x forward, which is his left. Written the other way round the strafes came out
  // mirrored: walk left, play the right clip.
  let mf = 0, mr = 0;

// The fins. Six bones, no clips: everything here is the machine's own state read back as
// posture. Controls are smoothed on their way to a bone, like the ship's joints, so a dart or
// a hard turn bends the fins instead of snapping them.

  if (!fins || !fins.length) return;

  const want = {
    sweep: clamp(sp / F.at, 0, 1),
    bank: clamp(turn * F.bank, -F.bankMax, F.bankMax),
    dih: clamp(f.vel.y / F.climbAt, -1, 1),

    splay: f.lampOff ? 0 : (.3 + .7 * world.night) * f.lit,
    flare: claw.job ? 1 : clamp(claw.out / 1.5, 0, 1),

  // machine going somewhere holds its surfaces still.

    `plate ${skyUni.uPlateK.value.toFixed(2)} on ${PLATE.on} space ${skyUni.uSpace.value.toFixed(2)} high ${skyUni.uHigh.value.toFixed(2)}<br>` +
    `centre of frame: ${lookingAt()}`;
  {   // the eject chip is only ever offered when there is something to get out of
    const on = !INTRO.on && (player.aboard || player.roping);
    if (ejectQ.hidden === on) ejectQ.hidden = !on;
    const lbl = player.roping ? 'let go' : 'eject';
    if (on && ejectQ.textContent !== lbl) ejectQ.textContent = lbl;
  }
  const era = eraName(); if (era !== world.lastEra) { world.lastEra = era; eraEl.textContent = era; }
  // THE CENTRE OF THE FRAME, ON THE ALWAYS-VISIBLE LINE. It was in the folded stats panel,
  // which means a screenshot of the thing you are pointing at does not contain the name of the
  // thing you are pointing at unless the panel happened to be open. Every screenshot has it
  // now.
  // BOTH ANSWERS, ALWAYS ON SCREEN, NO TAPPING. He has been asked three times for a
  // screenshot with a panel open and it has not been possible to get one while the thing he
  // is reporting is happening. So the two lines that settle the two open questions live here,
  // where every screenshot already catches them: what the middle of the frame is pointing at,
  // and every viewport number that could make the lens smaller than the glass.
  if (bldEl) {
    const cv = renderer.domElement;
    if (firstErr) { bldEl.innerHTML = BUILD + '  \u00b7  <span style="color:#ff9c9c">' + firstErr + '</span>'; return; }
    bldEl.innerHTML = BUILD + (KDBG ? '+knock' : '') + (KOBS ? '+obs' : '')
      + '  \u00b7  ' + (INTRO.on ? 'title' : lookingAt()) + '<br>'
      + `win ${innerWidth}x${innerHeight} vis ${window.visualViewport ? Math.round(visualViewport.width) + 'x' + Math.round(visualViewport.height) : '-'}`
      + ` doc ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}<br>`
      + `scr ${typeof screen !== 'undefined' ? screen.width + 'x' + screen.height : '-'}`
      + ` lvh ${_lvh()} glass ${glassH()}+${_over} gap ${_gap}<br>`
      + `cv ${cv.clientWidth}x${cv.clientHeight} buf ${_vw}x${_vh} chrome ${_uiInset('--uit')}/${_uiInset('--uib')}`
      + ` far ${camera.far | 0} sky ${(900 * skyRig.scale.x) | 0}`;
  }
}
setInterval(updateHUD, 600); updateHUD();
setTimeout(() => logMsg('Nothing here yet but moss, motes and a few lantern trees.'), 1400);
setTimeout(() => { if (world.motherTree) logMsg('Something has built steps up the oldest tree in the jungle.'); }, 5200);

// ---------- loop ----------
let last = performance.now(), booted = false;
// WHY A STUCK SPLASH IS THE WORST FAILURE THIS FILE HAS, and why it no longer happens
// silently. The loop re-arms on the FIRST line, so a throw anywhere below repeats forever at
// the same place -- and the code that lifts the loading card sits at the very BOTTOM of this
// function, so it never runs. Worse, the studio mark is only cut short on a successful boot,
// so a broken build plays the whole animation and then sits there looking deliberate. The
// nicer the splash looked, the more broken the game was, which is exactly backwards.
//
// Now the first error stops the mark, lifts nothing, and prints itself where the eye already
// is. A blank splash asks "what happened"; this answers it.
let bootBad = 0;
function bootFail(e) {
  if (!firstErr) firstErr = (e && e.message ? e.message : String(e));
  if (bootBad) return;
  bootBad = 1;
  console.error(e);
  try { if (window._majiaFinish) window._majiaFinish(); } catch (_) {}
  const b = document.getElementById('boot');
  if (!b) return;
  const cap = b.querySelector('span'); if (cap) cap.textContent = 'it did not grow.';
  const msg = document.createElement('div');
  msg.style.cssText = 'max-width:min(88vw,640px);margin-top:20px;color:#ff9c9c;text-align:left;'
    + 'font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word';
  msg.textContent = ((e && e.stack) || e || 'unknown') + '';
  b.appendChild(msg);
}
function frame(now) {
  requestAnimationFrame(frame);
  try {
  const raw = now - last;
  const dt = clamp(raw / 1000, 0, .05); last = now; world.clock += dt;   // never negative: that ran a frame backwards
  syncSize();                              // costs two reads unless the viewport moved
  perf.ms = lerp(perf.ms, raw, .06); perf.acc += raw; perf.n++;
  if (perf.n > 30) { perf.worst = Math.max(perf.worst * .82, perf.acc / perf.n); perf.acc = 0; perf.n = 0; }
  if (perfEl && (world.clock * 3 | 0) !== perf.tick) {
    perf.tick = world.clock * 3 | 0;
    const inf = renderer.info.render;
    perfEl.textContent = `${(1000 / perf.ms).toFixed(0)} fps  ${perf.ms.toFixed(1)}ms  ${inf.calls} calls  ${(inf.triangles / 1000 | 0)}k tris  ·  ${BUILD}`;
  }
  const prevDay = Math.floor(world.t / DAY); world.t += dt; const curDay = Math.floor(world.t / DAY);
  if (curDay > prevDay) { world.day++; if (world.day === 2) logMsg('Second sunrise. The island keeps its own time now.'); }

  updatePlayer(dt);
  updateFairy(dt);
  carryStep(dt);                           // after the body has moved: it hangs off his hands
  stepDrag();                              // and the cord to whatever he is hauling
  if (INTRO.on) introFrame(dt);
  else if (player.aboard && world.ship && !player.free) {
    // The chase view: behind and above, flatter than the walking camera, and lagging the
    // heading by a beat so a turn reads as the hull swinging round in front of you.
    const sh = world.ship;
    cam.tgt.lerp(_camWant.set(sh.pos.x + sh.vel.x * .22, sh.pos.y + 2.4 + sh.vel.y * .12, sh.pos.z + sh.vel.z * .22), Math.min(1, dt * 6));
    let want = sh.heading + Math.PI, d = want - cam.az; d = Math.atan2(Math.sin(d), Math.cos(d));
    cam.az += d * Math.min(1, dt * PILOT.camLag);
    cam.r = lerp(cam.r, PILOT.camR + Math.min(15, Math.hypot(sh.vel.x, sh.vel.z) * .26), Math.min(1, dt * 1.2));
    cam.pol0 = lerp(cam.pol0, PILOT.camPol, Math.min(1, dt * 2)); cam.idle = 0;
    cam.polBias = lerp(cam.polBias, 0, Math.min(1, dt * 3));
  } else {
    if (!player.free) followCam(dt);
    cam.pol0 = lerp(cam.pol0, CAM_POL, Math.min(1, dt * 2));
    if (cam.rWalk) {   // ease back to the zoom he had before he boarded, then leave it alone
      cam.r = lerp(cam.r, cam.rWalk, Math.min(1, dt * 2));
      if (Math.abs(cam.r - cam.rWalk) < .3) { cam.r = cam.rWalk; cam.rWalk = 0; }
    }
    cam.idle += dt; if (cam.idle > 6 && player.moving < .05) cam.az += dt * .03;
  }
  if (INTRO.on) cam.polBias = lerp(cam.polBias, 0, Math.min(1, dt * 3));
  if (INTRO.dive > 0) diveFrame(dt);
  solveCam(dt);
  // The boom is still swung in chart terms -- azimuth, pitch, and the ridge solver that
  // marches it against the height field -- but it is *hung* in the frame standing on the
  // target, not laid back down on the chart. A forty-unit boom laid on the chart follows the
  // curve and sinks four units into the hill behind him; a four-hundred-unit one, which the
  // zoom allows, would swing a hundred degrees round the planet and look back at the far
  // side. In the local frame it is a straight line out from where he stands, at any length.
  planetQ(cam.tgt.x, cam.tgt.z, _camQ);
  planetPos(cam.tgt.x, cam.tgt.y, cam.tgt.z, _camW);
  camera.position.set(Math.sin(cam.az) * Math.sin(camS.pol) * camS.r,
                      camS.y - cam.tgt.y,
                      Math.cos(cam.az) * Math.sin(camS.pol) * camS.r)
    .applyQuaternion(_camQ).add(_camW);
  camera.up.copy(_plY).applyQuaternion(_camQ);
  camera.lookAt(_camW);
  // THE RINGS. Not the water shader and not the mesh -- the DEPTH BUFFER. The scene renders
  // into an offscreen target whose depth attachment is sixteen bits, and the frustum was a
  // fixed 0.5 to 1600: a ratio of 3200 to 1, nearly all of it spent on the first few units in
  // front of the lens. Six hundred units out at the title screen there is barely a bit of
  // depth left per hundred units, so the sea shell and the ground a metre above it land in
  // the same depth value and fight -- and because both are polar meshes, the fight comes out
  // as concentric rings. It shows worst exactly where the user pointed: the shoreline and the
  // shallows, where the two surfaces are closest together.
  // The near plane is a fixed fraction of the boom instead. Nothing can be nearer than the
  // subject, so 3% of the way to it is always empty, and at 660 units that is a twenty-fold
  // precision gain for free. Kept off the resize path: it changes far too often for that.
  {
    const n = clamp(camS.r * .03, .5, 22);
    if (Math.abs(n - camera.near) > camera.near * .12) { camera.near = n; camera.updateProjectionMatrix(); }
  }
  // The dome is nine hundred units and the planet is two-forty, so from the ground the sky
  // encloses everything. Climb, and the far limb of the world reaches past it -- so the rig
  // grows to stay outside whatever is behind you.
  //
  // THE BLACK SHAPE IN THE SKY, and it is arithmetic, not a model. The rig grows; the far
  // plane did not. At the title boom the lens sits about 1300 from the planet's centre, so
  // the scale is (1300+480)/800 = 2.23 and the dome is 2003 units out -- against a far plane
  // fixed at 1600. And a far plane is a PLANE: what it compares is view-space depth, not
  // distance, so a sphere centred on the lens is cut where it is deepest, which is the middle
  // of the frame. Straight ahead the dome is 2003 deep and gone; forty-odd degrees off axis
  // it is 2003*cos = 1390 and still there. That is the shape exactly -- a huge hard-edged
  // black mass filling the centre of the sky with the background surviving round the corners,
  // occluding nothing because it IS the background, and thinning out as you descend and the
  // scale comes back down. Same cause as "the background is all black when the game starts":
  // the dive begins at the title boom, where the whole dome is past the plane.
  // So the plane is derived from the dome now instead of being a constant it can outgrow. It
  // also buys depth precision back at ground level, where 1600 was always far more range than
  // a 990-unit dome needed.
  skyRig.position.copy(camera.position); skyRig.quaternion.copy(_camQ);
  const skyS = Math.max(1, (camera.position.length() + PLANET.R + 80) / 800);
  skyRig.scale.setScalar(skyS);
  {
    const f = 900 * skyS * 1.12 + 60;
    if (Math.abs(f - camera.far) > camera.far * .03) { camera.far = f; camera.updateProjectionMatrix(); }
  }
  {   // the see-through hole follows the wanderer's chest on screen
    // NOT DURING THE DIVE, and that is the whole of it. The hole is a dithered discard of
    // everything between the lens and his chest -- it exists so a trunk or a canopy cannot
    // stand in front of him while you play. During the descent from the title the boom is
    // nine hundred long, so "between the lens and his chest" is nearly the entire world, and
    // a disc seventeen percent of the frame across gets punched through the island the whole
    // way in. That is the see-through flying-through-things look on the transition: it is the
    // gameplay effect arriving before the gameplay. It waits for the landing now.
    // INTRO.on is already false by the first dive frame -- startGame clears it and starts the
    // dive in the same breath -- so this needed the dive's own clock, not the title's.
    camera.updateMatrixWorld(); camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
    const p = planetPos(player.pos.x, player.pos.y + RIG.height * .5, player.pos.z, _holeP);
    const vz = _holeV.copy(p).applyMatrix4(camera.matrixWorldInverse).z;   // negative in front of the lens
    p.project(camera);
    if (!INTRO.on && INTRO.dive <= 0 && !player.free && !player.aboard && vz < -1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1) {
      holeUni.uHoleC.value.set((p.x * .5 + .5) * rtScene.width, (p.y * .5 + .5) * rtScene.height);
      // Wider when the boom is short. A pinched camera is a camera with something big and
      // close in front of it, and a porthole seventeen percent of the screen across is not
      // much use when the other eighty-three are the inside of a canopy.
      holeUni.uHoleR.value = rtScene.height * lerp(.34, .17, smooth(8, 24, camS.r));
      holeUni.uHoleZ.value = -vz;
    } else holeUni.uHoleR.value = 0;
  }
  drawReticle(); drawHud2();

  updateWeather(dt);
  updateSky();
  ACT.now = null;                          // whatever is in reach re-offers itself below
  carryOffer(); netOffer(); repairOffer();   // first, so the ship's own offer wins where they overlap
  for (const e of world.plants) if (e.alive) e.update(dt);
  for (const e of world.structures) if (e.alive) e.update(dt);
  moodEase(dt);
  for (const e of world.creatures) if (e.alive) e.update(dt);
  for (const e of world.effects) if (e.alive) e.update(dt);
  for (const e of world.sparks) if (e.alive) e.update(dt);
  ferry.update(dt);
  if (world.isle) world.isle.update(dt);
  stepClouds(dt);
  for (let i = 0; i < world.psys.length; i++) world.psys[i].update(dt);
  if (world.chasmGlow) world.chasmGlow.scale.setScalar(14 + Math.sin(world.clock * 1.4) * 3 + world.night * 10);
  updateMotes(dt);
  updateWaypoint(dt);
  if (MAP.open) { clampView(); drawMap(); }
  drawMini(dt); showAct();
  weatherLeavings(dt); cullFar(dt);
  purge(world.plants); purge(world.structures); purge(world.creatures); purge(world.effects); purge(world.sparks);

  waterUni.uT.value = world.clock; foamUni.uT.value = world.clock; grassUni.uT.value = world.clock;
  {   // things cutting the surface leave a wake
    const wk = waterUni.uWk.value; let n = 0;
    // heading scaled by how fast the thing is actually going: a treading swimmer leaves no V
    const push = (x, z, hx, hz, k = 1) => { if (n < 4) { const d = Math.hypot(hx, hz) || 1; wk[n++].set(x, z, hx / d * k, hz / d * k); } };
    if (ferry) push(ferry.pos.x, ferry.pos.z, Math.sin(ferry.g.rotation.y), Math.cos(ferry.g.rotation.y));
    if (player.swim > .4) push(player.pos.x, player.pos.z, Math.sin(player.heading), Math.cos(player.heading), clamp(player.speed / 8, 0, 1));
    for (const c of world.creatures) {
      if (n >= 4) break;
      if (c.alive && c instanceof Leviathan && c.depth < 2.2) push(c.rx, c.rz, Math.sin(c.heading), Math.cos(c.heading));
    }
    for (let i = n; i < 4; i++) wk[i].set(0, 0, 0, 0);
  }
  if (GLLOST.on) return;
  renderPost();

  // Hold the loading card until the models are actually in. Lift it on the first frame and
  // the title screen opens on a world still wearing its primitive stand-ins, and swaps them
  // out in front of you. Six seconds is the ceiling: a slow connection gets the world it has.
  if (!booted) {
    const urls = Object.keys(MODELS);
    if (world.clock > 6 || (urls.length > 3 && urls.every(u => MODELS[u].ready || MODELS[u].failed))) {
      booted = true;
      // ... but not INSTANTLY. On a warm cache every model is ready inside a frame or two, so
      // this fired before the splash had drawn anything and the mark was never seen at all.
      // Two and a bit seconds is the floor; a slow boot still overruns it and dismisses on
      // its own timeline.
      if (window._majiaFinish) setTimeout(window._majiaFinish, Math.max(0, 4900 - (Date.now() - T0)));
      const b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 1300);
      if (INTRO.on) introEl.hidden = false; else document.body.classList.remove('intro');
    }
  }
  } catch (e) { bootFail(e); }
}
buildSkyBodies();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
