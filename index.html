<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plutopia</title>
<!-- Add to Home Screen. iOS reads the apple-* tags and the touch icon; everything else
     reads the manifest. The icon is cropped out of its bezel: iOS masks its own corners. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plutopia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070a13">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a13;font-family:Georgia,"Iowan Old Style",serif;color:#f0e7d4;
    touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  canvas{display:block;touch-action:none}
  /* An id rule with a display beats the UA sheet's [hidden], so panels that set display
     could never hide. This has now cost two of them; make it impossible for the next one. */
  [hidden]{display:none!important}
  #scrim{position:fixed;left:0;right:0;top:0;height:300px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,.62),rgba(4,8,16,.28) 55%,rgba(4,8,16,0))}
  #scrimB{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,0),rgba(4,8,16,.5))}
  #hud{position:fixed;left:calc(16px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top));pointer-events:none;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.95)}
  #hud h1{margin:0;font-size:22px;font-weight:normal;letter-spacing:.04em}
  #hud .era{font-style:italic;font-size:14px;opacity:.85;margin:2px 0 8px}
  #perf{font-size:12px;line-height:1.5;opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
  #stats{font-size:12px;line-height:1.55;opacity:.92;font-family:ui-monospace,Menlo,Consolas,monospace}
  #log{position:fixed;left:16px;bottom:14px;z-index:2;font-size:13px;line-height:1.5;pointer-events:none;max-width:78vw;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  #log div{animation:fade 11s forwards}
  @keyframes fade{0%{opacity:0;transform:translateY(4px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #hint{position:fixed;right:16px;bottom:14px;font-size:12px;opacity:.5;pointer-events:none;text-align:right;line-height:1.5}
  #mapv{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 46%,rgba(6,10,18,.34),rgba(4,8,14,.72) 78%);
    -webkit-backdrop-filter:blur(2px) saturate(.75);backdrop-filter:blur(2px) saturate(.75)}
  #mapv h2{margin:0 0 10px;font-size:19px;font-weight:normal;letter-spacing:.06em;opacity:.95}
  #mapv h2 span{font-style:italic;font-size:13px;opacity:.6;letter-spacing:.02em;margin-left:8px}
  #mapwrap{position:relative;width:min(92vw,62vh);aspect-ratio:1;border-radius:3px;overflow:hidden;touch-action:none;
    border:1px solid rgba(240,228,200,.3);box-shadow:0 10px 44px rgba(0,0,0,.62),inset 0 0 60px rgba(0,0,0,.4)}
  #mapclose{position:fixed;right:calc(15px + env(safe-area-inset-right));top:calc(13px + env(safe-area-inset-top));z-index:7}
  #mapzoom{position:absolute;left:7px;bottom:7px;font-size:10px;letter-spacing:.08em;opacity:.82;
    font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;
    background:rgba(6,10,18,.55);border-radius:9px;padding:3px 8px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #mapc{display:block;width:100%;height:100%}
  #maplg{margin-top:12px;font-size:11px;line-height:1.9;opacity:.8;display:flex;flex-wrap:wrap;gap:4px 14px;
    justify-content:center;max-width:min(92vw,62vh);font-family:ui-monospace,Menlo,Consolas,monospace}
  #maplg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px;font-style:normal}
  #mapfoot{margin-top:9px;font-size:11px;opacity:.45;font-style:italic}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070a13;font-style:italic;letter-spacing:.05em;z-index:5;transition:opacity 1.2s}
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));
    width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(255,214,150,.09),rgba(240,235,220,.04) 58%,rgba(240,235,220,0) 74%);
    border:1px solid rgba(240,228,200,.2);box-shadow:inset 0 0 26px rgba(255,196,128,.07);
    transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(255,206,150,.42);
    box-shadow:inset 0 0 30px rgba(255,196,128,.14),0 0 18px rgba(255,180,110,.10)}
  /* Something within reach: the stick is the prompt, so there is nothing else to put on
     screen — and it has to read at a glance, on a phone, in daylight. Every other lit thing
     in this interface is amber, so this one is not: cyan is the colour of the ship's own
     hull lights and the waypoint, and against the warm UI it cannot be mistaken for a
     stick that merely happens to be under a thumb. A ring pings out of it on a slow beat. */
  #sticks .stick.hot{border-color:rgba(150,246,255,.95);border-width:2px;
    background:radial-gradient(circle,rgba(120,238,255,.16),rgba(120,238,255,.05) 58%,rgba(120,238,255,0) 74%);
    box-shadow:inset 0 0 40px rgba(110,230,255,.42),0 0 44px rgba(90,220,255,.5);
    animation:hotpulse 1.25s ease-in-out infinite}
  @keyframes hotpulse{0%,100%{box-shadow:inset 0 0 34px rgba(110,230,255,.34),0 0 26px rgba(90,220,255,.34)}
    50%{box-shadow:inset 0 0 46px rgba(150,246,255,.6),0 0 62px rgba(90,220,255,.72)}}
  #sticks .stick.hot::after{content:'';position:absolute;inset:-3px;border-radius:50%;
    border:2px solid rgba(150,246,255,.85);pointer-events:none;animation:hotping 1.25s ease-out infinite}
  @keyframes hotping{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.34);opacity:0}}
  #sticks .stick.hot .knob{background:radial-gradient(circle at 38% 32%,rgba(240,254,255,.92),rgba(120,238,255,.6) 58%,rgba(40,150,190,.34));
    border-color:rgba(210,250,255,.85);box-shadow:0 0 30px rgba(120,238,255,.85),inset 0 1px 3px rgba(255,255,255,.55)}
  #sticks .ico{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
    pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .22s,transform .22s;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
  #sticks .stick.hot .ico{opacity:1;transform:scale(1.08);filter:drop-shadow(0 0 7px rgba(120,238,255,.9))}
  #sticks .stick.hot .lbl{opacity:1;color:#bff4ff;letter-spacing:.24em;
    text-shadow:0 0 10px rgba(120,238,255,.8)}
  #stkL{left:calc(20px + env(safe-area-inset-left))} #stkR{right:calc(20px + env(safe-area-inset-right))}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 38% 32%,rgba(255,242,220,.55),rgba(255,196,124,.26) 58%,rgba(206,132,62,.14));
    border:1px solid rgba(255,226,188,.34);
    box-shadow:0 0 9px rgba(255,178,96,.16),inset 0 1px 3px rgba(255,255,255,.18);
    transition:transform .06s linear,box-shadow .18s}
  #sticks .stick.act .knob{box-shadow:0 0 20px rgba(255,186,110,.55),inset 0 1px 3px rgba(255,255,255,.4)}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-size:11px;
    color:#f2e4c8;opacity:.42;letter-spacing:.14em;font-variant:small-caps}
  /* one language for every chip in the interface, so nothing reads as a debug leftover */
  .tog{font-family:inherit;font-size:13px;color:#f0e7d4;background:rgba(240,235,220,.09);
    border:1px solid rgba(240,235,220,.26);border-radius:15px;padding:6px 13px;line-height:1;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .16s,border-color .16s}
  .tog.on{background:rgba(255,190,110,.28);border-color:rgba(255,200,130,.66)}
  .tog.icon{padding:6px 11px;letter-spacing:.06em}
  #ui{position:fixed;right:calc(15px + env(safe-area-inset-right));top:calc(13px + env(safe-area-inset-top));
    z-index:4;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #mini{width:104px;height:104px;display:block;border-radius:4px;border:1px solid rgba(240,228,200,.24);
    box-shadow:0 5px 20px rgba(0,0,0,.5),inset 0 0 24px rgba(0,0,0,.4);background:rgba(8,14,24,.5)}
  #btns{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
  #hudHead{pointer-events:auto;cursor:pointer;display:inline-block}
  #logT{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));z-index:3;opacity:.7}
  #log{bottom:46px}
  @media (max-width:640px){#hint{display:none}#log{font-size:12px;bottom:206px}#logT{bottom:176px}#mini{width:92px;height:92px}}
</style>

<body>
<div id="boot">growing a world…</div>
<div id="scrim"></div><div id="scrimB"></div>
<div id="hud"><div id="hudHead"><h1>Plutopia</h1><div class="era" id="era">The Quiet</div></div>
  <div id="hudBody" hidden><div id="stats"></div><div id="perf"></div></div></div>
<button id="logT" class="tog icon" title="the island's notes">notes</button>
<div id="log"></div>
<div id="hint">left stick walks · right stick looks · scroll or pinch to zoom<br>WASD / arrows also work · tap the ground to drop a spark</div>
<div id="sticks">
  <div class="stick" id="stkL"><div class="knob"></div><div class="lbl">MOVE</div></div>
  <div class="stick" id="stkR"><div class="knob"><svg class="ico" id="stkRIco" viewBox="0 0 40 40" fill="none">
    <ellipse cx="20" cy="24" rx="16" ry="6.2" fill="#ffdca8" opacity=".92"/>
    <path d="M9.5 22.5a10.5 9 0 0 1 21 0z" fill="#ffeecb"/>
    <ellipse cx="20" cy="24" rx="16" ry="6.2" stroke="#7a4a18" stroke-opacity=".5"/>
  </svg></div><div class="lbl">LOOK</div></div>
</div>
<div id="ui">
  <canvas id="mini" title="open the map"></canvas>
  <button id="ctlT" class="tog icon" title="controls">&#183;&#183;&#183;</button>
  <div id="btns" hidden><button id="flyB" class="tog">fly</button><button id="freeB" class="tog">free cam</button></div>
</div>
<div id="mapv" hidden><h2>Plutopia<span id="mapera"></span></h2>
<div id="mapwrap"><canvas id="mapc"></canvas><div id="mapzoom"></div></div><button id="mapclose" class="tog icon">close</button>
<div id="maplg"></div><div id="mapfoot">pinch to zoom &middot; drag to pan &middot; tap to set a waypoint</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- Loaders are vendored, not CDN: the model is Draco-compressed, so GLTFLoader needs a
     DRACOLoader and its decoder. Keeping them in-repo means no extra origin to trust and
     nothing to break if a CDN path moves. vendor/ is copied verbatim from three r128. -->
<script src="vendor/three/GLTFLoader.js"></script>
<script src="vendor/three/DRACOLoader.js"></script>
<script src="vendor/three/SkeletonUtils.js"></script>
<script>
(() => {
// ============================================================
//  Plutopia
//  A small planet with an island on it. Every species has one build()
//  (placeholder geometry) and one think() (behaviour), so real
//  assets drop in by replacing build() alone.
// ============================================================

// ---------- quality ----------
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const Q = {
  seg: MOBILE ? 240 : 384,
  grass: MOBILE ? 7000 : 21000,
  motes: MOBILE ? 420 : 620,
  shadow: MOBILE ? 1024 : 2048,
  bloomDiv: MOBILE ? 4 : 3,
  dpr: Math.min(devicePixelRatio, MOBILE ? 2 : 2)
};

const W = 240, SEA = 0, DAY = 110, GROW_T = 85;
// Shown in the HUD. Pages caches index.html, so a phone can sit on an old build while the
// repo has moved on — which once cost an afternoon arguing about which way a model faced.
// Bump it with anything that changes behaviour.
const BUILD = 'b41';
const WS = W / 170;              // landform coords were authored at W=170
const MAX = { tree: MOBILE ? 78 : 122, moss: 115, bloom: MOBILE ? 34 : 50, cairn: 7, grazer: 20, weaver: 14, drifter: 9, walker: 4, hopper: 34 };

const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const col = h => new THREE.Color(h).convertSRGBToLinear();

// ---------- noise ----------
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function hash3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, cc) => hash3(xi + a, yi + b, zi + cc);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v),
              lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w);
}
function fbm(x, y, o = 5) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }
function fbm3(x, y, z, o = 3) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise3(x * f, y * f, z * f); f *= 2.07; a *= .5; } return s; }

// ---------- terrain field ----------
const CENTERS = [[0.04, 0.02, 1.14], [-0.66, 0.58, 0.62]];
// named landforms — the island reads as a place rather than a lump of noise
// a range running along the north shoulder, not a cone in the middle
const RANGE = { ax: -0.44 * W, az: -0.30 * W, bx: 0.16 * W, bz: -0.52 * W, w: 30, h: 27, crest: 14 };
const SPIRE = { x: (RANGE.ax + RANGE.bx) / 2, z: (RANGE.az + RANGE.bz) / 2 };   // referenced for siting
let _sd = 0, _st = 0;
function segDT(px, pz, ax, az, bx, bz) {          // distance to a line segment, plus position along it
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az;
  const L2 = vx * vx + vz * vz;
  let t = L2 > 0 ? (wx * vx + wz * vz) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + vx * t, cz = az + vz * t;
  _sd = Math.hypot(px - cx, pz - cz); _st = t;
}
const MESA = { x: -104 * WS, z: 94 * WS, r: 42 * WS, h: 18 };
const LAGOON = { x: -30 * WS, z: 52 * WS, r: 42 * WS, d: 13 };
const CHASM = { x: -62 * WS, z: -58 * WS, r: 15 * WS, d: 25 };
const STACKS = [{ x: 122, z: -54, r: 8, h: 25 }, { x: 138, z: -38, r: 5, h: 16 }, { x: -66, z: -132, r: 7, h: 22 }, { x: 100, z: 100, r: 6.5, h: 18 }, { x: -146, z: 6, r: 5.5, h: 14 }]
  .map(o => ({ x: o.x * WS, z: o.z * WS, r: o.r * WS, h: o.h }));
// soft terracing: flat treads, rounded risers — strata instead of a smooth ramp
function terraceF(h, step) { const f = h / step, i = Math.floor(f), fr = f - i; return (i + smooth(.3, .7, fr)) * step; }
function height(x, z) {
  const nx = x / W, nz = z / W;
  let mask = 0;
  for (const [cx, cz, s] of CENTERS) {
    const dx = (nx - cx) / (0.62 * s), dz = (nz - cz) / (0.62 * s);
    const d = Math.sqrt(dx * dx + dz * dz);
    mask = Math.max(mask, 1 - d * d);
  }
  const base = (fbm(nx * 2.6 + 11.3, nz * 2.6 + 4.7) - 0.5) * 2;
  // broad, gently rolling interior — most of the island should be walkable ground
  let h = base * 4.6 + 9 * mask - 8.5 + mask * 9;
  h += (fbm(nx * 6.5 + 21, nz * 6.5 + 13, 4) - 0.5) * 5.2 * clamp(mask + .15, 0, 1);   // low hills
  h += (fbm(nx * 12 + 5, nz * 12 + 31, 3) - 0.5) * 2.4 * clamp(mask, 0, 1);            // hummocks
  h -= (1 - mask) * 10;
  // the range: a spine with several summits along its length
  segDT(x, z, RANGE.ax, RANGE.az, RANGE.bx, RANGE.bz);
  const rk = Math.max(0, 1 - _sd / RANGE.w), tAl = _st;
  if (rk > 0) {
    const peaks = .45 + .55 * Math.pow(Math.abs(Math.sin(tAl * Math.PI * 2.6 + 1.1)), .8);
    const wob = .8 + .4 * fbm(tAl * 7 + 4, _sd * .04, 3);
    h += Math.pow(rk, 1.8) * RANGE.h * peaks * wob;
    h += Math.pow(Math.max(0, 1 - _sd / (RANGE.w * .34)), 1.4) * RANGE.crest * peaks;
    h += Math.max(0, fbm(nx * 7 + 3.1, nz * 7 + 8.9, 4) - .52) * 34 * Math.pow(rk, 1.2);  // rocky detail
  }
  // flat-topped mesa on the sister isle
  const md = Math.hypot(x - MESA.x, z - MESA.z);
  const mk = smooth(MESA.r, MESA.r * .6, md);
  if (mk > 0) h = lerp(h, MESA.h + (fbm(x * .03 + 9, z * .03, 3) - .5) * 3.5, mk * .92);
  // a lagoon bitten out of the south shore
  const ld = Math.hypot(x - LAGOON.x, z - LAGOON.z);
  h -= Math.pow(Math.max(0, 1 - ld / LAGOON.r), 1.4) * LAGOON.d;
  // sea stacks standing off the coast
  for (let i = 0; i < STACKS.length; i++) {
    const st = STACKS[i], d = Math.hypot(x - st.x, z - st.z), R = st.r * 1.7;
    if (d < R) h = Math.max(h, Math.pow(1 - d / R, .5) * st.h - 3);
  }
  // a deep chasm, steep enough that nothing walks into it
  const cd = Math.hypot(x - CHASM.x, z - CHASM.z);
  h -= Math.pow(Math.max(0, 1 - cd / CHASM.r), .65) * CHASM.d;
  // strata on the mid slopes
  const tw = smooth(7, 13, h) * (1 - smooth(26, 34, h)) * .45;
  if (tw > 0) h = lerp(h, terraceF(h, 2.8), tw);
  // fine detail — new in v2, this is what kills the blocky read
  h += (fbm(nx * 26 + 2.2, nz * 26 + 7.4, 4) - .5) * 1.5 * clamp(mask + .3, 0, 1);
  h += (fbm(nx * 60, nz * 60, 3) - .5) * .55;
  // Every chart direction meets at the far pole, so the last stretch before it settles to a
  // single depth: otherwise the one vertex all the spokes share would want a different
  // height depending on which spoke asked. It is open ocean out there, nine hundred units
  // from the island, and nothing but the mesh has ever looked at it.
  const rr = Math.hypot(x, z), rM = Math.PI * W;
  if (rr > rM * .86) h = lerp(h, -18.5, smooth(rM * .86, rM, rr));
  return h;
}
function slope(x, z) { const e = 1.5; const dx = height(x + e, z) - height(x - e, z), dz = height(x, z + e) - height(x, z - e); return Math.sqrt(dx * dx + dz * dz) / (2 * e); }
function groundY(x, z) { return Math.max(height(x, z), SEA); }
function isLand(x, z) { return height(x, z) > SEA + 0.6; }
function normalAt(x, z) { const e = 1.2, dx = height(x + e, z) - height(x - e, z), dz = height(x, z + e) - height(x, z - e); return new THREE.Vector3(-dx, 2 * e, -dz).normalize(); }

// ---------- the planet ----------
// The world is still authored, simulated and reasoned about as a flat chart in (x, z):
// height(), the obstacle field, every steering behaviour, the map, and every distance that
// has ever been tuned. Only the last step before drawing wraps that chart onto a sphere,
// which is why nothing below this line had to learn any spherical trigonometry.
//
// The projection is azimuthal equidistant with the chart origin at the north pole: a chart
// point r from the origin lands at polar angle r / R, so how far you walk is exactly how
// far you have gone, everywhere on the globe. What it costs is spacing *around* the pole,
// which shrinks by sin(theta)/theta -- 1 at the origin, .82 out at the sister isle, 0 at

// The other half of the budget. Frustum culling only removes what is off screen; a third
// person camera looking across the island keeps most of it in view, and moss two hundred
// units away is a couple of pixels. Switch the small things off past a distance chosen for
// their size, so what the renderer is asked to draw depends on where you are standing and
// not on how long the island has been running. Trees and the great tree are the skyline and
// are never touched.
const FAR = MOBILE
  ? { MossTuft: 100, Bloom: 135, Litter: 115, Stump: 135, Mound: 115, Hopper: 115, Skimmer: 135, Burrower: 145, Weaver: 155, Drifter: 165, Grazer: 195, Walker: 300, Leviathan: 320 }

function cullFar(dt) {
  if ((farT -= dt) > 0) return;
  farT = .3;
  const x = cam.tgt.x, z = cam.tgt.z;
  for (const list of [world.plants, world.structures, world.creatures])
    for (const o of list) {
      const r = FAR[o.constructor.name];
      if (!r || !o.alive || !o.g) continue;
      const dx = o.pos.x - x, dz = o.pos.z - z;
      o.g.visible = dx * dx + dz * dz < r * r;

}

// Nothing the island makes may accumulate for ever. Felling a tree used to leave a stump
// that was never removed and a pile of crown litter that nothing even held a reference to,
// so a session left running for hours climbed instead of settling. Both now weather: past
// the keep count the oldest sink and go, and the world holds a steady population of them.
const LEAVINGS = { keep: 24, fade: 9 };
let leavingT = 0;
function weatherLeavings(dt) {
  if ((leavingT -= dt) > 0) return;
  leavingT = 2;
  for (const K of [Stump, Litter]) {
    const a = world.structures.filter(o => o.alive && o instanceof K && o.going === undefined);
    if (a.length <= LEAVINGS.keep) continue;
    a.sort((p, q) => p.born - q.born);
    for (let i = 0; i < a.length - LEAVINGS.keep; i++) a[i].going = 0;
  }

// Returns true on the frame it finally goes, so the caller can leave something behind.
function weatherStep(o, dt) {
  if (o.going === undefined) return false;
  o.going += dt;
  const k = 1 - o.going / LEAVINGS.fade;
  if (k <= 0) { o.alive = false; return true; }
  o.g.scale.setScalar(k * k);            // it sinks into the ground rather than blinking out
  return false;
}

// ---------- models ----------
// Every GLB out of Blender so far has needed the same two repairs, so they live here
// rather than on any one model. alphaMode BLEND arrives on fully opaque materials and
// costs depth writing, which lets a double-sided body draw its own back faces over its
// front. And a dark surface with no light on it goes to pure black, which reads as the
// body vanishing; emitting a fraction of its own colour gives it a floor. Keep the lift
// well under the 0.88 bloom threshold or models start to glow at night.
const MODEL = {
  forceOpaque: true, ambientLift: .45, rateMin: .6, rateMax: 2.6,
  // Where the walk gives way to the run, as a fraction of the thing's own top speed —
  // not of the clip's authored pace, which is a different number entirely and much smaller.
  runAt: .42, runFull: .74,
  moveAt: .015, moveFull: .13,        // and where idle gives way to the walk
};
// One cache per URL. The GLB is fetched once, prepared once, measured once; every user
// after that gets a clone that shares the geometry and materials. Measuring is the
// expensive part (every vertex through boneTransform), so it must not happen per creature.
const MODELS = {};
function loadModel(url, cb) {
  let e = MODELS[url];
  if (e) { if (e.ready) cb(e); else if (!e.failed) e.waiting.push(cb); return; }
  if (!THREE.GLTFLoader) return;                        // no loader: callers keep their placeholder
  e = MODELS[url] = { ready: false, failed: false, waiting: [cb] };
  const draco = new THREE.DRACOLoader(); draco.setDecoderPath('vendor/draco/');
  const loader = new THREE.GLTFLoader(); loader.setDRACOLoader(draco);
  loader.load(url, gltf => {
    e.root = gltf.scene; e.anims = gltf.animations;
    prepModel(e.root);
    // Measure in the idle pose, not the bind pose. Mixamo exports keep the bind pose hips
    // at the origin and the clips a hip-height above it, so a model normalised to its bind
    // pose stands a hip-height in the air the moment it starts to idle.
    e.box = idlePoseBounds(e.root, e.anims);              // unscaled: each user picks its own height
    e.strides = {}; e.floors = {};
    e.ready = true;
    for (const f of e.waiting) f(e);
    e.waiting.length = 0;
  }, undefined, err => { e.failed = true; e.waiting.length = 0; console.warn('model failed, keeping placeholder:', url, err); });
}

      if (rp.nx || rp.nz) {   // stop pushing into what just stopped you, but keep sliding along it
        const l = Math.hypot(rp.nx, rp.nz) || 1, ux = rp.nx / l, uz = rp.nz / l;
        const into = player.vx * ux + player.vz * uz;
        if (into < 0) { player.vx -= ux * into; player.vz -= uz * into; }
      }
    }
    const h = height(player.pos.x, player.pos.z);
    // Deep water under you is not the same as being in it. Keyed off the terrain alone, a
    // jump off a cliff went into the swim — slow, flat — while still ten units in the air.
    const wy = waveY(player.pos.x, player.pos.z);
    const inWater = h < SEA - .3 && player.pos.y < wy + .5;
    player.swim = lerp(player.swim, inWater ? 1 : 0, Math.min(1, dt * 4));
    // How far the root sits under the surface. The swim clip lays him almost flat — his
    // body occupies 1.46 units where the idle occupies 2.83 — so a depth tuned for the
    // upright tread left him riding on the top of the water with a hand's width under him.
    // Derive it from each clip's own posed extent instead, so he sits in the water at the
    // fraction above whatever the animation happens to do.
    const sp = player.rigH && player.rigH.span, rg = player.rigH;
    let depth = lerp(1.35, .55, player.moving);   // the primitive body's fallback
    if (sp && sp.swim && sp.swimIdle) {
      const sink = (b, frac) => rg.baseY + (b.lo + (b.hi - b.lo) * frac) * rg.scale;
      depth = lerp(sink(sp.swimIdle, SWIM.tread), sink(sp.swim, SWIM.fwd), player.moving);
    }
    // Over deep water the dry target is the surface itself — not flat SEA — so he falls onto
    // the actual swell and the swim picks up from there rather than hovering above a trough.
    // deckY, not height: whatever the ship can land on he can stand on, which right now
    // means the floating isle. Step out of a ship parked on it and the ground is there.
    const deck = Math.max(deckY(player.pos.x, player.pos.z, player.pos.y),
                          standOn(player.pos.x, player.pos.z, player.pos.y));
    const target = lerp(Math.max(deck, wy), Math.max(h, wy - depth), player.swim);
    player.gy = lerp(player.gy, target, Math.min(1, dt * (player.swim > .5 ? 6 : 14)));   // ground snaps; water bobs
    const canLead = RIG.jumpLead > 0 && player.rigH && player.rigH.acts.jumpStart;
    // In the water there is nothing to crouch against, so a surface leap goes straight up
    // with less push — enough to break out and land back in, or onto a bank.
    if (player.jump && player.swim > .5 && player.pos.y > waveY(player.pos.x, player.pos.z) - 1.6) {
      player.vy = 15; player.grounded = 0; player.hang = 1;
    } else if (player.jump && player.grounded && player.swim < .5 && player.leadT <= 0) {
      if (canLead) player.leadT = RIG.jumpLead;             // crouch first, launch when it lands
      else { player.vy = 25; player.grounded = 0; player.hang = 1; }
    }
    player.jump = 0;
    if (player.leadT > 0) { player.leadT -= dt; if (player.leadT <= 0) { player.vy = 25; player.grounded = 0; player.hang = 1; } }
    const wasGrounded = player.grounded;
    player.vy -= 32 * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= player.gy) { player.pos.y = player.gy; player.vy = 0; player.grounded = 1; }
    if (player.grounded && !wasGrounded && player.airT > .12 && player.swim < .5) player.landT = .55;   // touched down after a real jump
    if (player.landT > 0 && player.speed > 7) player.landT = 0;   // running landings roll into the run instead
    player.airT = player.grounded ? 0 : player.airT + dt;
    if (player.landT > 0) player.landT -= dt;
  } else { player.jump = 0; player.vy = 0; player.grounded = 0; player.leadT = 0; player.landT = 0; player.vx = player.vz = 0; player.wmag = 0; }
  const g = player.g;
  g.position.copy(player.pos);
  // heading is where the stick points; faceH is where the body has got round to yet
  { let d = player.heading - player.faceH; d = Math.atan2(Math.sin(d), Math.cos(d)); player.faceH += d * Math.min(1, dt * 9); }
  if (!player.fly && player.swim < .5) { alignTo(g, player.pos.x, player.pos.z, .4); g.rotateY(player.faceH); }
  else if (!player.fly) {   // in the water: lie along the wave, a little more so at speed
    const n = waveNormal(player.pos.x, player.pos.z);
    g.quaternion.setFromUnitVectors(_wup, n.lerp(_wup, 1 - lerp(.4, .8, player.moving)).normalize());
    g.rotateY(player.faceH);
  }
  else g.rotation.set(0, player.faceH, 0);
  const bobT = world.clock * 9;
  // A walk clip carries its own bounce. Without one — the placeholder, or a model exported
  // with no animation at all — the bob is the only thing keeping it from gliding.
  const animated = player.acts && player.acts.walk;
  const bob = animated ? 0 : Math.abs(Math.sin(bobT)) * .12 * player.moving;
  g.position.y += bob + (player.fly ? Math.sin(world.clock * 1.6) * .25 : 0);
  player.speed = dt > 0 ? Math.hypot(player.pos.x - _prevP.x, player.pos.z - _prevP.z) / dt : 0;
  updateRig(dt);
  // airborne: tuck the legs, then squash a little on landing
  player.hang = lerp(player.hang || 0, player.grounded ? 0 : 1, Math.min(1, dt * 10));
  if (player.grounded && player.vy === 0 && (player.land || 0) > 0) player.land = Math.max(0, player.land - dt * 3.2);
  if (!player.grounded) player.land = 1;
  for (const l of player.legs)
    l.hip.rotation.x = lerp(Math.sin(bobT + (l.sx > 0 ? 0 : Math.PI)) * .7 * player.moving, -1.15 + l.sx * .25, player.hang);
  const hasJump = player.rigH && player.rigH.acts.jumpAir;
  const squash = hasJump ? 1 : player.grounded ? 1 - (player.land || 0) * .16 : 1 + player.hang * .07;
  g.scale.set(2 - squash, squash, 2 - squash);
}

// Blend idle against walk by how fast the creature is actually travelling, and run the
// walk cycle at the speed it was authored for so the feet do not skate.
// A light that tracked the body exactly read as a prop bolted to his shoulder. This one is
// a creature: it is pulled toward a spot beside him by a spring, so it lags when he sets
// off and overshoots when he stops; it drifts on its own noise; and now and then it darts.
// A lantern is a hard thing to hold next to a face. The light falls off with the square of
// the distance, so a pass at one unit is four times the light of a pass at two, and at night
// the lamp is already at its brightest and the bloom at its most eager — which is how it
// came to swallow him whole. Three things keep it civil: it rests further out, it veers off
// before it can reach him, and whatever closeness it still manages, it pays for in output.
const FAIRY = {
  rest: 2.3,      // how far out the spring's anchor sits, measured on the ground plane
  space: 1.7,     // it can never be nearer than this to the body
  veer: 3.2,      // and it starts turning away from here in
  veerK: 30,      // how hard
  dimAt: 1.4, dimTo: 3.0, dimTo0: .16,   // full output beyond dimTo, a sixth of it at dimAt
};
const fairy = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(), off: new THREE.Vector3(2.2, 2.4, -.5),   // replaced from the rig's own bounds once it loads
  t: rnd(100), dart: rnd(2, 5), want: new THREE.Vector3(), lit: 1,
};
const fairyTrail = new PSys({
  n: MOBILE ? 90 : 170, life: 1.5, rate: 26, gy: .18, drag: 1.6, additive: true, a0: .85,
  c0: '#ffe6a8', c1: '#ffb45a', s0: .5, s1: .02,
  spawn: (p, v) => {
    p.copy(fairy.pos).add(new THREE.Vector3(rnd(-.13, .13), rnd(-.13, .13), rnd(-.13, .13)));
    v.set(rnd(-.25, .25), rnd(-.15, .35), rnd(-.25, .25)).addScaledVector(fairy.vel, -.09);
  },
});
// Same hard push-out the creatures use: correct only the radial overlap, so motion along
// the surface survives and you slide round a trunk instead of sticking to it.
function resolvePlayer(x, z, feetY) {
  let nx = 0, nz = 0;
  for (let pass = 0; pass < 3; pass++) {
    obNear(x, z, player.rad + 6, o => {
      if (o.r < OB_PLAYER.minOb) return;
      if (feetY + OB_PLAYER.climb > o.top) return;   // low enough to walk up onto: nothing to hit
      const r = o.r + player.rad;
      let dx = x - o.x, dz = z - o.z, d = Math.hypot(dx, dz);
      if (d < r) {
        if (d < 1e-3) { dx = 1; dz = 0; d = 1; }
        x = o.x + dx / d * r; z = o.z + dz / d * r;
        nx += dx / d; nz += dz / d;
      }
    });
  }
  return { x, z, nx, nz };
}

// The highest thing under his feet that he could have got onto: a footprint he is inside
// whose top is no more than a step above him. Anything that registered a real top is fair
// game -- rocks, stumps, mounds, driftwood -- while trunks, cairns and the great tree
// registered Infinity and stay things you walk round.
function standOn(x, z, feetY) {
  let top = -1e9;
  obNear(x, z, player.rad + 3, o => {
    if (!isFinite(o.top) || o.top <= top || o.top > feetY + OB_PLAYER.climb) return;
    const r = obRad(o) + player.rad * .5;        // his feet, not his shoulders
    if (Math.hypot(x - o.x, z - o.z) < r) top = o.top;
  });
  return top;
}

function updateFairy(dt) {
  const p = player, f = fairy;
  if (p.aboard) {   // she rides in with him: parked in the hull, lamp out, no trail
    const sh = world.ship; if (sh) f.pos.copy(sh.pos).add(new THREE.Vector3(0, 1.6, 0));
    f.vel.set(0, 0, 0); p.lamp.position.copy(f.pos); p.lamp.visible = false; fairyTrail.rate = 0; f.lit = 0; return;
  }
  f.t += dt;
  // the anchor: beside and above him, on his left or right as he turns
  const c = Math.cos(p.faceH), sn = Math.sin(p.faceH);
  f.want.set(
    p.pos.x + f.off.x * c + f.off.z * sn + Math.sin(f.t * .7) * 1.1 + Math.sin(f.t * 1.63) * .35,
    p.pos.y + f.off.y + Math.sin(f.t * 1.9) * .38 + Math.sin(f.t * .53) * .5,
    p.pos.z - f.off.x * sn + f.off.z * c + Math.cos(f.t * .61) * 1.1 + Math.cos(f.t * 1.31) * .3);
  // a soft spring with heavy damping: it never quite catches up, and drifts past on a stop
  // stiffer than it looks: the damping below is what makes it lag, not a weak spring
  const k = p.free ? 26 : 11;
  f.vel.x += (f.want.x - f.pos.x) * k * dt;
  f.vel.y += (f.want.y - f.pos.y) * k * dt;
  f.vel.z += (f.want.z - f.pos.z) * k * dt;
  f.vel.multiplyScalar(Math.max(0, 1 - 4.2 * dt));
  if ((f.dart -= dt) <= 0) {   // the sudden little flit that makes it read as alive
    f.dart = rnd(1.6, 4.5);
    f.vel.x += rnd(-2.6, 2.6); f.vel.y += rnd(-1, 2.6); f.vel.z += rnd(-2.6, 2.6);
  }
  f.pos.addScaledVector(f.vel, dt);
  // It is a physical little thing, so it does not pass through him — but a hard boundary on
  // its own just parks it against the surface. Steering off first is what reads as alive:
  // it curves away from the body well before it arrives, and the push-out is only there to
  // catch a dart that beat the turn.
  {
    const dx = f.pos.x - p.pos.x, dz = f.pos.z - p.pos.z, d = Math.hypot(dx, dz);
    const ux = d > 1e-3 ? dx / d : 1, uz = d > 1e-3 ? dz / d : 0;
    if (f.pos.y > p.pos.y - .2 && f.pos.y < p.pos.y + RIG.height * 1.05) {
      if (d < FAIRY.veer) {
        const k = 1 - d / FAIRY.veer;
        f.vel.x += ux * k * k * FAIRY.veerK * dt; f.vel.z += uz * k * k * FAIRY.veerK * dt;
      }
      if (d < FAIRY.space) {
        f.pos.x = p.pos.x + ux * FAIRY.space; f.pos.z = p.pos.z + uz * FAIRY.space;
        const inward = f.vel.x * ux + f.vel.z * uz;   // cancel only the part heading into him
        if (inward < 0) { f.vel.x -= ux * inward; f.vel.z -= uz * inward; }
      }
    }
  }
  // a leash, so a dart during a sprint can never strand it half a field away
  const away = f.pos.distanceTo(f.want);
  if (away > 5.5) { f.pos.lerp(f.want, 1 - 5.5 / away); f.vel.multiplyScalar(.5); }
  const fl = groundY(f.pos.x, f.pos.z) + .5; if (f.pos.y < fl) { f.pos.y = fl; f.vel.y = Math.abs(f.vel.y) * .4; }
  p.lamp.position.copy(f.pos);
  p.lamp.visible = !p.free;
  // Distance to the body itself — the standing line from his feet to the top of his head,
  // not to a point — and the lamp gives up output as it closes on him. The glow card shrinks
  // with it: at ten units across it was wider than he is, and that is what blew out.
  const cy = clamp(f.pos.y, p.pos.y, p.pos.y + RIG.height);
  const near = Math.hypot(f.pos.x - p.pos.x, f.pos.y - cy, f.pos.z - p.pos.z);
  f.lit = FAIRY.dimTo0 + (1 - FAIRY.dimTo0) * smooth(FAIRY.dimAt, FAIRY.dimTo, near);
  p.light.intensity = (1.1 + world.night * 3.2) * f.lit;
  p.gl.scale.setScalar((4 + world.night * 6) * (.45 + .55 * f.lit));
  p.gl.material.opacity = .75 * (.4 + .6 * f.lit);
  fairyTrail.rate = p.free ? 0 : 18 + Math.min(34, f.vel.length() * 3.4);
}

isle.fairy = fairy; isle.stick = stick; isle.cam = cam; isle.camS = camS; isle.planet = PLANET;   // all defined after the handle, so attached here

function updateRig(dt) {
  const p = player;
  stepRig(p.rigH, dt, p.speed, !p.fly && p.swim < .5 && p.grounded, {
    top: p.swim > .5 ? MOVE.swimMax : MOVE.max,
    swim: p.swim, air: !p.fly && !p.grounded && p.leadT <= 0 && p.swim < .5,
    // The landing clip is planted, so at speed it slides. Fade it out as the ground speed
    // rises and let the run carry the landing instead. A proper roll clip would be better.
    start: p.leadT > 0, landK: p.landT > 0 ? smooth(0, .12, p.landT) * clamp(1 - p.speed / 7, 0, 1) : 0,
  });
}

const ray = new THREE.Raycaster();
function tap(cx, cy) {
  ray.setFromCamera({ x: cx / innerWidth * 2 - 1, y: -(cy / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObject(terrain)[0]; if (!hit) return;
  const p = hit.point;
  if (height(p.x, p.z) < SEA) { world.effects.push(new Burst(p.x, SEA + .3, p.z, '#cff4ff', 10, 1)); return; }
  world.sparks.push(new Spark(p.x, p.z));
  world.effects.push(new Burst(p.x, groundY(p.x, p.z) + 2, p.z, '#fff0b0', 12, 1));
}
// Mobile browsers fire resize with transient values mid-gesture and sometimes skip the
// last one, which strands the canvas at the wrong size. So this is idempotent and the
// frame loop calls it too: whatever the events do, the next frame puts it right.
let _vw = 0, _vh = 0;
function syncSize() {
  const w = innerWidth, h = innerHeight;
  if (w === _vw && h === _vh) return;
  _vw = w; _vh = h;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  rtScene.setSize(w * Q.dpr, h * Q.dpr);
  rtA.setSize(w * Q.dpr / Q.bloomDiv, h * Q.dpr / Q.bloomDiv);
  rtB.setSize(w * Q.dpr / Q.bloomDiv, h * Q.dpr / Q.bloomDiv);
  motesUni.uScale.value = h * .5;
  // Streaks share the psys list but are instanced quads with no uScale — the old
  // resize handler assumed every psys was a point sprite and threw on every resize.
  for (const ps of world.psys) { const u = ps.mat.uniforms.uScale; if (u) u.value = h * .5; }
}
addEventListener('resize', syncSize);
addEventListener('orientationchange', syncSize);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', syncSize);
  visualViewport.addEventListener('scroll', syncSize);
}

// ---------- HUD ----------
const statsEl = document.getElementById('stats'), eraEl = document.getElementById('era'), perfEl = document.getElementById('perf');
// ---------- waypoints ----------
// A mark you drop on the map and then walk to. It has to be findable from the ground, so it
// is a beam you can see over a ridge, a bobbing pulse at its foot, a ring on the grass, and
// a line of motes running from you to it — the beam says where, the motes say which way.
// N is the cap; `gap` is what actually decides how many you see. Spreading a fixed 44 dots
// over whatever the distance happens to be made a dashed line at arm's length and a solid
// one across the island. A fixed spacing reads as a trail either way.
const WAY = { g: null, at: null, t: 0, uni: null, trail: null, N: 44, gap: 4.6 };
function buildWaypoint() {
  const g = new THREE.Group(); g.visible = false; scene.add(g); WAY.g = g;
  const uni = { uT: { value: 0 }, uC: { value: col('#7fd8ff') } }; WAY.uni = uni;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.7, 1.5, 34, 14, 1, true),
    new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending, uniforms: uni,
      vertexShader: 'varying float vY; void main(){ vY = uv.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform float uT; uniform vec3 uC; varying float vY;\n' +
        'void main(){ float fade = pow(1.0 - vY, 1.7);\n' +
        '  float run = 0.55 + 0.45 * sin(vY * 9.0 - uT * 2.6);\n' +
        '  gl_FragColor = vec4(uC, fade * run * 0.72); }' }));
  beam.position.y = 17; beam.frustumCulled = false; g.add(beam);
  const mark = new THREE.Mesh(new THREE.OctahedronGeometry(.62, 0),
    new THREE.MeshBasicMaterial({ color: col('#bff0ff'), transparent: true, opacity: .95 }));
  mark.position.y = 2.4; g.add(mark); WAY.mark = mark;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.2, .09, 6, 32),
    new THREE.MeshBasicMaterial({ color: col('#7fd8ff'), transparent: true, opacity: .6 }));
  ring.rotation.x = Math.PI / 2; ring.position.y = .25; g.add(ring); WAY.ring = ring;
  g.add(WAY.glow = glow('#8fe0ff', 7, .42));  WAY.glow.position.y = 2.4;
  const gm = new THREE.BufferGeometry();
  gm.setAttribute('position', new THREE.BufferAttribute(new Float32Array(WAY.N * 3), 3));
  WAY.trail = new THREE.Points(gm, new THREE.PointsMaterial({ map: glowTex, color: col('#9fe6ff'),
    size: 1.5, sizeAttenuation: true, transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false }));
  WAY.trail.frustumCulled = false; WAY.trail.userData.flat = true; scene.add(WAY.trail);
}
function setWaypoint(w) {
  if (!WAY.g) buildWaypoint();
  MAP.way = w ? { x: w.x, z: w.z } : null;
  WAY.at = MAP.way;
  WAY.g.visible = !!MAP.way; WAY.trail.visible = !!MAP.way;
  if (MAP.way) {
    WAY.g.position.set(MAP.way.x, groundY(MAP.way.x, MAP.way.z), MAP.way.z);
    world.effects.push(new Burst(MAP.way.x, WAY.g.position.y + 1.4, MAP.way.z, '#9fe6ff', 10, 1.2));
    logMsg('A mark on the map, and a light on the ground to match.');
  }
}
function updateWaypoint(dt) {
  if (!WAY.g || !WAY.at) return;
  const t = WAY.t += dt, p = player.pos;
  WAY.uni.uT.value = t;
  WAY.mark.position.y = 2.4 + Math.sin(t * 2.2) * .38;
  WAY.mark.rotation.y = t * .9; WAY.mark.rotation.x = Math.sin(t * .7) * .25;
  const pulse = .5 + .5 * Math.sin(t * 2.2);
  WAY.ring.scale.setScalar(1 + pulse * .5);
  WAY.ring.material.opacity = .55 * (1 - pulse * .7);
  WAY.glow.scale.setScalar(5 + pulse * 3 + world.night * 4);
  // the motes run from him to the mark, so the line reads as a direction and not a fence
  const a = WAY.trail.geometry.attributes.position;
  const dx = WAY.at.x - p.x, dz = WAY.at.z - p.z, d = Math.hypot(dx, dz);
  const near = Math.min(1, d / 8);
  const span = Math.max(0, d - 4.5);
  const n = clamp(Math.round(span / WAY.gap), 2, WAY.N);
  WAY.trail.geometry.setDrawRange(0, n);       // the rest of the buffer is simply not drawn
  for (let i = 0; i < n; i++) {
    const f = ((i / n) + t * .22) % 1, k = 2.5 + f * span;
    const x = p.x + dx / (d || 1) * k, z = p.z + dz / (d || 1) * k;
    planetPos(x, groundY(x, z) + .7 + Math.sin(f * 6.283 + t) * .18, z, _wgV);
    a.array[i * 3] = _wgV.x; a.array[i * 3 + 1] = _wgV.y; a.array[i * 3 + 2] = _wgV.z;
  }
  a.needsUpdate = true;
  WAY.trail.material.opacity = .75 * near;
  WAY.trail.visible = d > 5;
  // Walk through it and it is spent. Leaving it standing on top of him was the one thing
  // that made the mark feel like scenery rather than something he had set himself.
  if (d < (player.aboard ? 8 : 2.6)) {
    world.effects.push(new Burst(WAY.at.x, groundY(WAY.at.x, WAY.at.z) + 2.2, WAY.at.z, '#9fe6ff', 14, 1.4));
    setWaypoint(null); drawMap();
    logMsg('He reached the mark, and it went out.');
  }
}

// ---------- the map ----------
// Drawn from the terrain's own vertex colours and heights rather than re-sampled or drawn
// by hand, so it is the island you are standing on and cannot drift out of step with it.
// Built once, on first open, into an offscreen image; the markers are the only per-frame
// work. Filling it in as you explore is a mask composited over this image — the reason the
// terrain and the markers are kept in separate passes.
const MAP = {
  open: false, img: null, N: 0,
  // What the big map is looking at: a centre in world coordinates and how many world units
  // fit across it. The minimap always uses the whole island; only the big one moves.
  // The terrain mesh is 2 units a vertex, so magnifying the image is exactly the
  // interpolation the ground itself does — there is no finer terrain to render. Detail
  // comes from showing more things instead, which `lod` picks out.
  view: { cx: 0, cz: 0, span: 0 }, lod: 0, way: null,
  sea0: col('#5b93ad'), sea1: col('#12314a'),   // shallows and deep water
  light: { x: -.62, z: -.68 },                  // relief lit from the north-west, as maps are
};
function buildMapImage() {
  // The terrain mesh is a polar grid wrapped on the planet, so the map reads the chart point
  // and the chart height each vertex was built from rather than where it ended up in the
  // world. The spokes fan apart on the way out -- under a pixel between them at the origin,
  // three units by the sister isle against a raster cell of one and a quarter -- so binning

      if (c.alive && c instanceof Leviathan && c.depth < 2.2) push(c.rx, c.rz, Math.sin(c.heading), Math.cos(c.heading));
    }
    for (let i = n; i < 4; i++) wk[i].set(0, 0, 0, 0);
  }
  renderPost();

  if (!booted) { booted = true; const b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 1300); }
}
requestAnimationFrame(frame);
})();
</script>
