<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Plutopia</title>
<!-- Add to Home Screen. iOS reads the apple-* tags and the touch icon; everything else
     reads the manifest. The icon is cropped out of its bezel: iOS masks its own corners. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plutopia">
<!-- BLACK-TRANSLUCENT, HIS CALL: THE STRIP GOES WHERE THE FINGERS ARE.
     iOS gives an installed web app the screen minus the status bar and there is no arranging
     of the page that gets those sixty points back -- his c87 panel settled it, a canvas
     measuring 0..1002 with its bottom seventy unpainted. So the only question is which end of
     the screen loses them, and both answers are one word in this tag.
     `default` lays the view out below the status bar: the picture reaches the bottom and the
     strip is at the top, with the clock in it. `black-translucent` puts the view at y=0: the
     art runs behind the status bar and the strip is at the bottom. He wants the bottom, where
     his thumbs already are and where the sticks sit over it anyway.
     IT IS READ AT INSTALL, NOT AT LAUNCH. Changing it does nothing to an icon that is already
     on the Home Screen; the icon has to be deleted and re-added. That is what actually landed
     the last change, not the build that carried it.
     The rest of the old note, which argued the other way round, is below and still true about
     the mechanism. -->
<!-- NOT black-translucent, AND THIS IS THE BAND.
     His c87 panel: cv 0..1002, h 1002, inline h "1002px" -- the lens is exactly the height of
     the glass and the band is still 179 device pixels, unmoved since the first build that had
     it. So it was never a sizing problem, it is a CLIP: the picture is the right size and
     something cuts it off at 932. body 932 / html 932 on the same card says what: the WEB VIEW
     is 932 CSS px tall on a 1002 CSS px screen, and the 70 below it is not the page at all.
     iOS fills that strip by sampling the page's background colour, which is why it followed
     every colour I put on html and body -- black, then magenta, then lime -- while no element
     could ever reach it.
     black-translucent is what makes the view short. It is supposed to hand the app the whole
     screen; on a Home Screen app it hands it the screen MINUS the status bar and then places
     it at the top, so the deficit lands at the bottom: 852 - 59 = 793pt, which at his 0.85
     page zoom is 932 CSS px exactly. Without it the view is laid out below the status bar and
     is the right height, and the picture reaches the bottom of the screen. The trade is the
     status bar gets its own strip at the top instead of the art running behind it -- which is
     what an app looks like, rather than what a bug looks like. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070418">
<style>
  /* OVERFLOW:VISIBLE ON THE ROOT, and this is the one mechanism that fits the evidence.
     Measured off his four photographs: the band is 179 device pixels in every one of them --
     the studio splash and the title screen, before the fix and after it. Exactly 70 CSS px,
     which is 1002 minus 932. Two different elements, overridden two different ways (the lens
     by --lensH, the splash by !important), both still stopping dead at the same pixel.
     Nothing about either element explains that. The VIEWPORT does: `overflow` on the root
     propagates to the viewport, and the viewport's clip is the LAYOUT viewport. So every
     fixed element in this file, however tall it is told to be, has been sliced off at 932 --
     which is why sizing them bigger has never once moved the band.
     Nothing here can scroll without it: fixed elements contribute no scrollable overflow, and
     every element in this file is fixed. touch-action and overscroll-behavior stay. */
  html,body{margin:0;height:100%;overflow:visible;background:#070418;font-family:Georgia,"Iowan Old Style",serif;color:#f0e7d4;
    touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  /* ONE BOX, AND IT IS THE ONE YOU CAN SEE.
     "The screen moves up": at the very beginning nothing is wrong, and then the whole picture
     shifts and leaves a band along the bottom. That is iOS moving its URL bar, and the reason
     it reaches the game at all is that a `position:fixed` element does NOT resolve inset:0
     against what is on screen -- it resolves it against the LAYOUT viewport, which on iOS is a
     different height from the visual one for as long as that bar is in motion. syncSize has
     read visualViewport for the render buffer since c33, so the drawing was already the right
     shape; the boxes it was being shown in were not, and neither was anything else fixed --
     the boot card, the studio splash, the sticks, the HUD.
     Fixing them one at a time would be nine rules and a tenth one missed. Instead: an element
     with a TRANSFORM becomes the containing block for every fixed descendant, so giving body
     one makes body the viewport as far as this whole file is concerned -- and body is sized
     and offset from visualViewport in syncSize, in one place. translate(0,0) is what it is
     nearly all the time; it is not a no-op, it is what creates the containing block. */
  /* NO TRANSFORM ON BODY, AND THAT IS THE WHOLE FIX. c39 gave body one so that it would be
     the containing block for every fixed panel, and it worked -- but a canvas with inset:0 is
     a fixed panel too, so from that moment the LENS was also being sized to the box you can
     see rather than to the screen, and the strip of browser chrome under it showed as a
     rectangle of html. Every pass since has tried to make some measured height big enough to
     cover that strip; none could, because the containing block was the wrong box.
     Body is the viewport again. `position:fixed; inset:0` on the canvas resolves against the
     LAYOUT viewport, which with viewport-fit=cover is the whole glass, always, with no number
     involved. What the panels needed from c39 they get from --uit / --uib instead: the height
     of the chrome at each end, added to their own offsets. The lens covers the screen; the
     interface sits inside the part of it you can see. Those were always two questions. */
  body{overflow:visible}
  </style>
  <script>
  // BEFORE THE FIRST PAINT, not on the first animation frame. syncSize sets these, and it
  // does not run until frame() does -- so the boot card and the studio splash are laid out
  // once against a box that is still the layout viewport, which on iOS with the URL bar up
  // is taller than the screen. That is the shift you see while it is still loading, before
  // anything of the game is on screen at all. Same four lines, run here as well.
  (function () {
    var set = function () {
      var vv = window.visualViewport, d = document.documentElement.style;
      // How much of the layout viewport the browser's own furniture is sitting over, at each
      // end. This is the only thing the interface needs to know; the lens needs nothing at all
      // now that it is measured against the viewport itself.
      var top = vv ? vv.offsetTop : 0;
      var vish = vv ? vv.height : innerHeight;
      // AND THE CANVAS IS NOT THE INTERFACE. --vv* is the box you can SEE, which is what the
      // panels want. The lens wants the whole SCREEN: sized to the visual viewport it leaves
      // a strip of html showing under it whenever the two disagree, which on iOS is most of
      // the time and is the black rectangle along the bottom that keeps coming back. The
      // largest of the three candidates is the layout viewport however the browser is
      // currently reporting it.
      // THE LAYOUT VIEWPORT, WHICH IS THE ONE `position: fixed; inset: 0` COVERS. His own
      // readout settled it: win, vis and doc all read 462x932 and the 100vh probe read 1002.
      // 100vh on iOS is the LARGE viewport -- what the page would be with the browser's bars
      // hidden -- and it is NOT what a fixed element is laid out against. Using it as the
      // layout height made --uib 70px on a phone whose chrome covers nothing, which pushed
      // the whole interface up by seventy pixels: the screen moving up twice.
      var lay = document.documentElement.clientHeight || innerHeight;
      d.setProperty('--uit', Math.max(0, Math.round(top)) + 'px');
      d.setProperty('--uib', Math.max(0, Math.round(lay - top - vish)) + 'px');
      // AND THE HEIGHT OF THE GLASS, which is not any of the numbers above. See glassH()
      // further down for why it is the screen and the page's own scale and nothing else; this
      // is the same arithmetic, run before the first paint so the boot card and the studio
      // splash are not short either. They were: his own photograph of the splash has a wider
      // strip under it than the title screen has.
      try {
        var de = document.documentElement;
        var cw = de.clientWidth || innerWidth, ch = de.clientHeight || innerHeight;
        if (screen && screen.width && screen.height) {
          var a = Math.min(screen.width, screen.height), b = Math.max(screen.width, screen.height);
          var across = ch >= cw ? a : b, down = ch >= cw ? b : a;
          var g = Math.round(down * (cw / across));
          if (g > ch && g < ch * 1.6) d.setProperty('--lensH', g + 'px');
        }
      } catch (e) { }
    };
    set();
    // AND AGAIN, FOR THE FIRST FEW SECONDS. A navigation lands with the viewport mid-flight --
    // the URL bar animating, the safe areas not yet applied -- and iOS does not reliably fire
    // a resize when it settles. One sample at load is how a wrong number gets frozen in for
    // the life of the page, which is what "I tapped the update chip and it came back" is a
    // description of. Six more, spread over three seconds, cost nothing.
    [60, 180, 400, 900, 1800, 3000].forEach(function (ms) { setTimeout(set, ms); });
    addEventListener('pageshow', set);
    addEventListener('orientationchange', function () { set(); setTimeout(set, 250); setTimeout(set, 700); });
    addEventListener('resize', set);
    if (window.visualViewport) { visualViewport.addEventListener('resize', set); visualViewport.addEventListener('scroll', set); }
  })();
  </script>
  <style>
  /* FIXED AND FILLING, rather than a block in flow that three.js sizes in pixels. In flow, the
     canvas is exactly as tall as the number syncSize last handed it -- and on iOS innerHeight
     and the actually-visible viewport disagree whenever the URL bar moves, so a stale number
     leaves the page showing through underneath. That is the grey rectangle along the bottom,
     and it is also why things looked shifted up: the buffer and the box it is displayed in
     were different shapes. Every panel in this file is fixed with a z-index of 1 or more, so
     the lens can sit under all of them at 0. */
  /* body > canvas, NOT canvas. `#mini` is a canvas too, and so is the big map, and so is the
     studio splash's -- and a bare element selector handed all of them position:fixed with
     inset:0. #mini overrode width, height and display (an id beats an element) and could not
     override the position, so the minimap has been pinned to the top-left corner of the
     screen, over the clock, since the day this rule got `fixed` in it, instead of sitting in
     #ui with the buttons where it is written to. The renderer's canvas is the only direct
     child of body, so the child combinator says exactly what was meant all along. */
  /* THE RECTANGLE ALONG THE BOTTOM, from his own readout and nothing else.
       win 462x932   vis 462x932   doc 462x932   100vh probe 1002   cv 462x933
     Three ways of asking for the layout viewport all say 932, and the glass is 1002. So
     `inset:0` -- which resolves against the LAYOUT viewport -- makes the lens 932 tall on a
     1002-tall screen, and the seventy at the bottom is html showing through: #070a13, which
     is the black band, and the picture ending seventy pixels early is "the screen moved up".
     Every pass at this has been measuring the gap and then sizing the lens to a box that by
     definition cannot cover it.
     100vh on iOS is the LARGE viewport -- the page with the browser's bars out of the way --
     and that is the glass. So the lens is 100vh tall and runs behind the chrome at the bottom
     rather than stopping short of it. lvh where it exists, which is the same number said
     properly. What is NOT changed is --uib: a fixed panel is laid out against the 932 box, so
     it is already inside the part you can see, and adding an inset to it is what moved the
     interface up a second time in c72. The lens covers the screen; the panels sit in the
     layout viewport. Two boxes, two rules, and they are allowed to differ.
     c72 did half of this and stretched the picture, because it grew the BUFFER while the CSS
     still held the element at 100%. syncSize measures the element itself now, so the two
     cannot disagree again whatever either of them is. */
  /* max(), not the newer unit. lvh is SUPPOSED to be the large viewport and so is iOS's vh,
     and if they disagree the bigger one is the one that reaches the bottom of the glass --
     switching to lvh on faith is how a fix gets undone by the browser agreeing to a different
     number. Whichever is larger, plus whatever lensProbe() measures still missing. */
  :root{--lvh:100vh}
  @supports (height:100lvh){:root{--lvh:max(100vh,100lvh)}}
  /* INSET:0 AGAIN, and this time for a reason rather than as another guess. The layout
     viewport is not one candidate among five for the height of the glass -- it is the part of
     the screen the page is allowed to paint, which his panel just proved by showing a 1002px
     canvas clipped at 932. So the lens is exactly that, always, and whatever iOS decides the
     web view is on any phone, the picture fills it and cannot leave a strip. Making the view
     itself the right height is the status-bar meta's job, up in the head. */
  /* THE STRIP IS THE WINDOW'S AND THE PAGE CANNOT HAVE IT. Every standalone app on his phone
     has it, his own included -- the ones that look full screen are the ones whose edge colour
     happens to match. So the lens is exactly the paintable area, which is the layout viewport,
     and nothing is cropped or stretched to chase seventy pixels that were never on offer.
     What makes it disappear is #edgeF below: the picture fades into the strip's own colour, so
     there is no seam to see. That is what the white webpage is doing by accident. */
  body > canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
  /* The last fifty-four pixels of the frame ease into --edge, which edgeTint sets to the
     colour of the picture just above this fade and hands to iOS for the strip at the same
     time. Both ends of the join are then the same colour and the join is gone. */
  #edgeF{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:8;pointer-events:none;
    background:linear-gradient(to bottom,rgba(0,0,0,0),var(--edge,#070a13) 86%)}
  /* ALWAYS VISIBLE, EVERY SCREEN, INCLUDING THE TITLE. #bld lives inside #ui, which is hidden
     on the title screen, so the one number he needs to tell builds apart is missing from
     exactly the screenshots he takes. Twice now he has had to say he cannot read it. */
  #bldTag{position:fixed;left:7px;bottom:5px;z-index:9998;pointer-events:none;font-size:10px;
    letter-spacing:.08em;opacity:.5;font-family:ui-monospace,Menlo,monospace;
    text-shadow:0 1px 3px rgba(0,0,0,.9)}
  /* ONE BUILD OF PAINT, TO END TWENTY-FIVE ROUNDS OF ARITHMETIC.
     Every theory about the band has been about which box is short, and each fix has been
     shipped blind because the only way to tell them apart is to look at the thing on the
     phone that has it. So this build makes the band identify itself. The page behind
     everything is magenta instead of #070a13, and three hairlines mark the three edges that
     have been argued about. What colour the band is, and which lines are above or below it,
     is the entire answer -- no numbers to read off a photograph. BAND = 0 removes all of it.*/
  .bandmark{position:fixed;left:0;right:0;height:3px;z-index:9999;pointer-events:none}
  #gllost{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99999;
    background:rgba(8,12,22,.94);border:1px solid rgba(240,235,220,.22);border-radius:12px;
    padding:20px 22px;max-width:78vw;text-align:center;display:flex;flex-direction:column;gap:11px}
  #gllost b{font-size:16px;font-weight:normal;letter-spacing:.02em}
  #gllost span{font-size:13px;opacity:.68;line-height:1.5}
  #gllost button{font-family:inherit;font-size:14px;color:#f0e7d4;background:rgba(255,190,110,.24);
    border:1px solid rgba(255,200,130,.6);border-radius:15px;padding:9px 20px}
  /* THE OTHER THINGS THAT COVER THE SCREEN. The studio splash and the start veil are both
     `position:fixed; inset:0` written inline, so they are the layout viewport -- 932 on a
     1002-tall glass -- exactly like the lens was. His splash photograph has a wider magenta
     strip under it than the title screen does, which is that. Overridden here rather than in
     the lifted MAJIA block, which is meant to stay verbatim. */
  /* REMOVED. c84 forced these to --lensH so they would cover a strip that, it turns out,
     nothing on the page can cover. All it achieved was making the splash 1002 tall inside a
     932 view -- so its progress bar, which sits at 8% of its own height, ended up on the very
     bottom edge of the screen. They are `inset:0` in their own markup, which is the view. */
  /* An id rule with a display beats the UA sheet's [hidden], so panels that set display
     could never hide. This has now cost two of them; make it impossible for the next one. */
  [hidden]{display:none!important}
  #scrim{position:fixed;left:0;right:0;top:0;height:300px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,.62),rgba(4,8,16,.28) 55%,rgba(4,8,16,0))}
  #scrimB{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,0),rgba(4,8,16,.5))}
  #hud{position:fixed;left:calc(16px + env(safe-area-inset-left));top:calc(14px + env(safe-area-inset-top) + var(--uit,0px));pointer-events:none;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.95)}
  #hud h1{margin:0;font-size:22px;font-weight:normal;letter-spacing:.04em}
  #hud .era{font-style:italic;font-size:14px;opacity:.85;margin:2px 0 8px}
  #perf{font-size:12px;line-height:1.5;opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
  #stats{font-size:12px;line-height:1.55;opacity:.92;font-family:ui-monospace,Menlo,Consolas,monospace}
  #log{position:fixed;left:16px;bottom:calc(14px + var(--uib,0px));z-index:2;font-size:13px;line-height:1.5;pointer-events:none;max-width:78vw;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  #log div{animation:fade 11s forwards}
  @keyframes fade{0%{opacity:0;transform:translateY(4px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #hint{position:fixed;right:16px;bottom:calc(14px + var(--uib,0px));font-size:12px;opacity:.5;pointer-events:none;text-align:right;line-height:1.5}
  #mapv{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 46%,rgba(6,10,18,.34),rgba(4,8,14,.72) 78%);
    -webkit-backdrop-filter:blur(2px) saturate(.75);backdrop-filter:blur(2px) saturate(.75)}
  #mapv h2{margin:0 0 10px;font-size:19px;font-weight:normal;letter-spacing:.06em;opacity:.95}
  #mapv h2 span{font-style:italic;font-size:13px;opacity:.6;letter-spacing:.02em;margin-left:8px}
  #mapwrap{position:relative;width:min(92vw,62vh);aspect-ratio:1;border-radius:3px;overflow:hidden;touch-action:none;
    border:1px solid rgba(240,228,200,.3);box-shadow:0 10px 44px rgba(0,0,0,.62),inset 0 0 60px rgba(0,0,0,.4)}
  #mapclose{position:fixed;right:calc(15px + env(safe-area-inset-right));top:calc(13px + env(safe-area-inset-top) + var(--uit,0px));z-index:7}
  #mapzoom{position:absolute;left:7px;bottom:7px;font-size:10px;letter-spacing:.08em;opacity:.82;
    font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none;
    background:rgba(6,10,18,.55);border-radius:9px;padding:3px 8px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #mapc{display:block;width:100%;height:100%}
  #maplg{margin-top:12px;font-size:11px;line-height:1.9;opacity:.8;display:flex;flex-wrap:wrap;gap:4px 14px;
    justify-content:center;max-width:min(92vw,62vh);font-family:ui-monospace,Menlo,Consolas,monospace}
  #maplg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px;font-style:normal}
  #mapfoot{margin-top:9px;font-size:11px;opacity:.45;font-style:italic}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:#0b0718;font-style:italic;letter-spacing:.05em;z-index:5;transition:opacity 1.2s}
  /* No painted title card any more: the title screen is the world itself, and a painting of
     it on the way in gives the real thing away and then contradicts it. What is above the
     loading line is a placeholder mark; what is above THAT is the studio splash. */
  /* Both caps, or a phone in landscape gives the card the whole screen and pushes the line
     underneath it off the bottom. */
  /* The painted title card is gone: the title screen is the world itself now, and a
     painting of it on the way in gives the real thing away and then contradicts it. This
     is a placeholder mark until the company splash goes here. */
  #bootMark{position:relative;width:96px;height:96px;margin-bottom:26px}
  #bootMark i{position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(150,246,255,.5);
    border-top-color:rgba(190,250,255,.95);animation:bootspin 1.6s linear infinite}
  #bootMark i:nth-child(2){inset:14px;animation-duration:2.4s;animation-direction:reverse;
    border-color:rgba(196,140,255,.4);border-top-color:rgba(216,170,255,.9)}
  #bootMark i:nth-child(3){inset:30px;animation-duration:1.1s;
    border-color:rgba(255,214,168,.35);border-top-color:rgba(255,226,190,.85)}
  @keyframes bootspin{to{transform:rotate(360deg)}}
  #boot img{max-width:min(86vw,760px);max-height:60vh;width:auto;height:auto;
    filter:drop-shadow(0 8px 40px rgba(0,0,0,.6))}
  #boot span{opacity:.62;font-size:14px}
  #sticks .stick{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom) + var(--uib,0px));
    width:132px;height:132px;border-radius:50%;z-index:4;touch-action:none;
    background:radial-gradient(circle,rgba(255,214,150,.09),rgba(240,235,220,.04) 58%,rgba(240,235,220,0) 74%);
    border:1px solid rgba(240,228,200,.2);box-shadow:inset 0 0 26px rgba(255,196,128,.07);
    transition:border-color .18s,box-shadow .18s}
  #sticks .stick.act{border-color:rgba(255,206,150,.42);
    box-shadow:inset 0 0 30px rgba(255,196,128,.14),0 0 18px rgba(255,180,110,.10)}
  /* Something within reach: the stick is the prompt, so there is nothing else to put on
     screen — and it has to read at a glance, on a phone, in daylight. Every other lit thing
     in this interface is amber, so this one is not: cyan is the colour of the ship's own
     hull lights and the waypoint, and against the warm UI it cannot be mistaken for a
     stick that merely happens to be under a thumb. A ring pings out of it on a slow beat. */
  #sticks .stick.hot{border-color:rgba(150,246,255,.95);border-width:2px;
    background:radial-gradient(circle,rgba(120,238,255,.16),rgba(120,238,255,.05) 58%,rgba(120,238,255,0) 74%);
    box-shadow:inset 0 0 40px rgba(110,230,255,.42),0 0 44px rgba(90,220,255,.5);
    animation:hotpulse 1.25s ease-in-out infinite}
  @keyframes hotpulse{0%,100%{box-shadow:inset 0 0 34px rgba(110,230,255,.34),0 0 26px rgba(90,220,255,.34)}
    50%{box-shadow:inset 0 0 46px rgba(150,246,255,.6),0 0 62px rgba(90,220,255,.72)}}
  #sticks .stick.hot::after{content:'';position:absolute;inset:-3px;border-radius:50%;
    border:2px solid rgba(150,246,255,.85);pointer-events:none;animation:hotping 1.25s ease-out infinite}
  @keyframes hotping{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.34);opacity:0}}
  #sticks .stick.hot .knob{background:radial-gradient(circle at 38% 32%,rgba(240,254,255,.92),rgba(120,238,255,.6) 58%,rgba(40,150,190,.34));
    border-color:rgba(210,250,255,.85);box-shadow:0 0 30px rgba(120,238,255,.85),inset 0 1px 3px rgba(255,255,255,.55)}
  #sticks .ico{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;
    pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .22s,transform .22s;
    filter:drop-shadow(0 1px 4px rgba(0,0,0,.7))}
  #sticks .stick.hot .ico{opacity:1;transform:scale(1.08);filter:drop-shadow(0 0 7px rgba(120,238,255,.9))}
  #sticks .stick.hot .lbl{opacity:1;color:#bff4ff;letter-spacing:.24em;

// failing to load. With _BOOT_FLY false the curly-straw entrance turns itself on, which adds
// 2600ms of runway; the crisp logo lands at SOLID_AT = 3250 + 620 (the mandala) + 2600 = 6470,

window._BOOT_FLY = false;

      drawPresents(_pa); }
  }
  function drawSolid(a){
    ctx.save(); ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`900 ${F}px Orbitron, sans-serif`;
    if('letterSpacing' in ctx) ctx.letterSpacing=(F*0.03)+'px';

  }
  function drawEyebrow(a){
    if(a<=0) return;
    ctx.save(); ctx.globalAlpha=a;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`400 ${eyeF}px Orbitron, sans-serif`;
    if('letterSpacing' in ctx) ctx.letterSpacing=(eyeF*0.62)+'px';
    // The rule and the word under the mark are ONE LOCKUP with it. Left cool-grey against an auburn MAJIA they
    // read as two different logos stacked, so they take the same ink at a lower weight. _MAJIA_SUB overrides.
    ctx.fillStyle=(window._MAJIA_SUB||'rgba(239,145,164,0.92)');
    ctx.fillText('STUDIOS',cx+eyeF*0.31,eyeY);

    ctx.save(); ctx.globalAlpha=a;

    ctx.font=`400 ${preF}px Orbitron, sans-serif`;
    if('letterSpacing' in ctx) ctx.letterSpacing=(preF*0.34)+'px';

  // arrived — rebuild every target, re-randomise every particle AND reset the clock. That is the hitch.
  // Fix in two parts:
  //  1. ACTUALLY LOAD the font before building. document.fonts.ready resolves immediately when nothing has
  //     REQUESTED the face yet, so waiting on it alone still built in the fallback (wrong letterforms).
  //     document.fonts.load() issues the request and resolves when the face is usable.
  //  2. If it still lands late (cap expired, slow network), SOFT-RETARGET instead of rebuilding: keep every
  //     particle's position and velocity and just move its destination onto the corrected glyph, so they glide
  //     into the right letterforms. No snap, no restart, no clock reset.
  const _begin=()=>{ if(_ready||fading)return; _ready=true;
    resize();                                  // the one and only full build
    start=performance.now();                   // clock starts when the first real frame can draw
    requestAnimationFrame(draw); };

    if(!_ready||fading)return;

        src.sx=(t.cx0!=null?t.cx0:t.x); src.sy=(t.cy0!=null?t.cy0:t.y); src.cs=t.cs;
        if(src.released)     { src.tx=t.x;   src.ty=t.y; }           // already peeling -> keep heading for the letter
        else if(_mandMs()>0) { src.tx=_m.x;  src.ty=_m.y; }          // still blooming -> stay on the (re-fitted) flower
        else                 { src.tx=t.x;   src.ty=t.y; }
        np[i]=src; }
      else { const a=Math.random()*Math.PI*2,d=F*(0.40+Math.random()*1.0);
        const _m=_mandalaPos(i,n);
        np[i]={ lx:t.x,ly:t.y, mx:_m.x,my:_m.y, mr:_m.r, ma:_m.a, released:!!_bloomed, rel:Math.random()*(window._MAJIA_RELEASE_SPREAD||200), tx:(_bloomed?t.x:_m.x),ty:(_bloomed?t.y:_m.y), x:t.x+Math.cos(a)*d, y:t.y+Math.sin(a)*d, vx:0,vy:0,
          maxSpeed:(9.0+Math.random()*10.0)*sc*speed, k:0.018+Math.random()*0.045, damp:0.86+Math.random()*0.075,
          sx:(t.cx0!=null?t.cx0:t.x), sy:(t.cy0!=null?t.cy0:t.y), cs:t.cs, launched:true, loose:true,
          col:GRID_COLS[(Math.random()*GRID_COLS.length)|0], rot:(Math.random()-0.5)*4.0, rotV:(Math.random()-0.5)*0.6, trot:0 }; } }
    particles=np;
  }
  { let _done=false; const go=()=>{ if(_done)return; _done=true;
      requestAnimationFrame(()=>requestAnimationFrame(_begin)); };   // two frames of headroom so the first paint isn't the build frame
    let _fontP=Promise.resolve();
    try{ if(document.fonts&&document.fonts.load){
      _fontP=Promise.all([ document.fonts.load('900 120px Orbitron'), document.fonts.load('700 20px Orbitron') ])
        .then(()=>document.fonts.ready).catch(()=>{}); } }catch(_){}
    _fontP.then(()=>{ if(_ready)retarget(); else go(); });          // ready already -> glide onto the real glyph; not yet -> build straight into it
    setTimeout(go,(window._MAJIA_FONT_WAIT||1600));                 // cap: a stalled webfont can never hold the boot
  }
})();

<script>
(() => {
// ============================================================
//  Plutopia
//  A small planet with an island on it. Every species has one build()
//  (placeholder geometry) and one think() (behaviour), so real
//  assets drop in by replacing build() alone.
// ============================================================

// ---------- quality ----------
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;

  seg: MOBILE ? 240 : 384,

  // each direction, so the island is *less* densely covered than it was. That is deliberate:
  // an even carpet everywhere was the thing that made it read as scattered, and the map this
  // is being built toward has plenty of empty grassland in it.
  grass: MOBILE ? 7000 : 33000,
  motes: MOBILE ? 320 : 620,
  shadow: MOBILE ? 768 : 2048,
  bloomDiv: MOBILE ? 4 : 3,

  // is what says which knob to turn. 95 ms a frame with a fill-heavy shader stack (toon ramp,
  // tint, see-through hole, ground pattern, bloom, composite) is a fill-rate problem before
  // it is anything else, and dpr is squared: 2 on a phone whose CSS viewport is 390 x 844
  // renders 780 x 1688 and then does the whole post chain over it again. 1.5 is 44% fewer
  // pixels for every one of those passes. It is the single biggest number in this object.

// The world got bigger so that nine regions could each be a place rather than a clearing.
// At 240 the land was a lobe about 220 units across and the region layout fitted down to a
// third of its drawn size -- each region forty units, fifteen seconds' walk. Everything
// horizontal in this file is stated as a fraction of W or scaled by WS, so raising it moves
// the coastline, the range, the mesa, the lagoon, the chasm, the sea stacks, the ferry's
// route, the ship's patrol and the map together. Four things are not, and are handled below:
// the vertical relief (RELIEF), the terrain and water mesh density, how many things there are
// (Q.grass, MAX, populate), and how high a creature is willing to walk.
const W = 400, SEA = 0, DAY = 110, GROW_T = 85;
// Relief does not scale with width -- a wider island at the same amplitudes is a pancake, and
// at full scale it is an alp. Real coasts get flatter as they get bigger, so this is well
// under the horizontal factor. It multiplies the finished height field about zero, which
// leaves the coastline exactly where the mask put it and stretches everything else.
const RELIEF = 1.25;
// Shown in the HUD. Pages caches index.html, so a phone can sit on an old build while the
// repo has moved on — which once cost an afternoon arguing about which way a model faced.
// Bump it with anything that changes behaviour.
const BUILD = 'd07';
// Whatever an earlier build left on these, put it back. The strip takes its colour from here.
try { document.documentElement.style.background = '#070418'; document.body.style.background = '#070418'; } catch (e) { }
// The build number, on every screen there is. It has to be set here rather than left in the
// markup so that bumping BUILD is still the only edit a push needs.
try { const _bt = document.getElementById('bldTag'); if (_bt) _bt.textContent = BUILD; } catch (e) { }
const T0 = Date.now();      // wall clock at boot, for the splash's minimum time on screen
// THE FIRST ERROR, KEPT, and declared UP HERE where nothing can read it before it exists --
// updateHUD does, and a `let` further down the file is a TDZ that kills the rest of the
// script. That is the landmine in CLAUDE.md and it has now cost seven.
// bootFail writes into the boot card and the boot card is then removed, so an exception that
// fires after the world is up flashes a red box for a moment and is gone. Which is exactly
// what he saw, and it left nothing to work from. The HUD line shows it until a reload.

const WS = W / 170;              // landform coords were authored at W=170

const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- noise ----------
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }

}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, cc) => hash3(xi + a, yi + b, zi + cc);

function fbm(x, y, o = 5) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }

const CENTERS = [[0.04, 0.02, 1.14], [-0.66, 0.58, 0.62]];

// a range running along the north shoulder, not a cone in the middle
const RANGE = { ax: -0.44 * W, az: -0.30 * W, bx: 0.16 * W, bz: -0.52 * W, w: 30, h: 27, crest: 14 };
const SPIRE = { x: (RANGE.ax + RANGE.bx) / 2, z: (RANGE.az + RANGE.bz) / 2 };   // referenced for siting
let _sd = 0, _st = 0;
function segDT(px, pz, ax, az, bx, bz) {          // distance to a line segment, plus position along it
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az;
  const L2 = vx * vx + vz * vz;

}
// How much of the island is stepped, and how hard. `at`/`gain` pick the districts out of the
// noise -- lower `at` means more of the island is plateau; `step` is the height of one tread,
// `sharp` how much of it is spent climbing (small is a cliff), `k` how completely the terrace
// replaces the rolling ground underneath it.
// sharp was .05 to begin with -- a true vertical face -- and the terrain mesh cannot draw
// one. Under the island the polar grid is about two units across, so a vertical riser between
// three-unit treads renders as a visible staircase with a grey band of "rock" colouring on
// every step. Real cliffs need geometry, not a height field at this density. .14 is strata:
// you can read the levels, and the risers are slopes rather than stairs.
const PLATEAU = { at: .30, gain: 5, step: 3.4, sharp: .14, k: .9 };
const MESA = { x: -104 * WS, z: 94 * WS, r: 42 * WS, h: 18 };
const LAGOON = { x: -30 * WS, z: 52 * WS, r: 42 * WS, d: 13 };
const CHASM = { x: -62 * WS, z: -58 * WS, r: 15 * WS, d: 25 };
const STACKS = [{ x: 122, z: -54, r: 8, h: 25 }, { x: 138, z: -38, r: 5, h: 16 }, { x: -66, z: -132, r: 7, h: 22 }, { x: 100, z: 100, r: 6.5, h: 18 }, { x: -146, z: 6, r: 5.5, h: 14 }]
  .map(o => ({ x: o.x * WS, z: o.z * WS, r: o.r * WS, h: o.h }));
// Terracing: flat treads with risers between them. `sharp` is how much of a tread is spent
// climbing -- .2 is a rounded strata effect, .05 is a cliff face you cannot walk up. The
// island used only the rounded kind, weakly, on mid slopes, which is why it read as rolling
// noise everywhere instead of as a place with levels in it.
function terraceF(h, step, sharp = .2) {
  const f = h / step, i = Math.floor(f), fr = f - i;
  return (i + smooth(.5 - sharp, .5 + sharp, fr)) * step;
}
function height(x, z) {
  const nx = x / W, nz = z / W;
  let mask = 0;
  for (const [cx, cz, s] of CENTERS) {
    const dx = (nx - cx) / (0.62 * s), dz = (nz - cz) / (0.62 * s);
    const d = Math.sqrt(dx * dx + dz * dz);
    mask = Math.max(mask, 1 - d * d);
  }
  const base = (fbm(nx * 2.6 + 11.3, nz * 2.6 + 4.7) - 0.5) * 2;
  // broad, gently rolling interior — most of the island should be walkable ground
  let h = base * 4.6 + 9 * mask - 8.5 + mask * 9;
  h += (fbm(nx * 6.5 + 21, nz * 6.5 + 13, 4) - 0.5) * 5.2 * clamp(mask + .15, 0, 1);   // low hills
  h += (fbm(nx * 12 + 5, nz * 12 + 31, 3) - 0.5) * 2.4 * clamp(mask, 0, 1);            // hummocks
  h -= (1 - mask) * 10;
  // the range: a spine with several summits along its length
  segDT(x, z, RANGE.ax, RANGE.az, RANGE.bx, RANGE.bz);
  const rk = Math.max(0, 1 - _sd / RANGE.w), tAl = _st;
  if (rk > 0) {
    const peaks = .45 + .55 * Math.pow(Math.abs(Math.sin(tAl * Math.PI * 2.6 + 1.1)), .8);
    const wob = .8 + .4 * fbm(tAl * 7 + 4, _sd * .04, 3);
    h += Math.pow(rk, 1.8) * RANGE.h * peaks * wob;
    h += Math.pow(Math.max(0, 1 - _sd / (RANGE.w * .34)), 1.4) * RANGE.crest * peaks;
    h += Math.max(0, fbm(nx * 7 + 3.1, nz * 7 + 8.9, 4) - .52) * 34 * Math.pow(rk, 1.2);  // rocky detail
  }
  // flat-topped mesa on the sister isle
  const md = Math.hypot(x - MESA.x, z - MESA.z);
  const mk = smooth(MESA.r, MESA.r * .6, md);
  if (mk > 0) h = lerp(h, MESA.h + (fbm(x * .03 + 9, z * .03, 3) - .5) * 3.5, mk * .92);
  // a lagoon bitten out of the south shore
  const ld = Math.hypot(x - LAGOON.x, z - LAGOON.z);
  h -= Math.pow(Math.max(0, 1 - ld / LAGOON.r), 1.4) * LAGOON.d;
  // sea stacks standing off the coast
  for (let i = 0; i < STACKS.length; i++) {
    const st = STACKS[i], d = Math.hypot(x - st.x, z - st.z), R = st.r * 1.7;
    if (d < R) h = Math.max(h, Math.pow(1 - d / R, .5) * st.h - 3);
  }

        // BELOW h = 0, so a floor at -0.03 blacked out the whole descent off the title, and
        // uSpace only rescues the far end of it. Below the horizon on the ground you see

      // runs across it. Above the horizon only: the bottom half of that image is the ground

      // cent of the way to near-black -- over the top of the galaxy and both moons, which
      // had already been drawn. So the further out the camera went, the emptier the sky
      // got, which is exactly backwards: from up here the air is what disappears and the
      // things beyond it are what remain. It goes in HERE instead, before them.
      if (uHigh > 0.001) {
        float limb = exp(-abs(h) * 8.0);
        // What "out of the air" fades TO. It was a near-black, which was right when there was
        // nothing out there -- but the plate is drawn above this and would be eighty per cent
        // erased by it, so the whole point of having a background at altitude was lost at
        // exactly the altitude that has one. With a plate up, space IS the plate.

        c += mix(vec3(0.34,0.17,0.55), vec3(0.10,0.36,0.46), fbm(d.xz*1.1 + 9.0))
             * g*g*g * band * uNeb * (1.0 - cl*0.85) * (1.0 + uHigh * 1.4);

        vec4 ob = orb(d, uOrbB, 0.052, vec3(0.80,0.82,0.90), 0.0, sn);
        c = mix(c, ob.rgb, ob.a * (1.0 - cl*0.9));

const stars = (() => {

  // // eats the rest of it; that is three times now, and it is in CLAUDE.md.)

})();

// ---------- deep space ----------
// What is out there besides this world. Four bodies and a few nebula veils, hung on the sky
// rig at eight hundred units so they sit outside everything and never move with the camera --
// they are meant to be unreachably far, not scenery you could fly to. Invisible from the
// ground and full strength out at the title, which is where the composition needs them.

  const g = new THREE.Group(); g.visible = false; g.userData.what = 'DEEP nebula'; skyRig.add(g);
  const R = 760;

    Math.cos(pit) * Math.sin(yaw) * d, Math.sin(pit) * d, Math.cos(pit) * Math.cos(yaw) * d);

  // to be built here out of primitives, and they only ever came out at altitude. They are the
  // owner's own models now -- the same saturn, purple moon, earth and cratered asteroid the
  // title screen is composed from -- and they hang where you can see them from the ground.
  // See SKY_BODIES / buildSkyBodies below; what is left in this group is the SPACE framing:
  // the near lumps and the nebula, which are a wide-shot device and stay gated on altitude.
  // THE NEAR ROCKS ARE GONE, and they are the black shape across the sky in the fly-in.
  // Three dark icosahedrons at a third of the shell radius -- #4a4640, #3e3a44, #464251 --

  // one stain. They are the cheapest possible depth cue and the most effective.
  for (let i = 0; i < 7; i++) {

// ---------- the bodies in the sky ----------
// THE SAME PLANETS THE TITLE SCREEN IS MADE OF, over the island. The title's sky is most of
// why it reads as another world, and until c38 the game's sky had none of it: six untextured
// spheres that only appeared once you were four hundred units up, which is nowhere anybody
// stands. These are the owner's own models -- saturn, the purple moon, the blue planet, the
// cratered asteroid -- hung on the sky rig where they can be seen from the ground.
//

// the only thing about it that matters, and stating it that way means the distance can move
// without re-tuning anything. `yaw` is a bearing in the local frame and `pit` a height above
// the horizon, so nothing here is below the sea or behind the world.

// frames a whole planet from six hundred units out and saturn can take a quarter of it; from
// the ground the lens is a 46-degree portrait crop, so .150 of angular radius put a dark
// brown mass across two thirds of the frame width with the sky behind it gone. A third of
// that: still enormous next to a moon, still unmistakably not Earth, and the sky is a sky
// again. Pitches raised with them, so nothing sits in the band you walk toward.
const SKY_BODIES = [
  { yaw: 0.62, pit: .46, ang: .055, model: 'models/saturn.glb', tilt: [.16, 0, .12] },
  { yaw: 4.40, pit: .52, ang: .022, model: 'models/earth_planet.glb' },
  { yaw: 2.45, pit: .30, ang: .027, model: 'models/purple_moon.glb' },
  { yaw: 1.70, pit: .62, ang: .009, model: 'models/cratered_asteroid.glb', tint: '#b8b4bc' },
  { yaw: 3.50, pit: .22, ang: .007, model: 'models/cratered_asteroid.glb', tint: '#9a938c' },
  { yaw: 5.35, pit: .38, ang: .013, model: 'models/purple_moon.glb' },
];
const SKYB = { g: null, mats: [] };
function buildSkyBodies() {
  if (SKYB.g) return;
  const R = 720;                       // inside the 900-unit dome, outside the stars at 800
  const g = new THREE.Group(); g.userData.what = 'sky body'; skyRig.add(g); SKYB.g = g;
  for (const b of SKY_BODIES) {
    const hold = new THREE.Group();
    hold.position.set(Math.cos(b.pit) * Math.sin(b.yaw) * R, Math.sin(b.pit) * R, Math.cos(b.pit) * Math.cos(b.yaw) * R);
    if (b.tilt) hold.rotation.set(b.tilt[0], b.tilt[1], b.tilt[2]);
    else hold.rotation.set(rnd(3), rnd(3), rnd(3));
    hold.frustumCulled = false; hold.renderOrder = -3;

      const inst = cloneModel(e.root), sz = e.box.getSize(new THREE.Vector3());
      const k = 2 * R * Math.tan(b.ang) / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z));

}

// ---------- the look ----------
// c37, and the owner's call: the title screen looks like the game he wants and the island
// looked like a photocopy of it. The two were never lit or graded the same, and every
// difference ran the same way --
//   * every prop in the world goes through worldTint's desaturate-and-stain (keep .30-.50,
//     then pulled toward its region's colour) and the diorama's dioMat does none of it, so
//     the same mushroom is 100% of its own colour up there and 38% of it down here;
//   * the world carries FogExp2 over everything and a fresh scene has no fog at all, so the
//     island is looking through a pale blue sheet that the title screen never had;
//   * the composite lifts the world's blacks by DARK.col and the title screen was cut to
//     12% of that lift, so its shadows stay black and keep their colour;
//   * the world's daylight is a wide, flat, cool overcast and the diorama is a hard warm
//     key with a cool rim and very little fill.
// LOOK.mode picks between them. 'legacy' is the island exactly as it rendered up to c36 --
// nothing has been deleted, it is one word away -- and 'title' is the diorama's treatment
// over the whole world. The rig is matched at NOON, not frozen there: the night still ramps
// down out of it, because the title screen has no time of day to match and the game does.
//
// What 'title' costs: the regional stain was what made a swamp read as a different place
// from a desert without re-authoring a single model. With it gone that difference has to
// live in the terrain colour instead, which is where it should probably have been anyway.
// `env` is how much of the HDRI panorama survives on the dome and `plate` how much of the
// owner's galaxy goes under it. The HDRI is a photograph of somewhere on Earth, softened past
// recognising -- which is exactly the wrong sky for the shot the title screen makes, and it is
// the second thing after the tint that made the island look like a different game. It is
// turned down rather than off: above the horizon it is also the only distant land there is.
// THE GROUND, which is half of every frame and was the palest thing in it. The terrain's
// albedo is built out of P -- deliberately near-neutral, because the plan was for the region
// to supply the colour -- and then the region gets a stain of only BIOME_LOOK.k times the
// region strength on top, which on the coast is about a quarter. So three quarters of the
// biggest surface in the game was a grey-tan with the saturation taken out of it on purpose,
// and no amount of work on the props was ever going to answer that.
// `gsat` pushes the saturation back up and `gmul` takes the brightness down, both in the
// terrain's own shader rather than in the baked vertex colour, so they are live: gsat 1 and
// gmul 1 is the ground exactly as it was.
const LOOKS = {
  legacy: { vivid: .55, haze: 1, lift: 1, rig: 0, env: 1, plate: 0, gsat: 1, gmul: 1, fogSky: 0, fogSat: 1, gpatch: 0, plateH: .34 },
  // `fogSky` pulls the haze colour toward the sky it is standing in front of and `fogSat`
  // takes the grey back out of it. Distance should dissolve into the sky, which on this
  // world is a deep blue-violet -- not into a separate flat grey that only the far ground
  // is painted with, which is what a fog colour of its own always looks like.
// AND THE ANSWER TO TEN ROUNDS OF "why is the sky still grey-blue".
// It was never the fade and it was never the fog. `plate` is a MIX WEIGHT, and at .72 the
// other 28% is the procedural gradient underneath -- which runs from uLow at the horizon
// (a bright blue) to uTop at the zenith (near black). So the residual is bright at the bottom
// of the frame and dark at the top, which is a blue wash over the sea fading to a galaxy
// overhead: exactly what the screenshots show, and exactly what was being described. Every
// pass that moved the roll-off, the haze or the horizon colour was adjusting the wrong term.
// At 1 there is no residual. The sky IS the plate above the waterline, the thin band under
// plateH is the air, and the sun and the clouds still draw on top of it.

    let skinned = false;
    inst.traverse(o => { if (o.isSkinnedMesh) skinned = true; });
    const usable = e.anims.filter(a => !/^(CINEMA_4D|mixamo\.com)/i.test(a.name));
    if (!skinned || !usable.length) {
      parent.remove(inst);
      // once per file, not once per creature: five mudlarks asking the same question of the
      // same GLB is one broken export, not five
      if (!RIG_WARNED.has(cfg.url)) {
        RIG_WARNED.add(cfg.url);
        const why = !skinned ? 'no armature — nothing can deform it' : 'no clips but the exporter default';
        console.warn('[rig] ' + cfg.url + ': ' + why + '. Keeping the placeholder body.');
        logMsg(cfg.url.split('/').pop() + ': ' + why + '.');
      }
      return;
    }

    // Locomotion clips are looked up by role, not by exact name, and a file that lacks a role
    // simply does not get it: no run means walk carries on at speed, no jump clips means the
    // old procedural stretch, no swim clips means the walk plays in the water.
    // The armed set is pulled out of `land` before anything else looks at it: rifle_idle_01
    // matches "idle" and would otherwise be a candidate for the unarmed idle.
    const rifle = e.anims.filter(a => /rifle|weapon|gun|aim/i.test(a.name));
    const land = e.anims.filter(a => !/swim|tread|water|jump|leap|hop|rifle|weapon|gun|aim/i.test(a.name));
    const water = e.anims.filter(a => /swim|tread|water/i.test(a.name));
    const jump = e.anims.filter(a => /jump|leap|hop/i.test(a.name));
    const clips = {
      idle: pickClip(land, cfg.idle, 'idle', 'walk|run'),
      walk: pickClip(land, cfg.walk, 'walk', 'idle|run'),
      run: pickClip(land, cfg.run, 'run|sprint', 'idle|walk'),
      swimIdle: pickClip(water, cfg.swimIdle, 'idle|tread|float', 'fwd|forward|move'),
      swim: pickClip(water, cfg.swim, 'fwd|forward|swim', 'idle|tread|float'),
      jumpStart: pickClip(jump, cfg.jumpStart, 'init|initiate|start|launch|crouch|takeoff', 'air|land|mid|loop'),
      jumpAir: pickClip(jump, cfg.jumpAir, 'air|mid|loop|fall|hang', 'init|initiate|start|land'),
      jumpLand: pickClip(jump, cfg.jumpLand, 'land|landing|down|end|touch', 'init|initiate|start|air'),
      rifleIdle: pickClip(rifle, cfg.rifleIdle, 'idle', 'walk|run|shoot|fire|strafe'),
      rifleWalk: pickClip(rifle, cfg.rifleWalk, 'walk', 'idle|run|shoot|fire|strafe'),
      rifleRun: pickClip(rifle, cfg.rifleRun, 'run|sprint', 'idle|walk|shoot|fire|strafe'),
      rifleLeft: pickClip(rifle, cfg.rifleLeft, 'left', 'right'),
      rifleRight: pickClip(rifle, cfg.rifleRight, 'right', 'left'),
      rifleShoot: pickClip(rifle, cfg.rifleShoot, 'shoot|fire', 'idle|walk|run|strafe'),
      roll: pickClip(land, cfg.roll, 'roll|dodge|dive', 'idle|walk|run'),
      // Poses, not cycles: pickClip throws away anything under a quarter of a second because
      // that is what a junk exporter track looks like, and a one-frame pose looks the same to
      // it. These are asked for by name.
      pickUp: pickPose(e.anims, cfg.pickUp),
      hold: pickPose(e.anims, cfg.hold),
    };
    // See RIG.stillFingers for why. Cloned rather than edited in place, because the clips
    // belong to the cached file and every future instance of this model would inherit the
    // edit -- and the clone keeps the ORIGINAL NAME, because the stride and floor caches
    // below are keyed on it and the mixer keys actions on the object, not the name.
    if (cfg.stillFingers || cfg.calmWrists) {
      const bind = {};
      if (cfg.calmWrists) inst.traverse(o => { if (o.isBone && cfg.calmWrists.bones.test(o.name)) bind[o.name] = o.quaternion.clone(); });
      const qa = new THREE.Quaternion(), qb = new THREE.Quaternion();
      for (const k of ['idle', 'walk', 'run', 'jumpStart', 'jumpAir', 'jumpLand', 'swim', 'swimIdle', 'roll']) {
        const cl = clips[k];
        if (!cl) continue;
        const c2 = cl.clone(); c2.name = cl.name;
        if (cfg.stillFingers) c2.tracks = c2.tracks.filter(t => !cfg.stillFingers.test(t.name));
        if (cfg.calmWrists) for (const t of c2.tracks) {
          const m = /^(.*)\.quaternion$/.exec(t.name), b = m && bind[m[1]];
          if (!b) continue;
          // Slerp every key back toward the bind rotation. Doing it to the KEYS rather than
          // to the result means it costs nothing per frame and it survives every blend.
          for (let i = 0; i < t.values.length; i += 4) {
            qa.copy(b); qb.fromArray(t.values, i); qa.slerp(qb, cfg.calmWrists.k);
            t.values[i] = qa.x; t.values[i + 1] = qa.y; t.values[i + 2] = qa.z; t.values[i + 3] = qa.w;
          }
        }
        clips[k] = c2;
      }
    }
    // Retreating: the forward walk, cloned so it can have an action of its own, run backwards.
    if (clips.rifleWalk) { clips.rifleBack = clips.rifleWalk.clone(); clips.rifleBack.name = clips.rifleWalk.name + '__back'; }
    // Braced. rifle_idle is at ease -- the gun is down and he is standing about -- which is
    // the wrong body for somebody holding a charge on a trigger. The first frame of the shoot
    // clip is the same rig already sighted, so trim that clip to its first key and it becomes
    // the pose he holds while winding one up. Trimmed rather than paused because a paused
    // action still has a duration the mixer walks, and one keyframe cannot drift.
    if (clips.rifleShoot) {
      const aim = clips.rifleShoot.clone(); aim.name = clips.rifleShoot.name + '__aim';
      for (const t of aim.tracks) {
        const sz = t.getValueSize();
        t.times = new t.times.constructor([0]);
        t.values = t.values.slice(0, sz);
      }
      aim.duration = .1;                     // a zero-length clip on repeat divides by its own length
      clips.rifleAim = aim;
    }
    // Carrying is an OVERRIDE, not a blend. "From the spine up" is the hold pose; from the
    // spine down is whichever gait he is in. Additive was the first attempt and it is wrong
    // here: it lays the hold on TOP of the run, so the arms get the run's swing plus the
    // cradle delta and flip about, and the spine gets twisted twice. The fix is to stop the
    // gait touching the upper body at all while he carries -- leg-only clones of the ground
    // gaits -- and let a plain upper-only hold own the arms and spine. Nothing fights over a
    // track, so nothing averages into a shrug and nothing compounds into a flip.
    // holdUpper: the hold pose, spine-up tracks only, played normally at full weight.
    // Does the pose actually place the socket? If it does, the socket's own direction is the
    // authored up vector and the carry should use it. If it does not, the null is sitting
    // wherever the bind pose left it and that vector means nothing, so the carry falls back
    // to standing the animal up against the world.
    let holdSocket = false;
    if (clips.hold) {
      const up = clips.hold.clone(); up.name = clips.hold.name + '__upper';
      up.tracks = up.tracks.filter(t => CARRY.upper.test(t.name));
      if (up.tracks.length) clips.holdUpper = up;
      else console.warn('[rig] the carry pose has no spine-up tracks — check CARRY.upper');
      holdSocket = up.tracks.some(t => new RegExp(WEAPON.bone, 'i').test(t.name));
      if (!holdSocket) console.warn('[rig] the carry pose does not keyframe the `' + WEAPON.bone + '` null — carrying upright instead of on the socket.');
    }
    // idleLegs / walkLegs / runLegs: the same gait with every spine-up track dropped, so it
    // moves the hips and legs and says nothing about the arms. Hips stays (it carries the
    // whole body's bounce and travel), because it is not a spine-up bone.
    if (clips.holdUpper) for (const g of ['idle', 'walk', 'run']) {
      if (!clips[g]) continue;
      const legs = clips[g].clone(); legs.name = clips[g].name + '__legs';
      legs.tracks = legs.tracks.filter(t => !CARRY.upper.test(t.name));
      if (legs.tracks.length) clips[g + 'Legs'] = legs;
    }
    for (const k of ['walk', 'run', 'rifleWalk', 'rifleRun']) if (clips[k] && e.strides[clips[k].name] === undefined) e.strides[clips[k].name] = measureStride(e.root, clips[k]);
    // each clip's own floor, relative to the pose the rig was normalised on, in model units
    for (const k in clips) { const cl = clips[k]; if (cl && e.floors[cl.name] === undefined) e.floors[cl.name] = clipSpan(e.root, cl); }
    const refF = (clips.idle ? e.floors[clips.idle.name] : clips.walk ? e.floors[clips.walk.name] : { lo: 0 }).lo;
    const lift = {};
    // Only ever correct a clip authored *below* the reference. A clip whose floor sits
    // higher is usually a pose that genuinely leaves the ground — swimming, mid-air — and
    // pulling those down would push him under the water he is meant to be floating on.
    const span = {};
    for (const k in clips) if (clips[k]) { const sp = e.floors[clips[k].name]; span[k] = sp; const d = sp.lo - refF; lift[k] = isFinite(d) ? Math.min(0, d) : 0; }
    const mixer = new THREE.AnimationMixer(inst);
    const acts = {};
    for (const k in clips) {
      if (!clips[k]) continue;
      const a = mixer.clipAction(clips[k]);
      acts[k] = a;
      // A pose holds itself: one frame on repeat is a divide by its own zero length.
      if (k === 'pickUp' || k === 'hold' || k === 'holdUpper' || k === 'rifleAim') { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
      if (k === 'jumpStart' || k === 'jumpLand' || k === 'rifleShoot' || k === 'roll') { a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = true; }
      // The retreat runs its clip backwards, so it has to start at the end of it. From zero a
      // negative time scale spends its first cycle winding round to the far end.
      if (k === 'rifleBack') a.time = clips[k].duration;
      a.play(); a.setEffectiveWeight(k === 'idle' ? 1 : 0);
    }
    const walk = clips.walk, run = clips.run;

    // Where the body actually turns. A rig is normalised with its feet at y=0, so rotating
    // its group swings it about the point between its soles -- fine for standing on the
    // ground, wrong for anything airborne or carried, which turns about its centre of mass.
    // That is the hips. Take the named joint out of the bind pose; failing that, the middle
    // of the silhouette, which is close enough on a body with no joint called anything.
    let pivotY = null;
    inst.updateMatrixWorld(true);
    const _pvI = new THREE.Matrix4().copy(inst.matrixWorld).invert(), _pvV = new THREE.Vector3();
    for (const re of [/^(mixamorig)?[:_]?hips?$/i, /pelvis/i, /hip/i, /spine/i, /(^|[_.:])root($|[_.:])/i]) {
      let b = null;
      inst.traverse(o => { if (!b && o.isBone && re.test(o.name)) b = o; });
      if (!b) continue;
      const y = b.getWorldPosition(_pvV).applyMatrix4(_pvI).y * s + inst.position.y;
      if (y > cfg.height * .06) { pivotY = y; break; }     // a joint sitting on the floor is the armature, not the hips
    }
    // AND THEN CHECK IT AGAINST THE BODY, because on these files the bone does not live in
    // the same space as the skin. Measured out of the GLBs with @gltf-transform: the meshes
    // are about one unit tall (purple_horny's box is 0.99 x 0.74 x 0.72) and mixamorig_Hips
    // sits at y = 18.6; creature_green's at 10.1. The skeleton is in centimetre-ish units and
    // the inverse bind matrices bring the skin down -- so the hips' WORLD position is nowhere
    // near the hips, and scaling it to the creature's height gives a pivot sixty units above
    // its feet.
    // Which is invisible until something turns about it. tumble holds that point still while
    // the body rotates, so the render position swings by twice the pivot -- a hundred and
    // twenty units, in a frame. That is the whole of "I shoot them, they are gone, and then
    // they come flying in from outside the frame": they were never gone and never went
    // anywhere. They were being drawn a hundred units away, orbiting a point in the sky.
    // A pivot is inside the body or it is not a pivot. Anything else falls back to the middle
    // of the silhouette, which is what the loop above was always meant to be a refinement of.
    if (!(pivotY > cfg.height * .06 && pivotY < cfg.height * 1.2)) {
      if (pivotY != null) console.warn('[rig] ' + cfg.url + ': hips measure ' + pivotY.toFixed(1)
        + ' on a body ' + cfg.height + ' tall -- the skeleton is not in the skin\'s space. Using the silhouette.');
      pivotY = cfg.height * .5;
    }

    const morphs = [];
    inst.traverse(o => {
      const d = o.morphTargetDictionary;
      if (d && o.morphTargetInfluences && d[cfg.blinkL] !== undefined)
        morphs.push({ inf: o.morphTargetInfluences, l: d[cfg.blinkL], r: d[cfg.blinkR] });
    });
    done({
      root: inst, mixer, acts, box: e.box, scale: s, lift, span, baseY: inst.position.y, pivotY, holdSocket,
      rateMax: cfg.rateMax,      // a short-strided clip may need to run faster than the default ceiling
      walkSpeed: walk ? e.strides[walk.name] * s : 0,
      runSpeed: run ? e.strides[run.name] * s : 0,
      rollT: clips.roll ? clips.roll.duration : 0,        // how long the move should own him
      w: {},                                              // smoothed weight per action
      blink: morphs.length ? { t: 1.5 + Math.random() * 3, p: -1, which: 3, morphs } : null,
    });
  });
}

// A pose. Same lookup as pickClip minus the duration floor, because a one-frame pose is
// exactly what that floor exists to reject, and given a length so an action can hold it: a
// zero-length clip on repeat divides by its own duration.
function pickPose(anims, name) {
  if (!name) return null;
  const low = name.toLowerCase();
  const c = anims.find(a => a.name === name) || anims.find(a => a.name.toLowerCase() === low)
    || anims.find(a => a.name.toLowerCase().indexOf(low) >= 0);
  if (c && c.duration < .05) c.duration = .1;
  return c || null;
}
// Find a clip without insisting on the exact name a previous export happened to use.
// Exporters decorate freely — 'Armature|walk_fwd', 'idle.001', 'alien_walk_cycle_v2' —
// so match on whole words inside the name, not on the whole string.
//
// `notWords` is what stops a transition clip winning both roles: 'idle_to_walk' contains
// both, and a plain substring test hands it back as the idle *and* the walk. Names holding
// the other state's word are considered last, and only if nothing cleaner exists.
//
// Junk tracks are skipped outright: Blender leaves a one-frame 'CINEMA_4D_Main' in these
// exports and Mixamo adds a 'mixamo.com'. No real cycle runs under a quarter second.
function pickClip(anims, name, words, notWords) {
  const real = anims.filter(a => a.duration > .25 && !/^(mixamo\.com|CINEMA_4D)/i.test(a.name));
  const low = (name || '').toLowerCase();
  const has = new RegExp(words, 'i'), tok = new RegExp('^(' + words + ')$', 'i');
  const no = notWords ? new RegExp(notWords, 'i') : null;
  const parts = a => a.name.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  const clean = a => !no || !no.test(a.name);
  return real.find(a => a.name === name)                                  // exact
      || real.find(a => a.name.toLowerCase() === low)                     // same but for case
      || real.find(a => clean(a) && parts(a).some(t => tok.test(t)))      // a whole word in the name
      || real.find(a => clean(a) && has.test(a.name))                     // buried in a longer word
      || real.find(a => has.test(a.name))                                 // last resort: take the transition
      || null;
}

// Blend idle against walk by how fast the thing is actually travelling, run the walk cycle
// at the speed it was authored for, and blink. Shared by the wanderer and the creatures.
// ctx is optional: { swim 0..1, air bool, start bool (winding up), landK 0..1 }. Creatures
// pass nothing and get idle/walk; the wanderer passes everything and gets the whole tree.
function stepRig(r, dt, speed, grounded, ctx) {
  if (!r || !r.mixer) return;
  const a = r.acts, ref = r.walkSpeed || 3, c = ctx || {};
  const want = {};
  const swim = a.swim || a.swimIdle ? c.swim || 0 : 0;
  // Blend on how much of its own top speed this thing is using, which is the question the
  // eye is actually asking. Keying it off the walk clip's authored pace put the wanderer
  // in a full run at 6 u/s when he tops out at 17 — a third of the way up the stick.
  const top = c.top || ref * 3 || 6;
  const frac = clamp(speed / top, 0, 1);
  const loco = grounded ? smooth(MODEL.moveAt, MODEL.moveFull, frac) : 0;
  // A creature's `speed` is its cruise, not its sprint, so the wanderer's thresholds put
  // every rigged animal in a permanent full run the moment it moved. They pass their own.
  const rA = c.runAt !== undefined ? c.runAt : MODEL.runAt, rF = c.runFull !== undefined ? c.runFull : MODEL.runFull;
  const runMix = a.run ? smooth(rA, rF, frac) : 0;
  // Armed swaps the whole locomotion set for the rifle one, at the same weights, so drawing
  // the blaster changes how he stands and walks without touching any of the blending above.
  const arm = a.rifleIdle ? clamp(c.armed || 0, 0, 1) : 0;
  // Winding up a shot he is braced, not at ease. Standing still that means the sighted pose
  // off the first frame of the shoot clip rather than rifle_idle; moving, it means nothing
  // extra, because the walk, run and strafes already hold the gun up. The swap is a weight
  // like everything else here, so it eases in and out with the rest of the blend.
  const aimK = a.rifleAim ? clamp(c.aim || 0, 0, 1) : 0;
  want.idle = (1 - loco) * (1 - arm);
  want.rifleIdle = (1 - loco) * arm * (1 - aimK);
  want.rifleAim = (1 - loco) * arm * aimK;
  want.walk = loco * (1 - runMix) * (1 - arm);
  want.run = loco * runMix * (1 - arm);
  // Armed he does not turn to walk: he faces where he is aiming and travels wherever the
  // stick says, so the armed set is a four-way blend keyed on the direction of travel IN HIS
  // OWN FRAME. `c.mf` is how much of it is forward (negative is backing away) and `c.mr` how
  // much is to his right. Nothing is thresholded -- walking diagonally is genuinely half the
  // forward clip and half the strafe, which is what stops it snapping between them.
  const mf = c.mf || 0, mr = c.mr || 0;
  const dirs = { rifleWalk: Math.max(0, mf), rifleBack: Math.max(0, -mf),
                 rifleRight: Math.max(0, mr), rifleLeft: Math.max(0, -mr) };
  let dsum = 0;
  for (const k in dirs) { if (!a[k]) dirs[k] = 0; dsum += dirs[k]; }
  // No strafe clips on this rig, or standing dead still with the stick centred: fall back to
  // the forward walk, which is what it always did.
  if (dsum < 1e-4) { dirs.rifleWalk = 1; dsum = 1; }
  const armLoco = loco * arm;
  for (const k in dirs) want[k] = armLoco * dirs[k] / dsum * (k === 'rifleWalk' ? (1 - runMix) : 1);
  want.rifleRun = armLoco * runMix * dirs.rifleWalk / dsum;
  want.rifleShoot = c.shoot ? 1 : 0;
  // The roll owns the body outright while it runs -- it is a whole-body move with its own
  // travel, and blending a walk into it just makes it look like a stumble. So does the stoop.
  want.roll = c.roll ? 1 : 0;
  want.pickUp = c.lift || 0;
  // water: tread <-> swim forward
  const sw = clamp(speed / 6, 0, 1);
  want.swimIdle = 1 - sw; want.swim = sw;
  // jump: the three phases own the body while they run
  const air = c.air ? 1 : 0, start = c.start ? 1 : 0, landK = c.landK || 0;
  want.jumpStart = start; want.jumpAir = air * (1 - start); want.jumpLand = landK;
  // mix the layers: water replaces ground; jump phases sit on top of whichever is under them
  const jumpK = Math.max(start, air, landK), rollK = Math.max(want.roll, want.pickUp);
  // The shot is laid over whichever armed pose is running, so the base has to give way or the
  // mixer averages the two and the recoil comes out at half strength.
  const shootK = want.rifleShoot * .8;
  for (const k of ['idle', 'walk', 'run', 'rifleIdle', 'rifleAim', 'rifleWalk', 'rifleBack', 'rifleLeft', 'rifleRight', 'rifleRun'])
    want[k] *= (1 - swim) * (1 - jumpK) * (1 - shootK) * (1 - rollK);
  for (const k of ['swimIdle', 'swim']) want[k] *= swim * (1 - jumpK) * (1 - rollK);
  want.jumpStart *= 1 - rollK; want.jumpAir *= 1 - rollK; want.jumpLand *= 1 - rollK;
  want.rifleShoot *= 1 - rollK;
  want.roll = c.roll ? 1 : 0; want.pickUp = c.lift || 0;   // neither is suppressed by the other
  // Carrying: hand the arms and spine to the hold pose and the legs to a stripped gait, in
  // proportion to how far into the carry he is, so a pick-up eases into it. Only the three
  // ground gaits have leg clones; the rest (swim, jump, roll) carry nothing anyway.
  const carry = a.holdUpper ? clamp(c.holding || 0, 0, 1) : 0;
  want.holdUpper = carry;
  if (carry > 0) for (const [base, legs] of [['idle', 'idleLegs'], ['walk', 'walkLegs'], ['run', 'runLegs']]) {
    if (!a[legs]) continue;
    const w = want[base] || 0; want[legs] = w * carry; want[base] = w * (1 - carry);
  }
  if (a.walk) a.walk.timeScale = clamp(speed / ref, MODEL.rateMin, r.rateMax || MODEL.rateMax);
  // Every armed gait runs at the pace the unarmed walk was measured to need, including the
  // one that is the same clip played backwards.
  const armRate = a.walk ? a.walk.timeScale : 1;
  if (a.walkLegs) a.walkLegs.timeScale = armRate;
  if (a.runLegs && a.run) a.runLegs.timeScale = a.run.timeScale;
  if (a.rifleWalk) a.rifleWalk.timeScale = armRate;
  if (a.rifleBack) a.rifleBack.timeScale = -armRate;
  if (a.rifleLeft) a.rifleLeft.timeScale = armRate;
  if (a.rifleRight) a.rifleRight.timeScale = armRate;
  if (a.run) a.run.timeScale = clamp(speed / (r.runSpeed || ref * 3), .75, 1.6);
  if (a.rifleRun) a.rifleRun.timeScale = a.run ? a.run.timeScale : 1;
  if (a.rifleShoot) a.rifleShoot.timeScale = 1.35;
  if (a.pickUp) a.pickUp.timeScale = 2;      // the stoop was slow enough to feel like a cutscene
  if (a.roll) a.roll.timeScale = c.rollRate || 1;
  if (a.swim) a.swim.timeScale = clamp(speed / 6, .6, 1.6);
  if (a.jumpLand) a.jumpLand.timeScale = 1.5;
  if (a.jumpStart) a.jumpStart.timeScale = 2;    // the crouch has to be over by the time he lifts
  // fade every weight toward its target; one-shots restart the moment they are wanted
  for (const k in a) {
    const t = want[k] || 0, prev = r.w[k] || 0;
    if ((k === 'jumpStart' || k === 'jumpLand' || k === 'rifleShoot' || k === 'roll' || k === 'pickUp') && t > .5 && prev <= .5) {
      a[k].reset().play();
      // Past the clip's held lead-in, so the travel and the tumble start on the same frame.
      if (k === 'roll' && c.rollSkip) a[k].time = c.rollSkip;
    }

    const nw = lerp(prev, t, Math.min(1, dt / .1));
    r.w[k] = nw; a[k].setEffectiveWeight(nw);
  }
  // Hold the feet on the ground through the blend: shift the root by the weighted mean of
  // the clips' own floors. With one consistently authored set every lift is zero and this
  // does nothing at all.
  if (r.lift) {
    let d = 0, tw = 0;
    for (const k in r.w) { const wt = r.w[k]; if (wt > 1e-4 && r.lift[k] !== undefined) { d += r.lift[k] * wt; tw += wt; } }
    r.root.position.y = r.baseY - (tw > 1e-4 ? d / tw : 0) * r.scale;
  }
  r.mixer.update(dt);
  // After the mixer: the clips do not touch the eye shapes, but writing first would still
  // be overwritten by a future clip that does.
  const b = r.blink; if (!b) return;
  if (b.p >= 0) {
    b.p += dt / .13;
    const v = b.p >= 1 ? 0 : Math.sin(b.p * Math.PI);
