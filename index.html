    this.g = new THREE.Group(); this.g.position.copy(this.pos); alignTo(this.g, x, z, .7); this.g.rotateY(rnd(Math.PI * 2));
    const bin = [];
    for (let i = 0; i < 11; i++) { const a = i / 11 * Math.PI * 2, r = rnd(1.5, 1.9);
      const st = mesh(pick(G.rock), i % 2 ? M.stone : M.stone2, rnd(.35, .6), rnd(.25, .4), rnd(.35, .6), Math.cos(a) * r, .1, Math.sin(a) * r);
      st.rotation.set(rnd(1), rnd(3), rnd(1)); collect(bin, st); }
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2 + rnd(-.2, .2);
      const lg = mesh(G.cylT, M.wood, .13, 2.4, .13, Math.cos(a) * .5, .9, Math.sin(a) * .5);
      lg.rotation.set(Math.cos(a) * .5, 0, -Math.sin(a) * .5); collect(bin, lg); }
    this.g.add(mesh(G.sph, std(col('#241a12'), { roughness: 1 }), 1.5, .18, 1.5, 0, .04, 0));
    // lean-to and a drying rack, so it reads as a place people come back to
    for (const sx of [1, -1]) collect(bin, mesh(G.cylT, M.wood, .11, 3.2, .11, sx * 2.2, 1.6, -4.4));
    const roof = mesh(G.box, M.sail, 5.2, .12, 3.4, 0, 3.0, -5.4); roof.rotation.x = -.42; collect(bin, roof);
    for (const sx of [1, -1]) collect(bin, mesh(G.cylT, M.wood, .1, 2.6, .1, sx * 2.6, 1.3, 3.4));
    collect(bin, mesh(G.cyl, M.wood, .07, 5.2, .07, 0, 2.5, 3.4).rotateZ(Math.PI / 2));
    for (let i = 0; i < 4; i++) collect(bin, mesh(G.plane, M.sail, .5, 1.2, 1, -1.8 + i * 1.2, 1.9, 3.4));
    for (let i = 0; i < 3; i++) { const st = mesh(pick(G.trunk), M.wood, .55, .8, .55, rnd(-4, 4), .4, rnd(-3.5, 3.5)); collect(bin, st); }
    for (const m of mergeBin(bin)) this.g.add(m);
    scene.add(this.g);
    const base = this.pos.y;
    this.fire = new PSys({ n: 220, life: 1.15, rate: 95, gy: 3.4, drag: 1.1, additive: true, a0: .85,
      c0: '#fff0bf', c1: '#ff3208', s0: 1.5, s1: .35,
      spawn: (p, v) => { const a = rnd(Math.PI * 2), r = rnd(0, .62); p.set(x + Math.cos(a) * r, base + .25, z + Math.sin(a) * r); v.set(Math.cos(a) * rnd(.2, .9), rnd(2.2, 4.4), Math.sin(a) * rnd(.2, .9)); } });
    this.smoke = new PSys({ n: 200, life: 7.5, rate: 13, gy: .55, drag: .5, a0: .3, wind: .9,
      c0: '#7d7466', c1: '#2b2823', s0: 1.1, s1: 7.5,
      spawn: (p, v) => { const a = rnd(Math.PI * 2), r = rnd(0, .5); p.set(x + Math.cos(a) * r, base + 1.9, z + Math.sin(a) * r); v.set(rnd(-.4, .4), rnd(1.6, 2.8), rnd(-.4, .4)); } });
    this.embers = new PSys({ n: 90, life: 3.4, rate: 9, gy: 1.1, drag: .35, additive: true, a0: .9, wind: 1.4,
      c0: '#ffd489', c1: '#ff5a12', s0: .28, s1: .05,
      spawn: (p, v) => { const a = rnd(Math.PI * 2), r = rnd(0, .5); p.set(x + Math.cos(a) * r, base + 1.2, z + Math.sin(a) * r); v.set(Math.cos(a) * rnd(.4, 1.6), rnd(2.6, 5), Math.sin(a) * rnd(.4, 1.6)); } });
    this.gl = glow('#ff9436', 11, .7); this.gl.position.set(0, 1.2, 0); this.g.add(this.gl);
    this.light = new THREE.PointLight(0xff8a34, 2.4, 46, 2); this.light.position.set(0, 1.6, 0); this.g.add(this.light);
    this.ob = obAdd(x, z, 2.1, this, this.pos.y + 2.3);   // you can leap the fire, not walk through it
  }
  update(dt) {
    const f = (.78 + Math.sin(world.clock * 9.1) * .12 + Math.sin(world.clock * 23.7) * .06 + Math.sin(world.clock * 3.3) * .08) * (1 - WX.rain * .55);
    this.fire.rate = 95 * (1 - WX.rain * .6); this.embers.rate = 9 * (1 - WX.rain * .75);   // the fire gutters in the wet
    this.light.intensity = (1.6 + world.night * 2.4) * f;
    this.gl.scale.setScalar((7 + world.night * 7) * f);
  }
  dispose() { obRemove(this.ob); scene.remove(this.g); }
}

// ---------- the floating isle and its waterfall ----------
class FloatingIsle {
  // `opt` is for the second one of these -- the one the title stands on. { R } sizes it,
  // { landY } is where the water lands (the first isle hangs over the sea; this one hangs
  // over a hill), and { clear } is a patch of the top the grove and the scattered rock leave
  // alone, so nothing grows through the monument.
  constructor(x, z, alt, na, opt) {
    const O = opt || {};
    this.alive = true; this.alt = alt; this.pos = new THREE.Vector3(x, alt, z);
    this.g = new THREE.Group(); this.g.position.copy(this.pos); scene.add(this.g);
    const R = this.R = O.R || 34, NA = this.NA = na === undefined ? rnd(Math.PI * 2) : na, cN = Math.cos(NA), sN = Math.sin(NA);
    const landY = O.landY === undefined ? SEA : O.landY;
    // Everything below the height field was written for a 34-unit island -- the spires, the
    // grove, the loose rock, the width of the fall, the foam ring. This is what scales it, and
    // it is declared HERE, at the top, because half of what uses it runs before the waterfall
    // does. Declared beside the waterfall it is a const read from above its own declaration,
    // which is a ReferenceError at construction and the fifth time that has been the bug in
    // this file.
    const K = R / 34;
    const clear = O.clear;
    const free = (u, v) => !clear || Math.hypot(u - clear.u, v - clear.v) > clear.r;
    // domed top with a channel cut out to the notch, so the water has somewhere to go
    // The whole profile scales with the island, not just its footprint. At K = 2 a 3.4-unit
    // dome on a 144-unit disc is a dinner plate: the thing has to have mass, or from orbit it
    // reads as a decal rather than a rock with a river running off it.
    const topH = (u, v) => {
      const r = Math.hypot(u, v), t = clamp(r / R, 0, 1);
      const dome = (1 - t * t) * 3.4 * K;
      const hills = (fbm(u * .05 / K + 3, v * .05 / K + 7, 4) - .5) * 6 * K * smooth(1, .45, t);
      const along = u * cN + v * sN, side = -u * sN + v * cN;
      const chan = Math.exp(-(side * side) / (11 * K * K)) * smooth(-8 * K, 6 * K, along) * 2.6 * K;
      return dome + hills - chan - t * t * 1.2 * K;
    };
    this.topH = topH;
    // --- radial top surface: clean rim, no clamped-grid spikes ---
    const NR = 30, NS = 72, pos = [], colA = [], idx = [], c = new THREE.Color();
    const ringY = new Float32Array(NS);
    for (let j = 0; j <= NR; j++) {
      const rr = R * Math.pow(j / NR, .92);
      for (let i = 0; i < NS; i++) {
        const a = i / NS * Math.PI * 2, u = Math.cos(a) * rr, v = Math.sin(a) * rr;
        const y = topH(u, v); pos.push(u, y, v);
        if (j === NR) ringY[i] = y;
        const t = j / NR;
        c.copy(P.grass).lerp(P.grass2, fbm(u * .1, v * .1, 3));
        c.lerp(P.grassDry, clamp(fbm(u * .03 + 12, v * .03) * 1.5 - .6, 0, 1) * .5);
        c.lerp(P.rock, clamp((t - .8) * 5.5, 0, 1));
        const align = Math.exp(-(Math.pow(-u * sN + v * cN, 2)) / (14 * K * K)) * smooth(-8 * K, 6 * K, u * cN + v * sN);
        c.lerp(P.sandWet, align * .55);
        c.offsetHSL(0, 0, (fbm(u * .45, v * .45, 2) - .5) * .07);
        colA.push(c.r, c.g, c.b);
      }
    }
    const ring = (j, i) => j * NS + (i % NS);
    for (let j = 0; j < NR; j++) for (let i = 0; i < NS; i++)
      idx.push(ring(j, i), ring(j + 1, i + 1), ring(j + 1, i), ring(j, i), ring(j, i + 1), ring(j + 1, i + 1));
    // --- underside: radial rock cone with strata, continuous with the rim ---
    const KN = 26, D = 46 * K, base = pos.length / 3;
    for (let k = 0; k <= KN; k++) {
      const t = k / KN, rr = R * Math.pow(1 - t, 1.25);
      for (let i = 0; i < NS; i++) {
        const a = i / NS * Math.PI * 2;
        const strata = (Math.sin(t * 26) * .55 + Math.sin(t * 61 + i * .3) * .22) * K;
        const wob = (fbm(Math.cos(a) * 3 + t * 5, Math.sin(a) * 3 - t * 4, 3) - .5) * 5 * K * (1 - t * .5);
        const r2 = Math.max(.4, rr + strata + wob);
        const y = (k === 0 ? ringY[i] : lerp(ringY[i], 0, .12) - .5 * K) - t * D * (1 + Math.sin(a * 3) * .04);
        pos.push(Math.cos(a) * r2, y, Math.sin(a) * r2);
        c.copy(P.rock).lerp(P.rock2, .35 + Math.sin(t * 26) * .3 + (fbm(Math.cos(a) * 4, t * 9, 2) - .5) * .5);
        c.lerp(col('#2b2740'), t * .46);      // slate-violet, not mud
        if (k <= 1) c.lerp(P.grass2, .35 * (1 - k));
        colA.push(c.r, c.g, c.b);
      }
    }
    const cring = (k, i) => base + k * NS + (i % NS);
    for (let k = 0; k < KN; k++) for (let i = 0; i < NS; i++)
      idx.push(cring(k, i), cring(k, i + 1), cring(k + 1, i + 1), cring(k, i), cring(k + 1, i + 1), cring(k + 1, i));
    const bg = new THREE.BufferGeometry();
    bg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    bg.setAttribute('color', new THREE.Float32BufferAttribute(colA, 3));
    bg.setIndex(idx); bg.computeVertexNormals();
    // The black shape under the island. Nothing lights the underside of a floating rock --
    // the sun is above it and there is no ground below to bounce -- so a forty-six-unit cone
    // of brown rock resolved to a flat black lozenge hanging in the sky, which reads as a
    // hole in the world rather than as the bottom of something. A floor of emission keeps it
    // rock: dark, but with a shape in it.
    const body = new THREE.Mesh(bg, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95,
      emissive: col('#1a1530'), emissiveIntensity: 1 }));
    body.castShadow = true; body.receiveShadow = true; this.g.add(body);
    // hanging spires and loose rock
    const bin = [];
    for (let i = 0; i < Math.round(11 * K); i++) {
      const a = rnd(Math.PI * 2), r = rnd(2, R * .62), len = rnd(8, 26) * K;
      const sp = mesh(G.cone, i % 2 ? M.stone : M.stone2, rnd(1, 2.8), len, rnd(1, 2.8), Math.cos(a) * r, -D * .55 - len * .35 - rnd(0, 8), Math.sin(a) * r);
      sp.rotation.set(rnd(-.16, .16), rnd(3), Math.PI + rnd(-.16, .16)); collect(bin, sp);
    }
    // a grove on top, sitting on the real surface
    for (let i = 0; i < Math.round(8 * K * K); i++) {
      const a = rnd(Math.PI * 2), r = rnd(5, R * .66), u = Math.cos(a) * r, v = Math.sin(a) * r;
      if (Math.exp(-(Math.pow(-u * sN + v * cN, 2)) / (11 * K * K)) * smooth(-8 * K, 6 * K, u * cN + v * sN) > .35) continue;
      if (!free(u, v)) continue;
      const y = topH(u, v), th = rnd(5, 9);
      collect(bin, mesh(pick(G.trunk), M.elderBark, .85, th, .85, u, y + th / 2, v));
      for (let j = 0; j < 5; j++) {
        const cr = rnd(1.5, 2.9);
        const cm = mesh(pick(G.blob), pick(M.canopy), cr, cr * .72, cr, u + rnd(-1.2, 1.2), y + th + rnd(-.4, 1.2), v + rnd(-1.2, 1.2));
        cm.rotation.set(rnd(3), rnd(3), rnd(3)); collect(bin, cm);
      }
    }
    for (let i = 0; i < Math.round(30 * K * K); i++) {
      const a = rnd(Math.PI * 2), r = rnd(2, R * .9), u = Math.cos(a) * r, v = Math.sin(a) * r;
      if (!free(u, v)) continue;
      const m = mesh(pick(G.blob), i % 3 ? M.moss : M.stone2, rnd(.6, 1.7), rnd(.3, .7), rnd(.6, 1.7), u, topH(u, v) + .1, v);
      m.rotation.set(rnd(1), rnd(3), rnd(1)); collect(bin, m);
    }
    for (let i = 0; i < Math.round(22 * K); i++) {   // leafy growth trailing off the underside of the rim
      const a = rnd(Math.PI * 2), len = rnd(2.5, 7) * K, u = Math.cos(a) * R * (.9 + rnd(0, .08)), v = Math.sin(a) * R * (.9 + rnd(0, .08));
      collect(bin, mesh(G.cyl, M.vine, .09 * K, len, .09 * K, u, -1.2 * K - len / 2, v));
      for (let j = 0; j < 3; j++) {
        const b2 = mesh(pick(G.blob), j % 2 ? M.moss : pick(M.elderLeaf), rnd(.5, 1.2), rnd(.3, .6), rnd(.5, 1.2), u + rnd(-.6, .6), -1 - len * rnd(.15, .95), v + rnd(-.6, .6));
        b2.rotation.set(rnd(1), rnd(3), rnd(1)); collect(bin, b2);
      }
    }
    for (const m of mergeBin(bin)) this.g.add(m);

    // --- the fall: a parametric sheet on a real projectile arc ---
    const lipR = R * .985, lipY = topH(cN * lipR, sN * lipR);
    // How far it actually has to fall to reach what is underneath. Over the sea that is the
    // waterline; over a hill it is the hill, and the first version of this drove the sheet
    // fifteen units into the ground and splashed at sea level under it.
    const H = alt + lipY - (landY - 5), W0 = 5.5 * K, OUT = 9 * K;
    const arcU = t => 1.2 + OUT * Math.sqrt(t), fallY = t => lipY - t * H;
    const FS = 10, FT = 26, fp = [], fuv = [], fi = [];
    for (let j = 0; j <= FT; j++) {
      const t = j / FT, w = W0 * (1 + t * .85), o = arcU(t), y = fallY(t);
      for (let i = 0; i <= FS; i++) {
        const sx = (i / FS - .5) * w, bulge = Math.cos((i / FS - .5) * Math.PI) * (1.1 + t * 1.4);
        const uu = (lipR + o + bulge) , vv = sx;
        // ABSOLUTE chart coordinates, not the isle's local frame. See the note on fallMesh.
        fp.push(x + cN * uu - sN * vv, alt + y, z + sN * uu + cN * vv);
        fuv.push(i / FS, t);
      }
    }
    const fw = FS + 1;
    for (let j = 0; j < FT; j++) for (let i = 0; i < FS; i++) {
      const a0 = j * fw + i;
      fi.push(a0, a0 + fw, a0 + fw + 1, a0, a0 + fw + 1, a0 + 1);
    }
    const fg = new THREE.BufferGeometry();
    fg.setAttribute('position', new THREE.Float32BufferAttribute(fp, 3));
    fg.setAttribute('uv', new THREE.Float32BufferAttribute(fuv, 2));
    fg.setIndex(fi); fg.computeVertexNormals();
    this.fallUni = { uT: { value: 0 } };
    const flowMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide, uniforms: this.fallUni,
      vertexShader: `varying vec2 vUv; varying vec3 vN;
        void main(){ vUv=uv; vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vUv; varying vec3 vN; uniform float uT;
        float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
        float n(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
          return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
        // discrete falling strands: each column gets its own speed and phase, so the
        // face is unmistakably in motion rather than a drifting noise field
        float band(float y, float sp, float off, float freq){
          float t = fract(y*freq - uT*sp - off);
          return smoothstep(0.0,0.30,t)*smoothstep(1.0,0.55,t);
        }
        void main(){
          float acc = 1.0 + vUv.y*2.2;                 // gravity: faster the further it falls
          float c1 = floor(vUv.x*34.0), o1 = h(vec2(c1,3.0));
          float c2 = floor(vUv.x*13.0), o2 = h(vec2(c2,7.0));
          float c3 = floor(vUv.x*61.0), o3 = h(vec2(c3,11.0));
          float s1 = band(vUv.y, (1.5+o1*1.1)*acc, o1, 1.7);
          float s2 = band(vUv.y, (1.0+o2*0.7)*acc, o2, 0.85);
          float s3 = band(vUv.y, (2.3+o3*1.6)*acc, o3, 3.4);
          float sheet = n(vec2(vUv.x*5.0, vUv.y*2.0 - uT*acc*1.4))*0.6
                      + n(vec2(vUv.x*12.0, vUv.y*6.0 - uT*acc*2.2))*0.4;
          float core  = smoothstep(0.58,0.0,abs(vUv.x-0.5));
          float edge  = smoothstep(0.0,0.07,vUv.x)*smoothstep(1.0,0.93,vUv.x);
          float crest = smoothstep(0.09,0.0,vUv.y);
          float foot  = smoothstep(0.88,1.0,vUv.y);
          float body = 0.16 + sheet*0.30 + s1*0.42 + s2*0.30 + s3*0.22 + core*0.16;
          float a = edge*mix(1.0,0.74,vUv.y)*body + crest*0.65*edge + foot*0.34*edge;
          float rim = pow(1.0-abs(vN.z), 2.0)*0.28;
          vec3 col = mix(vec3(0.38,0.64,0.84), vec3(1.0),
                         clamp(s1*0.8 + s3*0.6 + sheet*0.35 + crest*0.9 + foot*0.6, 0.0, 1.0));
          gl_FragColor = vec4(col + rim, clamp(a,0.0,1.0)*0.95); }`
    });
    const fallMat = flowMat.clone();
    fallMat.uniforms = { uT: this.fallUni.uT };           // share the clock, keep its own dimming
    fallMat.fragmentShader = fallMat.fragmentShader.replace(
      'gl_FragColor = vec4(col + rim, clamp(a,0.0,1.0)*0.95); }',
      'gl_FragColor = vec4((col + rim)*0.42, clamp(a,0.0,1.0)*0.34); }');
    fallMat.needsUpdate = true;
    // THE TWO WATERFALLS. The sheet was a child of the isle's group, so it got ONE rigid
    // transform onto the sphere -- while the spray is a particle system that projects each
    // particle individually. Over a sheet ninety units wide and two hundred long those two
    // mappings diverge by metres, and the result was the sheet standing beside its own spray
    // like a second, older fall. The sheet is built in absolute chart coordinates now and
    // runs planetPos per vertex, exactly as the spray does, so they are one waterfall again.
    fallMat.vertexShader = PLANET_GLSL + `varying vec2 vUv; varying vec3 vN;
      void main(){ vUv=uv; vN=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(planetPos(position),1.0); }`;
    fallMat.needsUpdate = true;
    const fallMesh = new THREE.Mesh(fg, fallMat);
    fallMesh.renderOrder = 2; fallMesh.frustumCulled = false;
    fallMesh.userData.flat = true;                 // the shader does the projection, not the matrix
    scene.add(fallMesh); this.fallMesh = fallMesh;
    // stream along the channel, laid on the actual surface
    const sp2 = [], su = [], si = [];
    for (let j = 0; j <= 20; j++) {
      const along = lerp(-R * .55, lipR, j / 20), w = lerp(1.6, W0 * .5, Math.pow(j / 20, 1.6));
      for (let i = 0; i <= 4; i++) {
        const side = (i / 4 - .5) * 2 * w, u = cN * along - sN * side, v = sN * along + cN * side;
        sp2.push(u, topH(u, v) + .28, v); su.push(i / 4, j / 20);
      }
    }
    for (let j = 0; j < 20; j++) for (let i = 0; i < 4; i++) { const a0 = j * 5 + i; si.push(a0, a0 + 5, a0 + 6, a0, a0 + 6, a0 + 1); }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(sp2, 3));
    sg.setAttribute('uv', new THREE.Float32BufferAttribute(su, 2));
    sg.setIndex(si); sg.computeVertexNormals();
    this.g.add(new THREE.Mesh(sg, flowMat));
    const pool = new THREE.Mesh(new THREE.CircleGeometry(5, 26), flowMat);
    pool.rotation.x = -Math.PI / 2;
    pool.position.set(cN * -R * .5, topH(cN * -R * .5, sN * -R * .5) + .3, sN * -R * .5); this.g.add(pool);

    // spray leaves the lip on the same arc the sheet follows
    const wx = x + cN * (lipR + arcU(1)), wz = z + sN * (lipR + arcU(1));
    const lx = x + cN * lipR, lz = z + sN * lipR;
    const lipSpawn = (p, v, spread, vy) => {
      const w = rnd(-W0 * .55, W0 * .55), t0 = rnd(0, .1);
      p.set(lx - sN * w + cN * arcU(t0) + rnd(-spread, spread), alt + lipY - t0 * H + rnd(-1, .4), lz + cN * w + sN * arcU(t0) + rnd(-spread, spread));
      v.set(cN * rnd(3.5, 7), vy(), sN * rnd(3.5, 7));
    };
    const NB = MOBILE ? 420 : 900;
    // the body of the fall: big slow cards, heavily overlapped
    this.body = new Streaks({
      n: NB, life: 3.9, gy: -23, drag: .01, rate: MOBILE ? 130 : 260, floor: landY - 1,
      size: 2.1, stretch: 1.5, alpha: .34, c0: '#5d93b4', c1: '#e8f6ff',
      cx: x, cy: alt * .5, cz: z, rad: 260,
      spawn: (p, v) => lipSpawn(p, v, 1.4, () => rnd(-1.5, .6))
    });
    // fast thin streaks in front of it
    this.streaks = new Streaks({
      n: Math.floor(NB * .7), life: 3.6, gy: -26, drag: 0, rate: MOBILE ? 110 : 230, floor: landY - 1,

    S.put(G.sph, M.hullCore, 1.5, 1.9, 1.5, 0, B + 13.6, 0);
    // ports round the rim, and the ribs between them
    for (let i = 0; i < 26; i++) {
      const a = i / 26 * Math.PI * 2;
      const px = Math.sin(a) * (R + .06), pz = Math.cos(a) * (R + .06);
      S.put(G.box, i % 2 ? M.hullLit : M.hullDark, i % 2 ? 1.5 : .7, i % 2 ? 1.1 : 2.6, .5, px, B + 4.8, pz, 0, a, 0);
    }
    // engine bells under the belly, ringed round the lift
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2 + .4, px = Math.sin(a) * (R * .52), pz = Math.cos(a) * (R * .52);
      // The bell hangs off the funnel, and the funnel at this radius is a good way above the
      // apex -- so the mount is drawn to where the surface actually is, not to B.
      const surf = B + 3.6 * (R * .52) / (R * .92);
      S.put(G.cone, M.hullDark, 2.1, 2.6, 2.1, px, B - 1.3, pz, Math.PI, 0, 0);
      S.put(G.cyl, M.hullCore, 1.5, .3, 1.5, px, B - 2.4, pz);
      S.put(G.cyl, M.hullMid, 1.0, surf - (B - .5), 1.0, px, (B - .5 + surf) / 2, pz);
    }
    // three masts on the crown, which is all that is left of the spires -- they were the one
    // part of the keep that read as alien rather than medieval
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * Math.PI * 2 + .9, px = Math.sin(a) * 5.4, pz = Math.cos(a) * 5.4;
      S.strut(G.cylT, M.hullPale, .5, px, B + 8.4, pz, px * 2.1, B + 20.5, pz * 2.1);
      S.put(G.sph, M.hullLit, .55, .8, .55, px * 2.1, B + 20.8, pz * 2.1);
    }

    // ---- the lift, and what stands at the bottom of it ----
    // The shaft is the centrepiece: a column of light from the belly down to the dais, which
    // is how you would get up into the hull the day the inside of it exists.
    for (let i = 0; i < 3; i++) S.put(G.cyl, i % 2 ? M.hullMid : M.hullDark, 6.4 - i * 1.2, .5 + i * .5, 6.4 - i * 1.2, 0, (.5 + i * .5) / 2 + i * .5, 0);
    const D = 1.5, CY = D + 3.4;
    S.put(G.cyl, M.hullDark, 3.0, .5, 3.0, 0, D + .25, 0);
    S.put(G.cyl, M.hullGlass, 2.4, B - D - .6, 2.4, 0, (D + B - .6) / 2, 0);
    for (let i = 0; i < 4; i++) { const a = i / 4 * Math.PI * 2 + .4;   // the rails it runs on
      S.strut(G.cyl, M.hullMid, .22, Math.sin(a) * 2.45, D + .3, Math.cos(a) * 2.45, Math.sin(a) * 2.45, B - .4, Math.cos(a) * 2.45); }
    S.put(G.cyl, M.hullDark, 3.2, .6, 3.2, 0, B - .3, 0);

    // six tanks in a ring under the hull, and two consoles facing the lift
    this.tankAt = [];
    for (let i = 0; i < V.tanks; i++) {
      const a = i / V.tanks * Math.PI * 2 + .5;
      const px = Math.sin(a) * 11.6, pz = Math.cos(a) * 11.6;
      landerTank(S, px, pz, a);
      this.tankAt.push([px, 3.7, pz]);
    }
    for (const sgn of [1, -1]) {
      S.put(G.box, M.hullDark, 3.6, 3.5, 1.7, sgn * 7.4, -.25, 3.4);
      S.put(G.box, M.hullLit, 3.1, .12, 1.6, sgn * 7.4, 1.62, 3.35, -.5, 0, 0);
      S.put(G.box, M.hullMid, .5, 1.4, .5, sgn * 7.4, 2.4, 4.1);
    }

    this.shell = S.done();

    // ---- what stops him ----
    // `seeThru` on all of it: none of this is scenery standing between the lens and his
    // chest, and pulling the boom in every time he walked past a leg would be miserable.
    const mark = (px, pz, r, top) => { const w = S.world(px, pz); const o = obAdd(w.x, w.z, r, null, top); o.seeThru = 1; return o; };
    this.obs = [];
    for (const f of feet) {
      this.obs.push(mark(f.fx, f.fz, 2.6, S.base + 1.4));        // the pad: a low thing you step over
      this.obs.push(mark(f.kx, f.kz, 1.3, Infinity));            // the knee: a post you go round
    }
    for (let i = 0; i < 3; i++) this.obs.push(mark(0, 0, 6.4 - i * 1.2, S.base + 1 + i * .5));
    this.obs.push(mark(0, 0, 2.5, Infinity));                    // the lift shaft
    for (const [px, , pz] of this.tankAt) this.obs.push(mark(px, pz, 1.8, Infinity));

    // ---- the parts that move ----
    // A live group, not merged: it is projected onto the planet like anything else added to
    // the scene, so it is placed exactly the way the site was and then left alone.
    const g = new THREE.Group();
    g.position.set(x, S.base, z);
    g.quaternion.setFromUnitVectors(_plY, normalAt(x, z).lerp(_plY, .5).normalize())
      .multiply(new THREE.Quaternion().setFromAxisAngle(_plY, yaw));
    this.g = g; scene.add(g);
    this.coreY = CY;
    // the column of light in the shaft, and the load riding up it
    this.beam = mesh(G.cyl, M.hullBeam, 2.2, B - D - 1.0, 2.2, 0, (D + B - .6) / 2, 0); g.add(this.beam);
    this.core = mesh(G.sph, M.hullCore, 1.2, 1.2, 1.2, 0, CY, 0); g.add(this.core);
    this.coreGl = glow('#c48cff', 7, .8); this.coreGl.position.set(0, CY, 0); g.add(this.coreGl);
    this.light = new THREE.PointLight(0xa85cff, 2.2, 54, 2); this.light.position.set(0, CY + .5, 0); g.add(this.light);
    // Up inside the funnel, so it washes the underside rather than the apron. Standing under
    // the ship you are lit by its own belly, which is the whole point of standing there.
    this.belly = new THREE.PointLight(0x7fd8ff, 2.2, 52, 2); this.belly.position.set(0, B + 1.4, 0); g.add(this.belly);
    // Three rings about the core, each turning on its own axis. G.ring has a thin tube, so
    // the scale is the hoop's radius and it stays a hoop however big it gets.
    this.rings = [];
    for (let i = 0; i < 3; i++) {
      const rr = 2.3 + i * .6;
      const r = mesh(G.ring, M.hullLit, rr, rr, rr, 0, CY, 0);
      r.rotation.set(i * .7, 0, i * .5);
      r.userData.sp = (i % 2 ? 1 : -1) * (.35 + i * .18);
      g.add(r); this.rings.push(r);
    }
    this.blobs = [];
    for (let i = 0; i < this.tankAt.length; i++) {
      const [px, py, pz] = this.tankAt[i];
      const b = mesh(pick(G.blob), M.hullCore, .68, .82, .68, px, py, pz);
      b.userData.p = i / this.tankAt.length * 6.3; g.add(b); this.blobs.push(b);
    }
    // the landing lights, which is what tells you at three hundred units that it is a machine
    this.lamps = [];
    for (let i = 0; i < feet.length; i++) {
      const f = feet[i], gl = glow('#9fe8ff', 2.6, .8);
      gl.position.set(f.fx, 1.9, f.fz); gl.userData.p = i / feet.length * 6.3;
      g.add(gl); this.lamps.push(gl);
    }
    world.lander = this;
    logMsg('A lander stands on its legs in the ' + biomeAt(x, z).name + ', lit and empty.');
  }
  update(dt) {
    const t = world.clock;
    for (const r of this.rings) { r.rotation.y += dt * r.userData.sp; r.rotation.x += dt * r.userData.sp * .4; }
    const pulse = .86 + Math.sin(t * 1.7) * .1 + Math.sin(t * 4.3) * .04;
    this.core.scale.setScalar(1.2 * pulse); this.core.rotation.y += dt * .3;
    this.coreGl.scale.setScalar((6 + world.night * 5) * pulse);
    this.light.intensity = (1.4 + world.night * 2.2) * pulse;
    this.belly.intensity = 1.8 + world.night * 3.2;
    // the lift's column breathes and drifts upward; the texture is a scroll, not a motion
    this.beam.material.opacity = (.10 + world.night * .12) * (.75 + Math.sin(t * .9) * .25);
    this.beam.rotation.y += dt * .25;
    for (let i = 0; i < this.lamps.length; i++) {
      const L = this.lamps[i], ph = L.userData.p;
      const k = Math.max(0, Math.sin(t * 1.4 + ph));
      L.scale.setScalar((1.6 + world.night * 1.8) * (.35 + k * .9));
      L.material.opacity = .35 + k * .5;
    }
    for (let i = 0; i < this.blobs.length; i++) {
      const b = this.blobs[i], ph = b.userData.p;
      b.position.y = this.tankAt[i][1] + Math.sin(t * .7 + ph) * .55;
      b.rotation.y += dt * .5; b.rotation.x = Math.sin(t * .4 + ph) * .3;
      b.scale.setScalar(.72 + Math.sin(t * 1.3 + ph) * .06);
    }
    // Standing at the lift, the splicer offers itself. It has nothing to work with yet and
    // says so -- the specimen half of this is not built, and a button that pretended
    // otherwise would be worse than no button. The offer takes the right stick's tap away
    // from the jump while it stands, so it is kept tight to the dais.
    if (!INTRO.on && !player.aboard && !player.free && Math.hypot(player.pos.x - this.pos.x, player.pos.z - this.pos.z) < LANDER.reach)
      offerAct({ icon: 'splice', label: 'SPLICE', run: () => {
        world.effects.push(new Burst(this.pos.x, this.pos.y + this.coreY, this.pos.z, '#c48cff', 13, 1.1));
        logMsg('The splicer turns over and finds the tanks empty. Nothing has been brought back yet.');
      } });
  }
  dispose() {
    for (const o of this.obs) obRemove(o);
    scene.remove(this.g); scene.remove(this.shell);
  }
}

function buildSites() {
  const out = [];
  const farm = siteSpot('steading', ['pasture'], 2.6, 10, .2, [15, 12, 9, 7, 5], out);
  if (farm) { out.push(buildFarm(farm.x, farm.z, rnd(Math.PI * 2))); logMsg('Someone tilled this ground, and did not come back for it.'); }
  const ring = siteSpot('stones', ['highland', 'scrub'], 8, 24, .34, [13, 10, 8, 6, 4], out);
  if (ring) out.push(buildStones(ring.x, ring.z));
  const huddle = siteSpot('huddle', ['scrub', 'pasture'], 2.6, 12, .2, [16, 13, 10, 8, 6], out);
  if (huddle) out.push(buildHuddle(huddle.x, huddle.z, rnd(Math.PI * 2)));
  // The lander wants more room and flatter ground than anything else here -- forty-two units
  // across on six legs -- and it is the one place you come back to, so unlike every other
  // site it is not allowed to come down on the sister isle across the water. It gets first
  // refusal on the map for both reasons.
  // Unlike every other site here, this one is not allowed to fail. A steading that does not
  // get built is a steading you never knew about; a lander that does not get set down is the
  // player's base missing from the world. So the ladder goes all the way down: it starts
  // asking for flat open ground in one of three regions and ends up taking anything on the
  // main island that is above water, and only the "reachable" test -- not the sister isle
  // across the sea -- is held all the way through.
  const iso = { x: CENTERS[1][0] * W, z: CENTERS[1][1] * W };
  const reachable = q => q && Math.hypot(q.x - iso.x, q.z - iso.z) > W * .34;
  const RUNGS = [[.12, 32], [.12, 26], [.12, 22], [.16, 18], [.20, 14], [.28, 10], [.40, 5], [.60, 0]];
  let pad = null;
  for (const [sl, c] of RUNGS) {
    // It kept SETTLING -- the console said so on most loads: slope .16, clearance 18, which
    // is a knoll with things on it. Not because no flat open ground exists, but because six
    // tries per biome is not enough to find it on an island this size. These are height-field
    // samples at load time and cost nothing worth measuring, so it now looks properly before
    // it gives anything up.
    for (const nm of ['pasture', 'scrub', 'highland'])
      for (let i = 0; i < 40 && !pad; i++) { const q = randomBiome(nm, 3, 26, sl, 400, c); if (reachable(q)) pad = q; }
    for (let i = 0; i < 400 && !pad; i++) { const q = randomLand(3, 26, sl, 400, c); if (reachable(q)) pad = q; }
    if (pad) { if (c < 22) console.info('[site] the lander had to settle for slope ' + sl + ', clearance ' + c); break; }
  }
  if (pad) { world.structures.push(new Lander(pad.x, pad.z, rnd(Math.PI * 2))); out.push({ x: pad.x, z: pad.z }); }
  else console.warn('[site] nowhere at all to set the lander down');
  const ruin = siteSpot('ruin', ['jungle', 'wetland'], 3, 14, .3, [13, 10, 8, 6, 4], out);
  if (ruin) {
    out.push(buildRuin(ruin.x, ruin.z, rnd(Math.PI * 2)));
    for (let i = 0; i < 14; i++) {         // the jungle taking it back
      const px = ruin.x + rnd(-16, 16), pz = ruin.z + rnd(-14, 14);
      if (isLand(px, pz) && obClear(px, pz, .7)) world.plants.push(new Mushroom(px, pz, rnd(.6, 1)));
    }
  }
  return out;
}

// ---------- scatter ----------
// Real boulders. Two models, one silhouette, two skins -- so they go down as one merged
// mesh per skin rather than one object per rock: thirty-odd draw calls for scenery that
// never moves is thirty-odd too many on a phone. Merging means the planet's curve has to
// be baked into the vertices instead of applied to a matrix, which is what warpGeo does,
// and which is only allowed because a rock never moves again.
const ROCKS = { urls: ['models/alien_rock_01.glb', 'models/alien_rock_02.glb'], n: 17 };
function scatterRocks() {
  for (const url of ROCKS.urls) loadModel(url, e => {
    const parts = [];
    e.root.updateMatrixWorld(true);
    e.root.traverse(o => { if (o.isMesh) parts.push({ geo: o.geometry, mat: o.material, m: o.matrixWorld.clone() }); });
    if (!parts.length) return;
    // THE MEAN, NOT THE MAX -- and this is the third and last place with this bug in it. A
    // collider is a circle; an elongated model is not, so a circle drawn round the LENGTH
    // circumscribes the silhouette and you are stopped units out from thin air. zPut was fixed
    // for it in c09 and placeProp in c54; scatterRocks kept the max the whole time, and
    // scatterRocks is the one that spreads model rocks over the WHOLE island, which is why
    // these keep turning up in open ground in a different region every time.
    const sz = e.box.getSize(new THREE.Vector3()), h0 = Math.max(1e-4, sz.y), w0 = (sz.x + sz.z) * .5;
    // a boulder is made of the region it is lying in, same as the cliff behind it
    const bin = [], place = new THREE.Matrix4(), q = new THREE.Quaternion(), spin = new THREE.Quaternion();
    const pos = new THREE.Vector3(), scl = new THREE.Vector3(), nrm = new THREE.Vector3();
    for (let i = 0; i < ROCKS.n; i++) {
      const p = randomLand(.5, 26, 2.6, 60, 2.6); if (!p) continue;
      const H = rnd(1.6, 5.4), s = H / h0;
      const gy = groundY(p.x, p.z), sunk = H * .17;         // set into the ground, not perched on it
      nrm.copy(normalAt(p.x, p.z)).lerp(_plY, .3).normalize();
      q.setFromUnitVectors(_plY, nrm).multiply(spin.setFromAxisAngle(_plY, rnd(Math.PI * 2)));
      pos.set(p.x, gy - sunk - e.box.min.y * s, p.z);
      place.compose(pos, q, scl.setScalar(s));
      const reg = biomeAt(p.x, p.z).name;
      for (const pt of parts) bin.push({ geo: pt.geo, mat: tintFor(pt.mat, reg, { keep: .3, k: .5 }), matrix: place.clone().multiply(pt.m) });
      obAdd(p.x, p.z, w0 * s * .42, null, gy - sunk + H * .96, 'rock:' + url.replace(/^.*\//, '').replace(/\.glb$/, ''));
    }
    if (!bin.length) return;
    addChunked(bin, true);
  });
}
function scatterDecor() {
  const bin = [];
  for (let i = 0; i < 200; i++) {
    const p = randomLand(.4, 44, 3, 40); if (!p) continue;
    const s = rnd(.5, 3.4), y = height(p.x, p.z), sy = s * rnd(.45, 1);
    const r = mesh(pick(G.rock), Math.random() < .5 ? M.stone : M.stone2, s * rnd(.8, 1.5), sy, s * rnd(.8, 1.5), p.x, y - s * .18, p.z);
    r.rotation.set(rnd(3), rnd(3), rnd(3)); collect(bin, r);
    // the boulder geometry is a unit icosahedron, so sy is its half-height: a rock is only
    // as tall as it looks, and you clear a knee-high one instead of running into a wall
    if (y > .4) obAdd(p.x, p.z, s * 1.15, null, y - s * .18 + sy * 1.25);
    if (y > 2 && Math.random() < .5) { const m = mesh(pick(G.blob), M.moss, s * .5, s * .18, s * .5, p.x + rnd(-.5, .5), y + s * .25, p.z + rnd(-.5, .5)); m.rotation.set(rnd(1), rnd(3), rnd(1)); collect(bin, m); }
  }
  for (let i = 0; i < 430; i++) {                          // reeds along the waterline
    const p = randomLand(-.4, 1.3, 1.6, 60, 0); if (!p) continue;
    const y = height(p.x, p.z);
    for (let j = 0; j < 5; j++) {
      const h = rnd(2, 4.2);
      const r = mesh(G.leaf, M.reed, rnd(2.5, 4), h, 1, p.x + rnd(-.5, .5), y, p.z + rnd(-.5, .5));
      r.rotation.set(rnd(-.12, .12), rnd(3), rnd(-.12, .12)); collect(bin, r);
    }
  }
  for (let i = 0; i < 40; i++) {                           // driftwood
    const p = randomLand(.2, 1.6, 2, 40); if (!p) continue;
    const d = mesh(pick(G.trunk), M.wood, .3, rnd(2, 4), .3, p.x, height(p.x, p.z) + .2, p.z);
    d.rotation.set(Math.PI / 2 + rnd(-.2, .2), rnd(3), rnd(3)); collect(bin, d);
    obAdd(p.x, p.z, 1.1, null, height(p.x, p.z) + .7);   // it is lying down; step over it
  }
  addChunked(bin, true);
}
// The same ninety-unit cells layZones got in c58, for every other island-wide merge. Two
// hundred boulders, two thousand reed quads and forty driftwood logs were going into a
// handful of meshes whose bounding spheres covered the world, so every triangle in them was
// submitted from everywhere. Same trade, same answer.
const CHUNK_M = 90;
function addChunked(bin, cast) {
  const grp = new THREE.Group(); grp.userData.flat = true;
  const cells = new Map();
  for (const it of bin) {
    const key = Math.floor(it.matrix.elements[12] / CHUNK_M) + ',' + Math.floor(it.matrix.elements[14] / CHUNK_M);
    let a = cells.get(key); if (!a) cells.set(key, a = []);
    a.push(it);
  }
  for (const a of cells.values()) for (const m of mergeBin(a)) {
    warpGeo(m.geometry);
    m.geometry.computeBoundingSphere();
    // Two thousand reed blades laid flat against the tideline are a lot of shadow map for a
    // fringe of dark on wet sand. The boulders and the driftwood keep theirs.
    m.castShadow = !!cast && m.material !== M.reed; m.receiveShadow = true;
    grp.add(m);
  }
  scene.add(grp);
  return grp;
}
// ---------- zones: arrangements, not scatter ----------
// The island had exactly one placement rule -- find a legal spot at random, drop a thing on
// it -- and a world built entirely that way has no PLACES in it. Every acre is the average of
// the whole island, so there is nowhere to be going and nothing to recognise when you arrive.
// These are the other kind. A handful of anchors per region, each laying out a FORMATION with
// its own internal order, so a grove reads as a grove and a crystal burst reads as one thing
// that grew rather than nine things that landed.
//
// Two rules do most of the work, and both are about difference rather than density:
//   * EACH REGION GETS ITS OWN SPECIES. The rock in the highland is not the rock in the
//     desert, the plant in the swamp is not the plant in the mushroom country. That is what
//     makes crossing a border feel like crossing a border, and it is why the model lists live
//     on the zone entries below rather than in one shared bag everything draws from.
//   * A FORMATION HAS A MIDDLE. A grove rings a clearing, a ridge runs along a bearing with
//     its big stones in the centre, a burst radiates. Randomness is for the jitter inside
//     that shape, never for the shape.
//
// The jungle stands are deliberately tall and deliberately uneven in height: that canopy is
// the substrate for the platforms and rope bridges, and those want trunks that top out at
// different heights or there is nothing to climb between.
//
// Everything every formation places goes into ONE bin and is merged by material, so eight
// hundred pieces cost about forty draws rather than eight hundred. Geometry is warped into
// sphere space at merge time and the group opts out of the per-frame projection, exactly the
// way the boulder field does.
const ZONES = [
  // OUTPOSTS FIRST, and the order is the point. layZones walks this list in sequence and
  // zAnchor rejects any spot inside the gap of something already placed, so whatever is at the
  // top gets the pick of the ground and everything below arranges itself around it. A base is
  // the one thing here that is somewhere rather than something, so it chooses first and the
  // groves, beds and outcrops settle around it -- which is what "build the zones around those
  // areas" actually means in a system that has no author standing over it.
  { fn: 'outpost', biome: 'pasture',  n: 2, maxSl: .26, base: ['space_base'],
    hut: ['dome_hut'], mast: 'sp_sci_fi_antenna', slab: ['sp_stone01', 'sp_stone02'] },
  { fn: 'outpost', biome: 'scrub',    n: 1, maxSl: .26, base: ['space_base'],
    hut: ['dome_hut'], mast: 'sp_sci_fi_antenna', slab: ['sp_stone01'] },
  { fn: 'outpost', biome: 'highland', n: 1, maxSl: .34, base: ['space_base'],
    hut: ['dome_hut'], mast: 'sp_sci_fi_antenna', slab: ['sp_stone02'] },
  // THE BIG CAPS. Their own formation rather than another entry in a bed, because they are
  // three to six units tall -- you walk under these, and a stand of them is a landmark.
  { fn: 'caps', biome: 'fungal',  n: 6, maxSl: .5, cap: ['fantasy_mushroom_colorful'], floor: ['sp_plant04', 'sp_plant05'] },
  { fn: 'caps', biome: 'jungle',  n: 3, maxSl: .5, cap: ['fantasy_mushroom_colorful'], floor: ['sp_plant07'] },
  { fn: 'caps', biome: 'wetland', n: 3, maxSl: .45, cap: ['fantasy_mushroom_colorful'], floor: ['sp_plant02'] },
  // THE JUNGLE: tall stands with a clear floor. The floor plants are inside the ring, so the
  // clearing reads as somewhere you walk into rather than a hole in the trees.
  { fn: 'grove', biome: 'jungle',   n: 8, maxSl: .55, tall: ['sp_tree03', 'sp_tree04'], broad: ['sp_tree01'], floor: ['sp_plant07'] },
  { fn: 'grove', biome: 'wetland',  n: 3, maxSl: .45, tall: ['sp_tree04'], broad: ['sp_tree02'], floor: ['sp_plant08'] },
  // THE CRYSTAL FLATS: one big shard with its own children radiating out and leaning away
  // from it, sized down with distance. A cluster that grew, not a handful thrown.

const ZPAINT = { v: null };
const ZTAG = { v: null };      // which zone entry is being laid, for the collider tags
const _zq = new THREE.Quaternion(), _zs = new THREE.Quaternion(), _zax = new THREE.Vector3();
const _zp = new THREE.Vector3(), _zsc = new THREE.Vector3(), _zn = new THREE.Vector3(), _zm = new THREE.Matrix4();

function buildZones() {
  // Every model any zone names, once. If one of them fails to load the count never completes
  // and no zones are built at all -- which is the right failure: a half-laid grove is worse
  // than none, and everything else in the world is untouched either way.
  const want = new Set();
  for (const z of ZONES) for (const k of ['tall', 'broad', 'floor', 'rock', 'plant', 'slab', 'peak', 'base', 'hut', 'cap', 'scree'])
    if (z[k]) for (const nm of z[k]) want.add(nm);
  for (const z of ZONES) for (const k of ['hub', 'shard', 'mast']) if (z[k]) want.add(z[k]);
  const names = [...want], M = {};
  let got = 0;
  for (const nm of names) loadModel('models/' + nm + '.glb', e => {
    const parts = [];
    e.root.updateMatrixWorld(true);
    e.root.traverse(o => { if (o.isMesh) parts.push({ geo: o.geometry, mat: o.material, m: o.matrixWorld.clone() }); });
    const sz = e.box.getSize(new THREE.Vector3());
    // `foot` is the MEAN of the two horizontal extents, not the larger of them, and that is
    // the whole of the invisible-wall bug. A collider is a circle; an elongated model is not.
    // Taking the wider axis circumscribes the silhouette, so sp_rock03 -- 7.8 units long and
    // 1.4 deep once scaled -- got a radius drawn round its LENGTH, and with the 1.1 the
    // player's own test adds on top you were stopped 5.0 units out by 4.3 units of thin air.
    // The mean inscribes far closer: same 5.0 for a round boulder, 3.4 for that slab.
    M[nm] = { name: nm, parts, box: e.box, sz, big: Math.max(sz.x, sz.y, sz.z), foot: (sz.x + sz.z) * .5 };
    if (++got === names.length) layZones(M);
  });
}

// One piece into the bin. `span` is the world size of the model's LARGEST dimension, which is
// the only sizing handle that behaves for every shape in the batch: these range from a stone
// slab twenty-one times wider than it is thick to a tree three times taller than it is wide,
// and asking for a HEIGHT turns the first of those into a twenty-metre pebble.
// `tilt` is how far it lies down with the ground (0 stands upright, 1 lies flat on the slope);
// `obK` is its collision radius as a fraction of its own FOOTPRINT (see the note where that is
// measured), so a trunk can block while its canopy does not, and a flower blocks nothing.
function zPut(bin, m, x, z, span, yaw, tilt, obK, opt) {
  if (!m) return;

  // eight call sites. layZones parks the entry being laid here for exactly this.
  if (ZPAINT.v && !(opt && opt.paint)) opt = Object.assign({}, opt, { paint: ZPAINT.v });
  const s = span / Math.max(1e-4, m.big), gy = groundY(x, z);
  _zn.copy(normalAt(x, z)).lerp(_plY, 1 - tilt).normalize();
  _zq.setFromUnitVectors(_plY, _zn).multiply(_zs.setFromAxisAngle(_plY, yaw));
  // Leaning away from a point: turn about the horizontal axis at right angles to the outward
  // bearing. Negated because a positive turn about that axis tips it INWARD, toward the hub.
  if (opt && opt.lean) _zq.premultiply(_zs.setFromAxisAngle(
    _zax.set(-Math.sin(opt.leanA), 0, Math.cos(opt.leanA)), -opt.lean));
  const sink = (opt && opt.sink !== undefined ? opt.sink : .04) * m.sz.y * s;
  _zp.set(x, gy - sink - m.box.min.y * s, z);
  _zm.compose(_zp, _zq, _zsc.setScalar(s));
  const reg = biomeAt(x, z).name;
  for (const pt of m.parts) bin.push({ geo: pt.geo, mat: tintFor(pt.mat, reg, { keep: .38, k: .7, paint: opt && opt.paint }), matrix: _zm.clone().multiply(pt.m) });

  if (r > .4) obAdd(x, z, r, null, gy - sink + m.sz.y * s * .94, (ZTAG.v || 'zone') + ':' + (m.name || '?'));
}

const ZFN = {
  // A base, its huts, its mast, and a few slabs of apron between them. The slabs are what make
  // it read as inhabited rather than as three models parked in a field -- somebody laid those.
  outpost(B, M, cx, cz, z0) {
    if (!obClear(cx, cz, 7)) return;
    const face = rnd(6.3);
    zPut(B.big, M[pick(z0.base)], cx, cz, rnd(8.5, 11), face, .10, .27, { sink: .04 });
    // huts set back and off to one side, turned to look at the base
    for (let i = 0, n = 1 + (Math.random() * 2 | 0); i < n; i++) {
      const a = face + rnd(1.9, 2.9) * (i ? -1 : 1), r = rnd(9, 14);
      const x = cx + Math.sin(a) * r, zz = cz + Math.cos(a) * r;

    }
    {

      const x = cx + Math.sin(a) * r, zz = cz + Math.cos(a) * r;
      if (isLand(x, zz) && obClear(x, zz, 2.2)) zPut(B.big, M[z0.mast], x, zz, rnd(8, 12), rnd(6.3), .05, .3);
    }

    let x = cx, zz = cz, dir = face;
    for (let i = 0; i < 9; i++) {
      dir += rnd(-.28, .28);
      x += Math.sin(dir) * rnd(2.4, 3.6); zz += Math.cos(dir) * rnd(2.4, 3.6);
      if (!isLand(x, zz)) break;

    }
  },
  // A stand of the big caps, tallest in the middle, with cover under them.
  caps(B, M, cx, cz, z0) {

    for (let i = 0; i < n; i++) {
      const a = rnd(6.3), r = R * Math.sqrt(Math.random());
      const x = cx + Math.cos(a) * r, zz = cz + Math.sin(a) * r;
      if (!isLand(x, zz)) continue;
      // .22 of the footprint is the STALK, and it has to clear OB_PLAYER.minOb or the field
      // discards it and you walk through a mushroom the size of a tree.
      zPut(B.big, M[pick(z0.cap)], x, zz, rnd(3.2, 6.4) * (1 - r / (R + 3) * .35), rnd(6.3), .16, .22);
    }

  // A ring of trunks about a clear middle. The heights are drawn wide on purpose -- 16 to 34

// How far apart two formations of a kind have to sit. This is the number that decides whether
// a region reads as organised or as a heap: randomBiome returns the BEST spot it can find,
// which is very nearly the same spot every time it is asked, so eight groves asked for that
// way arrive stacked on each other. Anchors here are random within the region's core instead,
// and rejected if anything already placed is inside the gap.
const ZGAP = { grove: 40, burst: 24, ridge: 30, bed: 18, track: 26, peak: 58, mast: 16,
  outpost: 90, caps: 26, crag: 54 };   // an outpost wants a lot of room, and gets it by going first
// HOW FAR EACH FORMATION REACHES FROM ITS ANCHOR. zAnchor only ever knew about other zone
// anchors, so nothing stopped a peak -- a single mountain twenty-six units across -- being
// laid straight over the ship's berth. The berth is deterministic and has not moved; a
// mountain grew under it. Same for the great tree, the spire and the cave mouth: every one of
// them is a thing the island is navigated BY, and every one of them was fair ground.
const ZSPAN = { peak: 28, crag: 21, outpost: 17, grove: 18, ridge: 20, burst: 11, caps: 12,
  bed: 10, track: 20, mast: 5 };
function zKeepOut() {
  const k = [];
  const add = (o, r) => { if (o) k.push({ x: o.x !== undefined ? o.x : o.pos.x, z: o.z !== undefined ? o.z : o.pos.z, r }); };
  add(world.berth, 36);
  add(world.ship, 36);
  add(world.greatTree && world.greatTree.pos, 26);
  add(world.motherTree && world.motherTree.pos, 44);
  add(world.cave && world.cave.pos, 24);
  add(world.lander && world.lander.pos, 26);

}
function zAnchor(biome, maxSl, used, gap, span = 12, keep = []) {
  for (let i = 0; i < 700; i++) {
    const p = randomLand(1.6, 20, maxSl, 1, 4); if (!p) continue;
    const b = biomeAt(p.x, p.z);
    if (b.name !== biome || b.edge < .28) continue;      // well inside it, never on the seam
    let ok = true;
    for (const u of used) if (Math.hypot(p.x - u.x, p.z - u.z) < Math.max(gap, u.gap) * .8) { ok = false; break; }
    // and off everything the player steers by, by this formation's own reach plus its own
    if (ok) for (const q of keep) if (Math.hypot(p.x - q.x, p.z - q.z) < q.r + span) { ok = false; break; }
    // and not straight on top of something already standing, which `peak` and `ridge` never
    // checked at all -- a mountain over a lantern tree is the same mistake at a smaller scale
    if (ok && !obClear(p.x, p.z, Math.min(span, 7))) ok = false;
    if (ok) { used.push({ x: p.x, z: p.z, gap }); return p; }
  }
  return null;
}

function layZones(M) {
  // Two bins, and the split is a shadow-map budget rather than an art choice: a stand of trees
  // and a mountain earn a place in the depth pass, four hundred flowers and a footpath do not.
  const B = { big: [], small: [] }, used = [], keep = zKeepOut();
  for (const z of ZONES) {
    const fn = ZFN[z.fn]; if (!fn) continue;
    for (let i = 0; i < z.n; i++) {
      const p = zAnchor(z.biome, z.maxSl, used, ZGAP[z.fn] || 20, ZSPAN[z.fn] || 12, keep);

  // getting anything out of it. three culls per OBJECT, against that object's bounding
  // sphere. Merging every grove, ridge, peak and crystal burst on the island into one mesh
  // per material gives that mesh a bounding sphere the size of the world, so it is in frustum
  // from everywhere and every triangle in it is submitted on every frame, including the
  // several hundred thousand behind you. Merging is a trade -- draw calls for culling
  // granularity -- and it had been taken all the way to one end.
  // Ninety-unit cells put it back in the middle: each cell is its own mesh with its own tight
  // sphere, so the ones behind the camera drop out for free. Through a 46-degree portrait
  // lens that is most of them. The cost is calls -- perhaps sixty merged meshes instead of
  // twenty -- of which only the handful you are looking at are ever drawn.
  const CHUNK = 90;
  const grp = new THREE.Group(); grp.userData.flat = true;
  for (const [bin, cast] of [[B.big, true], [B.small, false]]) {
    if (!bin.length) continue;
    const cells = new Map();
    for (const it of bin) {
      // elements 12 and 14 are the translation: still CHART coordinates at this point, which
      // is what we want to bucket on -- warpGeo has not run yet.
      const key = Math.floor(it.matrix.elements[12] / CHUNK) + ',' + Math.floor(it.matrix.elements[14] / CHUNK);
      let a = cells.get(key); if (!a) cells.set(key, a = []);
      a.push(it);
    }
    for (const a of cells.values()) for (const m of mergeBin(a)) {
      warpGeo(m.geometry);
      m.geometry.computeBoundingSphere();   // warpGeo moved every vertex; the old sphere is a lie
      m.castShadow = cast; m.receiveShadow = true;
      grp.add(m);
    }
  }
  scene.add(grp);
  console.info('[zones] ' + grp.children.length + ' chunk meshes, culled per chunk');
}

// THE SHIP'S BERTH, worked out before anything else is placed and worked out the same way
// every time. The site used to be the flattest of nine hundred Math.random draws -- and
// nothing in this file is seeded, so the ship stood somewhere new on every page load, which
// is exactly why it kept turning up halfway down a hillside. The terrain itself IS
// deterministic (height() is fbm over a fixed function); it is only the placement that was
// not. Scanning that terrain on a fixed lattice gives the same answer every time, so the
// berth becomes a property of the world instead of a property of the reload.
//
// What it wants is what a pilot wants: above the tide, off the hills, flat underfoot, and
// nothing rising within ten units of the feet.
function findBerth() {
  let best = -1e9, sp = null;
  const S = 56, span = W * .60;
  for (let i = 0; i < S; i++) for (let j = 0; j < S; j++) {
    const x = (i / (S - 1) - .5) * 2 * span, z = (j / (S - 1) - .5) * 2 * span;
    const h = height(x, z);
    if (h < 2.2 || h > 9.5) continue;
    const sl = slope(x, z);
    if (sl > .20) continue;
    if (Math.hypot(x - SPIRE.x, z - SPIRE.z) < 60) continue;
    let rough = 0;
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * Math.PI * 2;
      rough = Math.max(rough, Math.abs(height(x + Math.cos(a) * 10, z + Math.sin(a) * 10) - h));
    }
    if (rough > 2.4) continue;
    const score = -sl * 12 - rough - Math.abs(h - 5) * .3;
    if (score > best) { best = score; sp = { x, z }; }
  }
  return sp;
}

// A LOOK AT THE COLLISION FIELD. Put ?obs on the URL, or call isle.showObs() from a console.
// Every obstacle is drawn where it actually is, at its own radius, and as tall as its `top`
// says it is -- an infinite one (a trunk, a cliff) gets a tall column so it reads differently
// from something you can step over.
//
// This exists because "an invisible thing is stopping me" is not a question that can be
// answered by reading: the collider and the model that should explain it are computed in
// different places from different numbers, and the only way to see the gap between them is to
// draw one on top of the other. Guessing at it cost a build.
let obsShown = null;
function showObstacles() {
  if (obsShown) { for (const m of obsShown) scene.remove(m); obsShown = null; return 0; }
  const mat = new THREE.MeshBasicMaterial({ color: 0x3cffd2, transparent: true, opacity: .20,
    depthWrite: false, side: THREE.DoubleSide });
  mat.userData.noHole = true;
  const cap = new THREE.MeshBasicMaterial({ color: 0xff5ea8, transparent: true, opacity: .28,
    depthWrite: false, side: THREE.DoubleSide });
  cap.userData.noHole = true;
  const seen = new Set(), out = [];
  for (const arr of OB.map.values()) for (const o of arr) {
    if (seen.has(o)) continue;
    seen.add(o);
    const gy = isFinite(o.bot) ? o.bot : groundY(o.x, o.z);
    const inf = !isFinite(o.top);
    const h = inf ? 14 : Math.max(.35, o.top - gy);
    // The LIVE radius, so the ring is the thing that actually stops you rather than the
    // thing it will one day be. A drawer that shows the adult circle round a sprout is a
    // drawer that agrees with the bug.
    const rr = obRadP(o);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rr, rr, h, 20, 1, true), inf ? cap : mat);
    m.position.set(o.x, gy + h * .5, o.z);
    scene.add(m); out.push(m);
  }
  obsShown = out;
  logMsg(seen.size + ' colliders drawn. Pink ones have no top: you go round those.');
  return seen.size;
}

// ---------- the cloud deck ----------
// The island has never had a cloud in it. The sky shader has a `cloud` term, but that is a
// tint on the dome -- nothing you can fly under, nothing that crosses the sun, nothing with an
// edge. These are objects: they sit above the world, they drift on the real wind, and because
// they go through scene.add like everything else they bend round the planet with it.
//
// A LOCAL FIELD, not a world-wide one. Sixteen of them kept within a couple of hundred units
// of wherever he is, recycled to the upwind side when they drift out of reach -- because a
// deck spread over a four-hundred-unit world would need hundreds to look like anything, and
// all but a dozen of them would be past the far plane at any moment.
//
// They are NOT flagged noHole on purpose. Standing under one is fine, but with the mount up
// over a ridge looking down, a cloud between the lens and him should be cut like any other
// scenery -- that is exactly what the hole is for.
const CLOUDS = {
  url: 'models/fluffy_cloud.glb',
  n: 16, lo: 62, hi: 108,          // how many, and the band they fly in
  span: [34, 82],                  // how wide each one is
  near: 210, drift: 1.9,           // the radius they are kept inside, and their speed on the wind
  fade: 5, base: .34, weather: .58, // opacity: what a clear day keeps, and what the weather adds
};
const clouds = [];
function buildClouds() {
  loadModel(CLOUDS.url, e => {
    const sz = e.box.getSize(new THREE.Vector3());
    const big = Math.max(sz.x, sz.y, sz.z);
    for (let i = 0; i < CLOUDS.n; i++) {
      const inst = cloneModel(e.root);
      const span = rnd(CLOUDS.span[0], CLOUDS.span[1]), k = span / Math.max(1e-4, big);
      inst.scale.set(k, k * rnd(.62, .9), k);
      inst.position.set(-(e.box.max.x + e.box.min.x) * .5 * k,
        -(e.box.max.y + e.box.min.y) * .5 * k, -(e.box.max.z + e.box.min.z) * .5 * k);
      inst.rotation.y = rnd(6.283);
      inst.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = false; o.receiveShadow = false;    // a cloud's shadow is the whole sky's job
        // Its own material, and transparent, because these fade in and out as they recycle --
        // and the model arrives OPAQUE, so the shared one would have to be changed for
        // everybody that ever uses this mesh, the title screen included.
        o.material = o.material.clone();
        o.material.transparent = true; o.material.depthWrite = true; o.material.opacity = 0;
      });
      const g = new THREE.Group(); g.add(inst); scene.add(g);
      const c = { g, inst, mats: [], k: 0, born: 0 };
      inst.traverse(o => { if (o.isMesh) c.mats.push(o.material); });
      clouds.push(c);
      cloudPlace(c, true);
    }
  });
}
// Drop one somewhere in the band, either anywhere (on the first fill) or upwind of him.
function cloudPlace(c, anywhere) {
  const p = player.pos, w = WX.wind;
  const wl = Math.hypot(w.x, w.y) || 1;
  const a = anywhere ? rnd(6.283) : Math.atan2(-w.x / wl, -w.y / wl) + rnd(-.7, .7);
  const r = anywhere ? rnd(20, CLOUDS.near) : CLOUDS.near * rnd(.86, .99);
  c.g.position.set(p.x + Math.sin(a) * r, rnd(CLOUDS.lo, CLOUDS.hi), p.z + Math.cos(a) * r);
  c.k = 0;
}
function stepClouds(dt) {
  if (!clouds.length) return;
  const p = player.pos, w = WX.wind, sp = CLOUDS.drift * (1 + WX.windK * 2.2);
  const want = CLOUDS.base + CLOUDS.weather * WX.cloud;
  for (const c of clouds) {
    c.g.position.x += w.x * sp * dt;
    c.g.position.z += w.y * sp * dt;
    const d = Math.hypot(c.g.position.x - p.x, c.g.position.z - p.z);
    if (d > CLOUDS.near * 1.25) cloudPlace(c, false);
    // fade in on arrival and out again at the rim, so a recycle is never a pop
    const edge = clamp((CLOUDS.near * 1.25 - d) / 40, 0, 1);
    c.k = lerp(c.k, want * edge, Math.min(1, dt * CLOUDS.fade));
    const o = c.k;
    c.g.visible = o > .01;
    for (const m of c.mats) m.opacity = o;
  }
}

function populate() {
  // The berth first: everything else may be rolled fresh each load, but the one thing the
  // player navigates by should be where they left it.
  world.berth = findBerth();
  const bp = world.berth;
  // the Elderwillow next, so everything else grows around it
  let gp = null;
  for (let i = 0; i < 400 && !gp; i++) {
    const x = rnd(-W * .7, W * .7), z = rnd(-W * .7, W * .7), h = height(x, z);
    if (h > 2.5 * RELIEF && h < 10 * RELIEF && slope(x, z) < .35 && Math.hypot(x - SPIRE.x, z - SPIRE.z) > 55
      && (!bp || Math.hypot(x - bp.x, z - bp.z) > 46)) gp = { x, z };   // not on top of the pad
  }
  if (!gp) gp = randomLand(2.5, 10, .45, 400, 0);
  if (gp) { world.greatTree = new GreatTree(gp.x, gp.z); world.plants.push(world.greatTree); }
  // The mother tree, in the jungle -- the region whose stands were always meant to be the
  // substrate for platforms and bridges -- and clear of the berth and the elderwillow.
  {
    let mp = null;
    for (let i = 0; i < 6 && !mp; i++) {
      const c = randomBiome('jungle', 2, 12, .45, 400, 6, .25) || randomLand(2, 12, .45, 300, 6);
      if (c && (!bp || Math.hypot(c.x - bp.x, c.z - bp.z) > 64) && (!gp || Math.hypot(c.x - gp.x, c.z - gp.z) > 52)) mp = c;
    }
    if (mp) { world.motherTree = new MotherTree(mp.x, mp.z); world.structures.push(world.motherTree); clearGrass(mp.x, mp.z, 9); }
  }
  for (let i = 0; i < 104; i++) { const p = randomFor(FLORA.tree, 1.6, 12, .8); if (p) world.plants.push(new LanternTree(p.x, p.z, rnd(.35, 1))); }
  for (let i = 0; i < 124; i++) { const p = randomFor(FLORA.moss, 1.2, 11, .9); if (p) world.plants.push(new MossTuft(p.x, p.z, rnd(.6, 1))); }
  for (let i = 0; i < 24; i++) { const p = randomFor(FLORA.bloom, 1.6, 10, .7); if (p) world.plants.push(new Bloom(p.x, p.z, rnd(.5, 1))); }
  // mushrooms come up in clumps, in the damp and the shade, three to seven at a time
  for (let i = 0; i < 21; i++) {
    const p = randomFor(FLORA.mushroom, 1, 8, .6); if (!p) continue;
    for (let j = 0, n = 3 + (Math.random() * 5 | 0); j < n; j++) {
      const x = p.x + rnd(-4.5, 4.5), z = p.z + rnd(-4.5, 4.5);
      if (isLand(x, z) && obClear(x, z, .6)) world.plants.push(new Mushroom(x, z, rnd(.5, 1)));
    }
  }
  for (let i = 0; i < 20; i++) { const p = randomLand(1.4, 10, .8); if (p) world.creatures.push(new Grazer(p.x, p.z)); }
  for (let i = 0; i < 7; i++) { const p = randomLand(1.4, 10, .8); if (p) world.creatures.push(new Weaver(p.x, p.z)); }
  for (let i = 0; i < 9; i++) { const p = randomLand(1.4, 10, .8); if (p) world.creatures.push(new Burrower(p.x, p.z)); }
  for (let i = 0; i < 38; i++) { const p = randomWater(); world.creatures.push(new Skimmer(p.x, p.z)); }
  for (let i = 0; i < 6; i++) { const p = randomLand(1.4, 10, .8); if (p) world.creatures.push(new Drifter(p.x, p.z)); }
  for (let i = 0; i < 5; i++) { const p = randomLand(1.5, 9, .6, 600, 4.5); if (p) world.creatures.push(new Walker(p.x, p.z)); }
  for (let i = 0; i < 42; i++) { const p = randomLand(1.2, 12, .9); if (p) world.creatures.push(new Hopper(p.x, p.z)); }
  for (let i = 0; i < 3; i++) { const p = randomWater(SEA - 12); world.creatures.push(new Leviathan(p.x, p.z)); }
  // the camp, on a beach shelf
  // and keep it off the pad: the ship is placed after this and adds its own collider then, so
  // there is nothing here for obClear to have found.
  let cp = null;
  for (let a = 0; a < 40 && !cp; a++) {
    const q = randomLand(1.3, 5, .5, 900, 6) || randomLand(1.2, 7, .7, 900, 4) || randomLand(1, 9, .9, 900, 2.5);
    if (!q) break;
    if (!bp || Math.hypot(q.x - bp.x, q.z - bp.z) > 30) cp = q;
  }
  if (cp) { world.camp = new Campfire(cp.x, cp.z); world.structures.push(world.camp); }
  // THE TEST HUT, next to the camp so it is the first thing he walks past. It is here to be
  // shot at: it is the parts-list structure standing in for whatever gets piped in later, and
  // the only way to know whether taking a building apart and putting it back is any fun is to
  // have one to take apart.
  if (cp) {
    const hp = randomLand(1.3, 6, .45, 400, 5);
    const q = (hp && Math.hypot(hp.x - cp.x, hp.z - cp.z) < 90) ? hp : cp;
    const hx = q.x + 13, hz = q.z + 4;
    if (isLand(hx, hz) && height(hx, hz) > SEA + 1.5) {
      world.structures.push(new Hut(hx, hz, Math.atan2(cp.x - hx, cp.z - hz)));
    }
  }
  // The ship, on the berth found above. Its facing is off the terrain too -- turned to look
  // back toward the middle of the island -- so nothing about where it sits or which way it
  // points changes between one load and the next.
  {
    const sp = world.berth || randomLand(1.6, 8, .28, 900, 7);
    if (sp) {
      world.ship = new Ship(sp.x, sp.z, Math.atan2(-sp.x, -sp.z));
      world.structures.push(world.ship);
    }
  }
  // the cave, on the steepest flank of the massif we can find
  let cv = null, cvS = 0;
  for (let i = 0; i < 900; i++) {
    const a = rnd(Math.PI * 2), r = rnd(22, 46);
    const x = SPIRE.x + Math.cos(a) * r, z = SPIRE.z + Math.sin(a) * r, h = height(x, z), sl = slope(x, z);
    if (h > 12 * RELIEF && h < 30 * RELIEF && sl > cvS && sl < 2.4) { cvS = sl; cv = { x, z }; }
  }
  if (cv) { world.cave = new Cave(cv.x, cv.z); world.structures.push(world.cave); }
  // the floating isle, out over open water
  let ip = null;
  for (let i = 0; i < 900 && !ip; i++) {
    const a = rnd(Math.PI * 2), r = rnd(W * .74, W * .93);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (height(x, z) < SEA - 9 && height(x + 38, z) < SEA - 4 && height(x - 38, z) < SEA - 4) ip = { x, z };
  }
  // THERE ARE TWO OF THESE, and that is deliberate -- this one out over open water, and the
  // one the title stands on over the hills inland. What was not deliberate is that they came
  // out of the same generator at the same size, so from the title camera, which sees a very
  // wide swathe of the world, they read as one island drawn twice. Smaller and lower fixes
  // that: two landmarks at different scales, not a mirror.
  if (ip) world.isle = new FloatingIsle(ip.x, ip.z, 54, Math.atan2(-ip.z, -ip.x), { R: 21 });
  // embers rising out of the chasm
  {
    const cx = CHASM.x, cz = CHASM.z, cy = height(cx, cz);
    world.chasmGlow = glow('#ff7a3a', 20, .35); world.chasmGlow.position.set(cx, cy + 3, cz); scene.add(world.chasmGlow);
    new PSys({ n: 120, life: 9, rate: 9, gy: .6, drag: .55, additive: true, a0: .7, wind: 1.1,
      c0: '#ffb069', c1: '#7a2a10', s0: .5, s1: .12,
      spawn: (p, v) => { const a = rnd(Math.PI * 2), r = rnd(0, 7); p.set(cx + Math.cos(a) * r, cy + rnd(0, 3), cz + Math.sin(a) * r); v.set(rnd(-.5, .5), rnd(1.2, 3), rnd(-.5, .5)); } });
  }
  world.spawn = world.camp ? { x: world.camp.pos.x + 7, z: world.camp.pos.z + 5 } : (randomLand(1.5, 8, .5, 400, 3) || { x: 0, z: 0 });
  ferry = new Ferry(); initMotes(); scatterDecor(); world.sites = buildSites(); scatterRocks(); placeTitle();
  buildZones(); buildClouds();
}

populate();

// ---------- post: bright pass, gaussian bloom, grade ----------
const rtType = HALF ? THREE.HalfFloatType : THREE.UnsignedByteType;
function makeRT(w, h) { return new THREE.WebGLRenderTarget(Math.max(2, w | 0), Math.max(2, h | 0), { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: rtType, depthBuffer: true, stencilBuffer: false }); }
let rtScene = makeRT(innerWidth * Q.dpr, innerHeight * Q.dpr);
let rtA = makeRT(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
let rtB = makeRT(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null); quad.frustumCulled = false; quadScene.add(quad);
const VS = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`;
const brightMat = new THREE.ShaderMaterial({ uniforms: { tD: { value: null }, uTh: { value: .76 }, uKnee: { value: .24 } }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD; uniform float uTh,uKnee; varying vec2 vUv;
  void main(){ vec3 c=texture2D(tD,vUv).rgb; float l=dot(c,vec3(0.2126,0.7152,0.0722));
    float s=smoothstep(uTh-uKnee,uTh+uKnee,l); gl_FragColor=vec4(c*s,1.0); }` });
const blurMat = new THREE.ShaderMaterial({ uniforms: { tD: { value: null }, uDir: { value: new THREE.Vector2(1, 0) }, uRes: { value: new THREE.Vector2(1, 1) } }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD; uniform vec2 uDir,uRes; varying vec2 vUv;
  void main(){ vec2 t=uDir/uRes; vec3 c=vec3(0.0);
    c += texture2D(tD,vUv).rgb*0.2270;
    c += (texture2D(tD,vUv+t*1.3846).rgb+texture2D(tD,vUv-t*1.3846).rgb)*0.3162;
    c += (texture2D(tD,vUv+t*3.2308).rgb+texture2D(tD,vUv-t*3.2308).rgb)*0.0702;
    gl_FragColor=vec4(c,1.0); }` });
// WHAT COLOUR THE DARK IS -- and BOTH NUMBERS HERE ARE LINEAR, which is the thing to hold on
// to, because it is what made the first two attempts read as grey haze.
//
// `knee` is where the shadow mask gives out, in linear luminance. It was .17, and .17 of
// linear is 114 out of 255 on the screen -- the mask was still at half strength around 83,
// which is the middle of the picture. "Shadows only" was reaching halfway up the image. At
// .028 it is gone by 50/255 and half gone by 37, which is actually the shadows.
//
// `col` is added at the black end, and the encode below flattens its saturation on the way
// out: [.030, .012, .052] looks like a strong violet written down and lands on screen as
// rgb(52, 34, 67), whose red and green are eighteen levels apart. That is a grey. To read as
// a colour after the curve, the channels have to be far apart HERE -- green near zero -- so
// this set lands on rgb(33, 7, 54): darker than before and unmistakably violet.
//
// Other moods, same rule (green crushed, one channel dominant):
//   amber  [.0400, .0120, .0004]    warm dark -- campfire, desert
//   teal   [.0004, .0180, .0290]    cold and wet -- over the swamp
//   rose   [.0330, .0010, .0180]    the crystal flats, pushed
// `k` is the volume. Toward 0 is true black, 1.6 is about where it was when it hazed.
const DARK = { col: [.0113, .0004, .0333], k: 1.0, knee: .028 };
const compMat = new THREE.ShaderMaterial({ uniforms: {
    tD: { value: null }, tB: { value: null }, uStr: { value: .85 }, uVig: { value: .5 }, uNight: { value: 0 }, uT: { value: 0 }, uRush: { value: 0 },
    uLift: { value: new THREE.Color(0, 0, 0) }, uKnee: { value: .17 }
  }, vertexShader: VS, fragmentShader: `
  uniform sampler2D tD,tB; uniform float uStr,uVig,uNight,uT,uKnee,uRush; uniform vec3 uLift; varying vec2 vUv;
  float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
  void main(){
    vec3 c = texture2D(tD,vUv).rgb;
    // THE RUSH. Six taps smeared toward the middle of the frame, weighted out from it so the
    // centre -- where he is -- stays sharp and the edges streak. This is what a game does to
    // say fast, and it is the whole effect: the lens also opens up seven degrees, which is
    // the other half. Branch-guarded, so it costs one comparison when he is walking.
    if (uRush > 0.002) {
      vec2 d = (vUv - 0.5);
      float e = smoothstep(0.06, 0.5, length(d));
      vec3 sm = c;
      for (int i = 1; i <= 6; i++) sm += texture2D(tD, vUv - d * (float(i) * 0.016 * uRush)).rgb;
      c = mix(c, sm / 7.0, e * uRush);
    }
    vec3 b = texture2D(tB,vUv).rgb;
    c += b*uStr;
    // gentle filmic grade: lift shadows cool, warm the highs
    float l = dot(c, vec3(0.2126,0.7152,0.0722));
    c = mix(c, c*vec3(0.94,0.98,1.10), (1.0-smoothstep(0.0,0.45,l))*0.3);
    c = mix(c, c*vec3(1.05,1.00,0.93), smoothstep(0.55,1.0,l)*0.4);
    // Contrast, and where the value range comes from. A frame read back had nothing in its
    // darkest tenth and one percent in its brightest -- almost all of it inside three middle
    // values, which is an image with no depth in it. This pulls the ends apart: the toe goes
    // down, the shoulder rolls off rather than clipping.
    c = (c - 0.5)*1.15 + 0.5;
    c = max(c, 0.0);

  loadModel(DIO_CLOUD, e => {
    const sz = e.box.getSize(new THREE.Vector3());
    const big = Math.max(sz.x, sz.y, sz.z);
    // Ten, not thirteen, and about half again as big. Measured: a cloud clump in the
    // reference is about 140 of its 941 pixels across, and the planet's 700 pixels are 28
    // world units -- so a clump is five and a half units, and they were coming out at four.
    // They also ring the SIDES there, not just the underside.
    for (let i = 0; i < 10; i++) {
      const lat = rnd(-.62, .18), lon = i / 10 * Math.PI * 2 + rnd(-.18, .18);
      const span = rnd(6.4, 10.2);
      const k = span / Math.max(1e-4, big);
      const inst = cloneModel(e.root);
      inst.scale.set(k, k * rnd(.8, 1.05), k);
      inst.position.set(-(e.box.max.x + e.box.min.x) * .5 * k,
        -(e.box.max.y + e.box.min.y) * .5 * k, -(e.box.max.z + e.box.min.z) * .5 * k);
      inst.rotation.y = rnd(6.283);
      inst.traverse(o => { if (o.isMesh) dioMat(o); });
      const hold = new THREE.Group();
      hold.add(inst);
      hold.position.copy(dioDir(lat, lon)).multiplyScalar(DIO.R * rnd(1.0, 1.09));
      hold.lookAt(0, 0, 0);
      g.add(hold);
    }
  });
}

const DIO_BODIES = [

  // in pixels over the half-frame width, 470. Written down because otherwise the next pass at
  // this is guessing again, and this screen has cost several rounds of exactly that.

  { sx:  1.02, sy:  .29, d: 235, rf: .70,  model: 'models/saturn.glb', tilt: [.16, .0, .12] },   // (960, 590) r260

  { sx:  -.80, sy: -.52, d: 170, rf: .074, model: 'models/cratered_asteroid.glb', tint: '#9a938c' },  // ( 95,1258) r35
  { sx:   .82, sy: -.62, d: 185, rf: .06,  model: 'models/purple_moon.glb' },                    // (855,1345) r28

function dioSky(g) {
  // The star field and the nebula are the owner's plate now (titleBackdrop). What is left in
  // here is the geometry that has to sit IN FRONT of it: a near thing and a far thing in the
  // same picture is the whole of why a wide shot reads as deep rather than flat.
  // Every one of these is the owner's own model now -- saturn off the right edge, the purple
  // moon bottom right, the cratered asteroid for the lumps, the earth for the left edge. The
  // craggy icosahedron generator and the tinted sphere that stood in for all of them are gone.
  DIO.bodies = [];
  for (const b of DIO_BODIES) {
    // Unit radius, scaled per frame: the size is a share of the picture, not a world number.
    const m = new THREE.Group();
    // A cratered rock can face any way; a ringed planet cannot -- its ring has to sit at the
    // angle the picture wants, so `tilt` overrides the tumble when a body specifies one.
    if (b.tilt) m.rotation.set(b.tilt[0], b.tilt[1], b.tilt[2]);
    else m.rotation.set(rnd(3), rnd(3), rnd(3));
    m.frustumCulled = false;
    // Every body out here is a model now, so there is no primitive branch left to fall back
    // to: a missing file leaves an empty group where a planet was, which is a hole in the
    // picture rather than a grey ball pretending nothing is wrong.
    if (b.model) {
      loadModel(b.model, e => {
        const inst = cloneModel(e.root), sz = e.box.getSize(new THREE.Vector3());
        const k = 2 / Math.max(1e-4, Math.max(sz.x, sz.y, sz.z));    // to unit RADIUS, not unit size
        inst.scale.setScalar(k);
        inst.position.set(-(e.box.max.x + e.box.min.x) * .5 * k,
          -(e.box.max.y + e.box.min.y) * .5 * k, -(e.box.max.z + e.box.min.z) * .5 * k);
        inst.traverse(o => {
          if (!o.isMesh) return;
          dioMat(o);
          if (b.tint) for (const mm of [].concat(o.material)) mm.color.set(b.tint);
        });
        m.add(inst);
      });
    }
    g.add(m);
    DIO.bodies.push({ m, spec: b });
  }
}

// WHAT STANDS ON IT, and this is a LAYOUT rather than a scatter. Every previous pass here
// picked random latitudes and longitudes and threw twenty of everything at the ball, which is
// why six mushrooms came up when the reference has three, and why the surface read as litter
// instead of as a place. The reference is a composition: one base on the left shoulder, the
// alien on top, three big caps in three specific spots, one spray of crystals, a handful of
// named creatures, and low cover only along the line where the green meets the rock.
//
// Bearings, since every position below is one: the lens is out along +Z, so lon 1.57 faces the
// camera, lon 0 is the right limb, lon 3.14 the left. lat is the sine of the latitude, 1 at the
// pole. Anything in the front half wants a lon between about 0.3 and 2.8.
// NOTHING HERE KNEW ABOUT ANYTHING ELSE. Every prop was placed by hand at a latitude and a
// longitude, and two hands placing two things never checked whether they had picked the same
// spot -- which is how a creature ended up standing in the waterfall, another ended up 4.6
// units inside a mushroom, and three more ended up in a heap.
//
// Each placement now claims a cap on the sphere: a direction and an angular radius, taken from
// how wide the thing is. A later placement that lands inside an existing claim is walked
// outward along the great circle joining them until it is clear -- away from what it hit, so
// it stays as near its author's intent as the crowding allows. Order is the priority: the
// alien, the base and the fall claim before the creatures, so the creatures move and the
// landmarks do not.
const dioClaims = [];
const _clA = new THREE.Vector3(), _clB = new THREE.Vector3();
// `foot` is what the thing puts ON THE GROUND as a fraction of how wide it is, and it is the
// difference between this converging and not. A mushroom eight units across is a stalk with a
// canopy over it -- claiming all eight leaves nowhere to stand, and a creature under a cap is
// fine and even wanted. A mast is thinner still. Measured against the crowd on this planet,
// claiming full width left four overlaps that no amount of shoving could resolve.
function dioClaim(lat, lon, span, foot) {
  const r = (span * .5 * (foot === undefined ? 1 : foot)) / DIO.R;
  const d = dioDir(lat, lon);
  for (let t = 0; t < 40; t++) {
    // The DEEPEST overlap, not the first one found. Pushing clear of the first can shove a
    // thing straight into the second, and with two neighbours it will sit there swapping
    // between them until the iterations run out -- which is exactly what it did.
    let hit = null, worst = 0;
    for (const c of dioClaims) {
      const pen = r + c.r - Math.acos(clamp(d.dot(c.d), -1, 1));
      if (pen > worst) { worst = pen; hit = c; }
    }
    if (!hit) break;

    if (_clA.lengthSq() < 1e-8) _clA.copy(_clB.set(0, 1, 0).cross(d));   // dead centre: any way out
    d.applyAxisAngle(_clA.normalize(), worst + .02).normalize();
