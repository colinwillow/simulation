<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lantern Isle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a13;font-family:Georgia,"Iowan Old Style",serif;color:#f0e7d4}
  canvas{display:block;touch-action:none}
  #scrim{position:fixed;left:0;right:0;top:0;height:300px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,.62),rgba(4,8,16,.28) 55%,rgba(4,8,16,0))}
  #scrimB{position:fixed;left:0;right:0;bottom:0;height:190px;z-index:1;pointer-events:none;
    background:linear-gradient(rgba(4,8,16,0),rgba(4,8,16,.5))}
  #hud{position:fixed;left:16px;top:14px;pointer-events:none;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.95)}
  #hud h1{margin:0;font-size:22px;font-weight:normal;letter-spacing:.04em}
  #hud .era{font-style:italic;font-size:14px;opacity:.85;margin:2px 0 8px}
  #perf{font-size:12px;line-height:1.5;opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
  #stats{font-size:12px;line-height:1.55;opacity:.92;font-family:ui-monospace,Menlo,Consolas,monospace}
  #log{position:fixed;left:16px;bottom:14px;z-index:2;font-size:13px;line-height:1.5;pointer-events:none;max-width:78vw;text-shadow:0 1px 4px rgba(0,0,0,.85)}
  #log div{animation:fade 11s forwards}
  @keyframes fade{0%{opacity:0;transform:translateY(4px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  #hint{position:fixed;right:16px;bottom:14px;font-size:12px;opacity:.5;pointer-events:none;text-align:right;line-height:1.5}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070a13;font-style:italic;letter-spacing:.05em;z-index:5;transition:opacity 1.2s}
  #sticks .stick{position:fixed;bottom:26px;width:132px;height:132px;border-radius:50%;z-index:4;
    background:rgba(240,235,220,.09);border:1px solid rgba(240,235,220,.28);touch-action:none}
  #stkL{left:20px} #stkR{right:20px}
  #sticks .knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    border-radius:50%;background:rgba(240,235,220,.34);border:1px solid rgba(240,235,220,.5);
    transition:transform .06s linear}
  #sticks .lbl{position:absolute;left:0;right:0;bottom:-19px;text-align:center;font-size:11px;
    opacity:.5;letter-spacing:.08em}
  #btns{position:fixed;right:20px;top:74px;z-index:4;display:flex;flex-direction:column;gap:8px}
  #btns button{font-family:inherit;font-size:13px;color:#f0e7d4;background:rgba(240,235,220,.1);
    border:1px solid rgba(240,235,220,.3);border-radius:16px;padding:7px 15px}
  #btns button.on{background:rgba(255,190,110,.3);border-color:rgba(255,200,130,.7)}
  @media (max-width:640px){#hint{display:none}#log{font-size:12px;bottom:176px}}
</style>
</head>
<body>
<div id="boot">growing an island…</div>
<div id="scrim"></div><div id="scrimB"></div>
<div id="hud"><h1>Lantern Isle</h1><div class="era" id="era">The Quiet</div><div id="stats"></div><div id="perf"></div></div>
<div id="log"></div>
<div id="hint">left stick walks · right stick looks · scroll or pinch to zoom<br>WASD / arrows also work · tap the ground to drop a spark</div>
<div id="sticks">
  <div class="stick" id="stkL"><div class="knob"></div><div class="lbl">MOVE</div></div>
  <div class="stick" id="stkR"><div class="knob"></div><div class="lbl">LOOK</div></div>
</div>
<div id="btns"><button id="flyB">fly</button><button id="freeB">free cam</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
// ============================================================
//  Lantern Isle v2
//  Same simulation; new skin. Every species still has one build()
//  (placeholder geometry) and one think() (behaviour), so real
//  assets drop in by replacing build() alone.
// ============================================================

// ---------- quality ----------
const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const Q = {
  seg: MOBILE ? 240 : 384,
  grass: MOBILE ? 7000 : 21000,
  motes: MOBILE ? 420 : 620,
  shadow: MOBILE ? 1024 : 2048,
  bloomDiv: MOBILE ? 4 : 3,
  dpr: Math.min(devicePixelRatio, MOBILE ? 2 : 2)
};

const W = 240, SEA = 0, DAY = 110, GROW_T = 85;
const WS = W / 170;              // landform coords were authored at W=170
const MAX = { tree: MOBILE ? 78 : 122, moss: 115, bloom: MOBILE ? 34 : 50, cairn: 7, grazer: 20, weaver: 14, drifter: 9, walker: 4, hopper: 34 };

const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const col = h => new THREE.Color(h).convertSRGBToLinear();

// ---------- noise ----------
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function hash3(x, y, z) { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), u), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), u), v);
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, cc) => hash3(xi + a, yi + b, zi + cc);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v),
              lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w);
}
function fbm(x, y, o = 5) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }
function fbm3(x, y, z, o = 3) { let a = .5, f = 1, s = 0; for (let i = 0; i < o; i++) { s += a * vnoise3(x * f, y * f, z * f); f *= 2.07; a *= .5; } return s; }

// ---------- terrain field ----------
const CENTERS = [[0.04, 0.02, 1.14], [-0.66, 0.58, 0.62]];
// named landforms — the island reads as a place rather than a lump of noise
// a range running along the north shoulder, not a cone in the middle
const RANGE = { ax: -0.44 * W, az: -0.30 * W, bx: 0.16 * W, bz: -0.52 * W, w: 30, h: 27, crest: 14 };
const SPIRE = { x: (RANGE.ax + RANGE.bx) / 2, z: (RANGE.az + RANGE.bz) / 2 };   // referenced for siting
let _sd = 0, _st = 0;
function segDT(px, pz, ax, az, bx, bz) {          // distance to a line segment, plus position along it
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az;
  const L2 = vx * vx + vz * vz;
  let t = L2 > 0 ? (wx * vx + wz * vz) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + vx * t, cz = az + vz * t;
  _sd = Math.hypot(px - cx, pz - cz); _st = t;
}
const MESA = { x: -104 * WS, z: 94 * WS, r: 42 * WS, h: 18 };
const LAGOON = { x: -30 * WS, z: 52 * WS, r: 42 * WS, d: 13 };
const CHASM = { x: -62 * WS, z: -58 * WS, r: 15 * WS, d: 25 };
const STACKS = [{ x: 122, z: -54, r: 8, h: 25 }, { x: 138, z: -38, r: 5, h: 16 }, { x: -66, z: -132, r: 7, h: 22 }, { x: 100, z: 100, r: 6.5, h: 18 }, { x: -146, z: 6, r: 5.5, h: 14 }]
  .map(o => ({ x: o.x * WS, z: o.z * WS, r: o.r * WS, h: o.h }));
// soft terracing: flat treads, rounded risers — strata instead of a smooth ramp
function terraceF(h, step) { const f = h / step, i = Math.floor(f), fr = f - i; return (i + smooth(.3, .7, fr)) * step; }
function height(x, z) {
  const nx = x / W, nz = z / W;
  let mask = 0;
  for (const [cx, cz, s] of CENTERS) {
    const dx = (nx - cx) / (0.62 * s), dz = (nz - cz) / (0.62 * s);
    const d = Math.sqrt(dx * dx + dz * dz);
    mask = Math.max(mask, 1 - d * d);
  }
  const base = (fbm(nx * 2.6 + 11.3, nz * 2.6 + 4.7) - 0.5) * 2;
  // broad, gently rolling interior — most of the island should be walkable ground
  let h = base * 4.6 + 9 * mask - 8.5 + mask * 9;
  h += (fbm(nx * 6.5 + 21, nz * 6.5 + 13, 4) - 0.5) * 5.2 * clamp(mask + .15, 0, 1);   // low hills
  h += (fbm(nx * 12 + 5, nz * 12 + 31, 3) - 0.5) * 2.4 * clamp(mask, 0, 1);            // hummocks
  h -= (1 - mask) * 10;
  // the range: a spine with several summits along its length
  segDT(x, z, RANGE.ax, RANGE.az, RANGE.bx, RANGE.bz);
  const rk = Math.max(0, 1 - _sd / RANGE.w), tAl = _st;
  if (rk > 0) {
    const peaks = .45 + .55 * Math.pow(Math.abs(Math.sin(tAl * Math.PI * 2.6 + 1.1)), .8);
    const wob = .8 + .4 * fbm(tAl * 7 + 4, _sd * .04, 3);
    h += Math.pow(rk, 1.8) * RANGE.h * peaks * wob;
    h += Math.pow(Math.max(0, 1 - _sd / (RANGE.w * .34)), 1.4) * RANGE.crest * peaks;
    h += Math.max(0, fbm(nx * 7 + 3.1, nz * 7 + 8.9, 4) - .52) * 34 * Math.pow(rk, 1.2);  // rocky detail
  }
  // flat-topped mesa on the sister isle
  const md = Math.hypot(x - MESA.x, z - MESA.z);
  const mk = smooth(MESA.r, MESA.r * .6, md);
  if (mk > 0) h = lerp(h, MESA.h + (fbm(x * .03 + 9, z * .03, 3) - .5) * 3.5, mk * .92);
  // a lagoon bitten out of the south shore
  const ld = Math.hypot(x - LAGOON.x, z - LAGOON.z);
  h -= Math.pow(Math.max(0, 1 - ld / LAGOON.r), 1.4) * LAGOON.d;
  // sea stacks standing off the coast
  for (let i = 0; i < STACKS.length; i++) {
    const st = STACKS[i], d = Math.hypot(x - st.x, z - st.z), R = st.r * 1.7;
    if (d < R) h = Math.max(h, Math.pow(1 - d / R, .5) * st.h - 3);
  }
  // a deep chasm, steep enough that nothing walks into it
  const cd = Math.hypot(x - CHASM.x, z - CHASM.z);
  h -= Math.pow(Math.max(0, 1 - cd / CHASM.r), .65) * CHASM.d;
  // strata on the mid slopes
  const tw = smooth(7, 13, h) * (1 - smooth(26, 34, h)) * .45;
  if (tw > 0) h = lerp(h, terraceF(h, 2.8), tw);
  // fine detail — new in v2, this is what kills the blocky read
  h += (fbm(nx * 26 + 2.2, nz * 26 + 7.4, 4) - .5) * 1.5 * clamp(mask + .3, 0, 1);
  h += (fbm(nx * 60, nz * 60, 3) - .5) * .55;
  return h;
}
function slope(x, z) { const e = 1.5; const dx = height(x + e, z) - height(x - e, z), dz = height(x, z + e) - height(x, z - e); return Math.sqrt(dx * dx + dz * dz) / (2 * e); }
function groundY(x, z) { return Math.max(height(x, z), SEA); }
function isLand(x, z) { return height(x, z) > SEA + 0.6; }
function normalAt(x, z) { const e = 1.2, dx = height(x + e, z) - height(x - e, z), dz = height(x, z + e) - height(x, z - e); return new THREE.Vector3(-dx, 2 * e, -dz).normalize(); }

// ---------- renderer ----------
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: !MOBILE, powerPreference: 'high-performance', stencil: false });
renderer.setPixelRatio(Q.dpr);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.LinearEncoding; // final gamma is done in the composite pass
renderer.info.autoReset = false;   // we render many passes per frame; total them ourselves
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.5, 1600);
const gl = renderer.getContext();
const HALF = !!(gl.getExtension('EXT_color_buffer_half_float') || gl.getExtension('OES_texture_half_float'));

// ---------- palette ----------
const P = {
  sand: col('#d8c191'), sandWet: col('#a68a5e'), mud: col('#8a6f4b'),
  grass: col('#77a75c'), grass2: col('#3f7a46'), grassDry: col('#a8ad63'),
  rock: col('#7a736c'), rock2: col('#585049'), snow: col('#eef1f6'),
  bark: col('#63432e'), bark2: col('#3f2a1d'),
  canopy: col('#2e6f5e'), canopy2: col('#478a58'), canopy3: col('#1f5a52'),
  lantern: col('#ffb85c'), moss: col('#8fc46a'), moss2: col('#6ea855'),
  bloomStem: col('#3e7a4a'), bloom: col('#ff5aa8'), bloomB: col('#c85ce8'),
  stone: col('#837f7a'), wood: col('#a5763f'), reed: col('#84a35a'),
  grazer: col('#93a173'), grazer2: col('#5d6b48'),
  weaver: col('#e0874a'), weaver2: col('#f7dcaa'),
  burrower: col('#63507a'), burrower2: col('#b58fcf'),
  skimmer: col('#3fd1c0'), drifter: col('#c8b6ff'),
  hull: col('#5b3f2e'), sail: col('#ece0c6'), eye: col('#0d0d10')
};
const std = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .82, metalness: 0 }, o));
const M = {
  barkA: std(P.bark, { roughness: .95 }), barkB: std(P.bark2, { roughness: .95 }),
  canopy: [std(P.canopy, { roughness: .78 }), std(P.canopy2, { roughness: .78 }), std(P.canopy3, { roughness: .78 })],
  lantern: std(P.lantern, { emissive: col('#ff9a2e'), emissiveIntensity: .5, roughness: .35 }),
  moss: std(P.moss, { roughness: .9 }), moss2: std(P.moss2, { roughness: .9 }),
  bloomStem: std(P.bloomStem, { roughness: .8 }),
  bloom: [std(P.bloom, { emissive: col('#ff2f8a'), emissiveIntensity: .4, roughness: .55 }), std(P.bloomB, { emissive: col('#a72fe8'), emissiveIntensity: .4, roughness: .55 })],
  stone: std(P.stone, { roughness: .93 }), stone2: std(col('#6c6862'), { roughness: .95 }),
  wood: std(P.wood, { roughness: .88 }), reed: std(P.reed, { roughness: .85, side: THREE.DoubleSide }),
  mound: std(col('#6d5236'), { roughness: .96 }),
  grazer: [std(P.grazer), std(col('#a3ac83')), std(col('#849172'))], grazer2: std(P.grazer2),
  weaver: [std(P.weaver), std(col('#d1743c')), std(col('#eda05e'))], weaver2: std(P.weaver2),
  burrower: std(P.burrower), burrower2: std(P.burrower2, { emissive: col('#7a3fa8'), emissiveIntensity: .35 }),
  skimmer: std(P.skimmer, { emissive: col('#1fb8a8'), emissiveIntensity: .3, roughness: .3, metalness: .15 }),
  drifter: std(P.drifter, { emissive: col('#6a4fd6'), emissiveIntensity: .25 }),
  membrane: new THREE.MeshStandardMaterial({ color: col('#efe6ff'), transparent: true, opacity: .55, roughness: .35, side: THREE.DoubleSide, emissive: col('#8f6ae0'), emissiveIntensity: .2 }),
  hull: std(P.hull, { roughness: .9 }), sail: std(P.sail, { side: THREE.DoubleSide, roughness: .95 }),
  eye: std(P.eye, { roughness: .18, metalness: .3 }),
  eyeHi: std(col('#ffffff'), { emissive: col('#ffffff'), emissiveIntensity: .35, roughness: .2 }),
  soil: std(col('#3a2a1c'), { roughness: .97 }),
  rope: std(col('#c9b58c'), { roughness: .95 }),
  elderBark: std(col('#4b3626'), { roughness: .97 }), elderBark2: std(col('#5f4632'), { roughness: .97 }),
  elderLeaf: [std(col('#2b6a55'), { roughness: .8 }), std(col('#3d8560'), { roughness: .8 }), std(col('#6fae72'), { roughness: .8 })],
  vine: std(col('#3d5c40'), { roughness: .9 }),
  levi: std(col('#1d5c76'), { roughness: .32, metalness: .28 }),
  leviBack: std(col('#123f57'), { roughness: .38, metalness: .3 }),
  leviBelly: std(col('#8fd8cf'), { roughness: .45 }),
  leviFin: std(col('#2b7f96'), { roughness: .35, metalness: .2, side: THREE.DoubleSide }),
  leviGlow: std(col('#6ff0e0'), { emissive: col('#2fd8c4'), emissiveIntensity: .5, roughness: .3 }),
  walker: std(col('#6d675f'), { roughness: .95 }), walker2: std(col('#4e4941'), { roughness: .95 }),
  walkerShell: std(col('#7d8a6a'), { roughness: .9 }),
  hopper: [std(col('#d9c58f'), { roughness: .85 }), std(col('#c2a874'), { roughness: .85 }), std(col('#e6d7ad'), { roughness: .85 })],
  hopper2: std(col('#8a7550'), { roughness: .85 })
};

// ---------- geometry helpers ----------
function displace(geo, amp, freq, ySquash = 1) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = (fbm3(x * freq, y * freq * ySquash, z * freq, 3) - .5) * 2 * amp;
    const l = Math.hypot(x, y, z) || 1;
    p.setXYZ(i, x + x / l * n, y + y / l * n, z + z / l * n);
  }
  geo.computeVertexNormals(); return geo;
}
// a trunk: tapered, bent, with bark ridges
function trunkGeo(h, r0, r1, bend, seed) {
  const g = new THREE.CylinderGeometry(r1, r0, h, 12, 9, false);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = (y + h / 2) / h;
    const a = Math.atan2(z, x), rad = Math.hypot(x, z);
    const ridge = Math.sin(a * 9 + seed) * .035 + Math.sin(a * 21 + t * 4) * .018 + (fbm3(x * 2, y * .7, z * 2, 2) - .5) * .09;
    const flare = t < .16 ? (0.16 - t) * 2.4 : 0;               // root flare
    const nr = rad + ridge * rad * 1.6 + flare;
    p.setXYZ(i, Math.cos(a) * nr + Math.sin(t * 2.1 + seed) * bend * t * t, y, Math.sin(a) * nr + Math.cos(t * 1.7 + seed) * bend * .7 * t * t);
  }
  g.computeVertexNormals(); return g;
}
const G = {
  sph: new THREE.SphereGeometry(1, 20, 14),
  sphLo: new THREE.SphereGeometry(1, 12, 9),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 14, 1),
  cylT: new THREE.CylinderGeometry(.6, 1, 1, 14, 1),
  cone: new THREE.ConeGeometry(1, 1, 16),
  box: new THREE.BoxGeometry(1, 1, 1, 2, 2, 2),
  plane: new THREE.PlaneGeometry(1, 1, 6, 4),
  torus: new THREE.TorusGeometry(1, .28, 8, 18),
  blob: [], rock: [], trunk: [], leaf: null
};
for (let i = 0; i < 5; i++) G.blob.push(displace(new THREE.SphereGeometry(1, 16, 12), .34, 1.5 + i * .4));
for (let i = 0; i < 7; i++) G.rock.push(displace(new THREE.IcosahedronGeometry(1, 2), .3, 1.1 + i * .3, 1.6));
for (let i = 0; i < 5; i++) G.trunk.push(trunkGeo(1, .5, .28, .18, i * 2.3));
// grass blade: tapered, 3 segments, pivot at base
G.leaf = (() => {
  const g = new THREE.BufferGeometry();
  const v = [], n = [], idx = [];
  const S = 4;
  for (let i = 0; i <= S; i++) { const t = i / S, w = .055 * (1 - t) * (1 - t * .3); v.push(-w, t, 0, w, t, 0); n.push(0, 0, 1, 0, 0, 1); }
  for (let i = 0; i < S; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3));
  g.setIndex(idx); return g;
})();
function mesh(geo, mat, sx = 1, sy = 1, sz = 1, px = 0, py = 0, pz = 0) {
  const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(px, py, pz); return m;
}
// Merge a pile of meshes into one buffer per material. Draw calls are the budget
// here, not triangles, and static props are most of the count.
function mergeBin(bin) {
  const byMat = new Map();
  for (const it of bin) { let a = byMat.get(it.mat); if (!a) { a = []; byMat.set(it.mat, a); } a.push(it); }
  const out = [];
  for (const [mat, items] of byMat) {
    let total = 0; const parts = [];
    for (const it of items) {
      const g = (it.geo.index ? it.geo.toNonIndexed() : it.geo.clone());

  constructor(x, z) { super(x, z, { speed: 2.6, turn: 2.6, rad: 1.25, look: 6 }); this.gait = 9; this.bob = .1; this.timer = rnd(6, 16); }
  build() {
    const b = this.body;
    b.add(mesh(G.blob[2], M.burrower, 1.25, .82, 1.75, 0, .85, 0));
    const head = new THREE.Group(); head.position.set(0, .85, 1.5); b.add(head); this.head = head;
    head.add(mesh(G.blob[4], M.burrower, .62, .55, .7, 0, 0, 0));
    head.add(mesh(G.cone, M.burrower2, .28, .8, .28, 0, -.05, .6).rotateX(Math.PI / 2));  // snout
    eyes(head, .2, .42, .3, .1, M.burrower);
    for (const sx of [1, -1]) { const w = mesh(G.blob[0], M.burrower2, .3, .16, .42, sx * .55, -.1, .5); w.rotation.z = sx * .5; head.add(w); }

      const s = mesh(G.cone, M.burrower2, .16, .5, .16, rnd(-.4, .4), 1.55 + rnd(-.1, .1), rnd(-1.1, .8));
      s.rotation.set(rnd(-.3, .3), 0, rnd(-.3, .3)); b.add(s); this.spines.push(s);

    for (const [x, z] of [[.62, .55], [-.62, .55], [.6, -.75], [-.6, -.75]]) this.addLeg(x, z, .78, M.burrower2, .16);
  }
  pose(dt) {

    this.gl.material.opacity = .12 + world.night * .5;
    this.tail.rotation.z = Math.sin(world.clock * 3 + this.phase) * .3;

      this.head.rotation.x = .5 + Math.sin(world.clock * 26) * .3;

      }
      return;
    }
    this.moving = world.night > .7 ? 1.3 : 1;

    if (this.timer <= 0 && slope(this.pos.x, this.pos.z) < .5 && height(this.pos.x, this.pos.z) > 1.5 && !nearest(world.plants, this.pos, () => true, 3.5) && !nearest(world.structures, this.pos, () => true, 5)) { this.state = 'dig'; this.timer = 3; return; }

// Glimmerfin — schooling swimmer, leaper, wake-follower

  build() {
    const b = this.body;
    b.add(mesh(G.blob[1], M.skimmer, .48, .58, 1.5, 0, 0, .1));
    const tail = new THREE.Group(); tail.position.z = -1.25; b.add(tail); this.tailG = tail;
    tail.add(mesh(G.blob[3], M.skimmer, .22, .3, .55, 0, 0, -.35));
    const fin = mesh(G.cone, M.skimmer, .06, 1.15, .55, 0, 0, -.85); fin.rotation.x = -Math.PI / 2; tail.add(fin);
    b.add(mesh(G.cone, M.skimmer, .07, .75, .42, 0, .5, -.15));       // dorsal
    for (const sx of [1, -1]) { const p = mesh(G.blob[0], M.skimmer, .38, .05, .22, sx * .42, -.1, .35); p.rotation.z = sx * .4; b.add(p); this['pec' + (sx > 0 ? 'R' : 'L')] = p; }

    this.timer -= dt; this.moving = 1;

    for (const o of world.creatures) {

    }

    for (const o of world.creatures) {

  }
  pose(dt) {
    super.pose(dt);

    this.g.position.y = SEA - .5 + k + Math.sin(world.clock * 2 + this.phase) * .12;
    this.body.rotation.x = this.leap >= 0 ? -(0.5 - this.leap) * 1.7 : 0;
    this.body.rotation.y = Math.sin(world.clock * 9 + this.phase) * .1;
    this.tailG.rotation.y = Math.sin(world.clock * 13 + this.phase) * .55;
    const f = Math.sin(world.clock * 7 + this.phase) * .3;

// Kitewing — pollen courier, seed sower
class Drifter extends Creature {
  constructor(x, z) { super(x, z, { speed: 7, turn: 1.6, flying: true, rad: 1.2 }); this.gait = 5; this.bob = 0; this.pollen = 0; this.alt = groundY(x, z) + 12; this.lastBloom = null; this.orbit = rnd(Math.PI * 2); }

    b.add(mesh(G.blob[0], M.drifter, .3, .3, .45, 0, .05, .95));

// The ferry
class Ferry {

    g.add(mesh(G.box, M.wood, 2.5, .16, 6.4, 0, 2.05, 0));            // deck

// spray thrown from a blowhole
class Spout {
  constructor(x, y, z) {
    this.alive = true; this.t = 0; this.life = 2.8; const n = this.n = 80;
    this.p = new Float32Array(n * 3); this.v = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      const a = rnd(Math.PI * 2), r = rnd(0, .9), sp = rnd(9, 19);
      this.p[i * 3] = x + Math.cos(a) * r; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z + Math.sin(a) * r;
      this.v[i * 3] = Math.cos(a) * rnd(.5, 3.2); this.v[i * 3 + 1] = sp; this.v[i * 3 + 2] = Math.sin(a) * rnd(.5, 3.2);
    }
    this.geo = new THREE.BufferGeometry(); this.geo.setAttribute('position', new THREE.BufferAttribute(this.p, 3));
    this.pts = new THREE.Points(this.geo, new THREE.PointsMaterial({ color: 0xe4f6ff, size: .6, transparent: true, opacity: .95, depthWrite: false }));
    this.pts.frustumCulled = false; scene.add(this.pts);
    this.gl = glow('#e4f6ff', 7, .55); this.gl.position.set(x, y + 4, z); scene.add(this.gl);
  }
  update(dt) {
    this.t += dt; const k = this.t / this.life;
    for (let i = 0; i < this.n; i++) {
      const ix = i * 3; this.v[ix + 1] -= 14 * dt; this.v[ix] *= .99; this.v[ix + 2] *= .99;
      this.p[ix] += this.v[ix] * dt; this.p[ix + 1] += this.v[ix + 1] * dt; this.p[ix + 2] += this.v[ix + 2] * dt;
      if (this.p[ix + 1] < SEA) { this.p[ix + 1] = SEA; this.v[ix + 1] *= -.12; this.v[ix] *= .55; this.v[ix + 2] *= .55; }
    }
    this.geo.attributes.position.needsUpdate = true;
    this.pts.material.opacity = .95 * (1 - k) * (1 - k);
    this.gl.scale.setScalar(7 + k * 12); this.gl.material.opacity = .55 * (1 - k) * (1 - k);
    if (k >= 1) this.alive = false;
  }
  dispose() { scene.remove(this.pts); scene.remove(this.gl); this.geo.dispose(); this.pts.material.dispose(); this.gl.material.dispose(); }
}

    if (onTap && far < .3 && performance.now() - t0 < 240) onTap();
    id = null; out.x = out.y = 0; knob.style.transform = 'translate(0,0)'; e.stopPropagation();
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
bindStick(document.getElementById('stkL'), stick.L);
bindStick(document.getElementById('stkR'), stick.R, () => { player.jump = 1; });
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = 1; if (e.key === ' ') { player.jump = 1; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = 0; });
const flyB = document.getElementById('flyB'), freeB = document.getElementById('freeB');
flyB.addEventListener('click', () => { player.fly = !player.fly; flyB.classList.toggle('on', player.fly); if (player.fly) player.pos.y += 2.5; });
freeB.addEventListener('click', () => { player.free = !player.free; freeB.classList.toggle('on', player.free); player.g.visible = !player.free; });
function updatePlayer(dt) {
  let lx = stick.L.x, ly = stick.L.y; const rx = stick.R.x, ry = stick.R.y;
  if (keys.a || keys.arrowleft) lx -= 1; if (keys.d || keys.arrowright) lx += 1;
  if (keys.w || keys.arrowup) ly -= 1; if (keys.s || keys.arrowdown) ly += 1;
  lx = clamp(lx, -1, 1); ly = clamp(ly, -1, 1);
  if (rx || ry) { cam.az -= rx * dt * 2.2; cam.pol = clamp(cam.pol - ry * dt * 1.4, .16, 1.5); cam.idle = 0; }
  const mag = Math.hypot(lx, ly);
  player.moving = lerp(player.moving, mag > .1 ? Math.min(1, mag) : 0, Math.min(1, dt * 9));
  const ca = Math.cos(cam.az), sa = Math.sin(cam.az);
  if (player.free) {
    if (mag > .1) { cam.idle = 0; const sp = cam.r * .5 * dt;
      cam.tgt.x = clamp(cam.tgt.x + (sa * ly + ca * lx) * sp, -W, W);
      cam.tgt.z = clamp(cam.tgt.z + (ca * ly - sa * lx) * sp, -W, W); }
    return;
  }
  if (mag > .1) {
    cam.idle = 0;
    if (player.fly) {
      const f = new THREE.Vector3(); camera.getWorldDirection(f);
      const rgt = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
      const sp = 32 * dt * Math.min(1, mag);
      player.pos.addScaledVector(f, -ly * sp).addScaledVector(rgt, lx * sp);
      player.pos.x = clamp(player.pos.x, -W * .97, W * .97); player.pos.z = clamp(player.pos.z, -W * .97, W * .97);
      player.pos.y = clamp(player.pos.y, SEA - 1, 190);
      player.heading = Math.atan2(-f.x, -f.z);
    } else {
      let dx = sa * ly + ca * lx, dz = ca * ly - sa * lx;
      const d = Math.hypot(dx, dz) || 1; dx /= d; dz /= d;
      const sp = (player.swim > .5 ? 9 : 17) * dt * Math.min(1, mag);
      player.pos.x = clamp(player.pos.x + dx * sp, -W * .97, W * .97);
      player.pos.z = clamp(player.pos.z + dz * sp, -W * .97, W * .97);
      player.heading = Math.atan2(dx, dz);
    }
  }
  if (!player.fly) {
    const h = height(player.pos.x, player.pos.z);
    player.swim = lerp(player.swim, h < SEA - .3 ? 1 : 0, Math.min(1, dt * 4));
    const target = Math.max(h, SEA) - player.swim * .85;
    player.gy = lerp(player.gy, target, Math.min(1, dt * 14));   // smooth the ground under the feet
    if (player.jump && player.grounded && player.swim < .5) { player.vy = 25; player.grounded = 0; player.hang = 1; }
    player.jump = 0;
    player.vy -= 32 * dt;
    player.pos.y += player.vy * dt;
    if (player.pos.y <= player.gy) { player.pos.y = player.gy; player.vy = 0; player.grounded = 1; }
  } else { player.jump = 0; player.vy = 0; player.grounded = 0; }
  const g = player.g;
  g.position.copy(player.pos);
  if (!player.fly && player.swim < .5) { alignTo(g, player.pos.x, player.pos.z, .4); g.rotateY(player.heading); }
  else g.rotation.set(0, player.heading, 0);
  const bobT = world.clock * 9;
  g.position.y += Math.abs(Math.sin(bobT)) * .12 * player.moving + (player.fly ? Math.sin(world.clock * 1.6) * .25 : 0);
  // airborne: tuck the legs, then squash a little on landing
  player.hang = lerp(player.hang || 0, player.grounded ? 0 : 1, Math.min(1, dt * 10));
  if (player.grounded && player.vy === 0 && (player.land || 0) > 0) player.land = Math.max(0, player.land - dt * 3.2);
  if (!player.grounded) player.land = 1;
  for (const l of player.legs)
    l.hip.rotation.x = lerp(Math.sin(bobT + (l.sx > 0 ? 0 : Math.PI)) * .7 * player.moving, -1.15 + l.sx * .25, player.hang);
  const squash = player.grounded ? 1 - (player.land || 0) * .16 : 1 + player.hang * .07;
  g.scale.set(2 - squash, squash, 2 - squash);
  player.light.intensity = 1.1 + world.night * 3.2;
  player.gl.scale.setScalar(4 + world.night * 6);
}
const ray = new THREE.Raycaster();
function tap(cx, cy) {
  ray.setFromCamera({ x: cx / innerWidth * 2 - 1, y: -(cy / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObject(terrain)[0]; if (!hit) return;
  const p = hit.point;
  if (height(p.x, p.z) < SEA) { world.effects.push(new Burst(p.x, SEA + .3, p.z, '#cff4ff', 10, 1)); return; }
  world.sparks.push(new Spark(p.x, p.z));
  world.effects.push(new Burst(p.x, groundY(p.x, p.z) + 2, p.z, '#fff0b0', 12, 1));
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  rtScene.setSize(innerWidth * Q.dpr, innerHeight * Q.dpr);
  rtA.setSize(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
  rtB.setSize(innerWidth * Q.dpr / Q.bloomDiv, innerHeight * Q.dpr / Q.bloomDiv);
  motesUni.uScale.value = innerHeight * .5;
  for (const ps of world.psys) ps.mat.uniforms.uScale.value = innerHeight * .5;
});

// ---------- HUD ----------
const statsEl = document.getElementById('stats'), eraEl = document.getElementById('era'), perfEl = document.getElementById('perf');
const perf = { ms: 16.7, worst: 0, acc: 0, n: 0 };
function updateHUD() {
  const f = (world.t / DAY) % 1;
  const tod = f < .22 ? 'before dawn' : f < .3 ? 'dawn' : f < .68 ? 'day' : f < .78 ? 'dusk' : 'night';
  const C = world.creatures, Pl = world.plants, S = world.structures;
  statsEl.innerHTML = `day ${world.day}, ${tod}<br>` +
    `${count(Pl, LanternTree)} lantern trees, ${count(Pl, MossTuft)} moss, ${count(Pl, Bloom)} blooms<br>` +
    `${count(C, Grazer)} mossbacks, ${count(C, Weaver)} tinkers, ${count(C, Burrower)} mudlarks<br>` +
    `${count(C, Skimmer)} glimmerfins, ${count(C, Drifter)} kitewings, ${count(C, Hopper)} hoppers<br>` +
    `${count(C, Walker)} grovewalkers, ${count(C, Leviathan)} leviathans, ${NM} motes<br>` +
    `${count(S, Cairn)} cairns, ${world.beacons} lit, tallest ${Math.round(Math.max(0, ...S.filter(o => o.alive && o instanceof Cairn).map(o => o.y)))}m`;
  const era = eraName(); if (era !== world.lastEra) { world.lastEra = era; eraEl.textContent = era; }
}
setInterval(updateHUD, 600); updateHUD();
setTimeout(() => logMsg('Nothing here yet but moss, motes and a few lantern trees.'), 1400);

// ---------- loop ----------
let last = performance.now(), booted = false;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = now - last;
  const dt = Math.min(.05, raw / 1000); last = now; world.clock += dt;
  perf.ms = lerp(perf.ms, raw, .06); perf.acc += raw; perf.n++;
  if (perf.n > 30) { perf.worst = Math.max(perf.worst * .82, perf.acc / perf.n); perf.acc = 0; perf.n = 0; }
  if (perfEl && (world.clock * 3 | 0) !== perf.tick) {
    perf.tick = world.clock * 3 | 0;
    const inf = renderer.info.render;
    perfEl.textContent = `${(1000 / perf.ms).toFixed(0)} fps  ${perf.ms.toFixed(1)}ms  ${inf.calls} calls  ${(inf.triangles / 1000 | 0)}k tris`;
  }
  const prevDay = Math.floor(world.t / DAY); world.t += dt; const curDay = Math.floor(world.t / DAY);
  if (curDay > prevDay) { world.day++; if (world.day === 2) logMsg('Second sunrise. The island keeps its own time now.'); }

  updatePlayer(dt);
  if (!player.free) cam.tgt.lerp(_camWant.set(player.pos.x, player.pos.y + 3.4, player.pos.z), Math.min(1, dt * 7));
  cam.idle += dt; if (cam.idle > 6 && player.moving < .05) cam.az += dt * .03;
  solveCam(dt);
  camera.position.set(
    cam.tgt.x + Math.sin(cam.az) * Math.sin(camS.pol) * camS.r,
    camS.y,
    cam.tgt.z + Math.cos(cam.az) * Math.sin(camS.pol) * camS.r);
  camera.lookAt(cam.tgt);
  sky.position.copy(camera.position);

  updateSky();
  for (const e of world.plants) if (e.alive) e.update(dt);
  for (const e of world.structures) if (e.alive) e.update(dt);
  for (const e of world.creatures) if (e.alive) e.update(dt);
  for (const e of world.effects) if (e.alive) e.update(dt);
  for (const e of world.sparks) if (e.alive) e.update(dt);
  ferry.update(dt);
  if (world.isle) world.isle.update(dt);
  for (let i = 0; i < world.psys.length; i++) world.psys[i].update(dt);
  if (world.chasmGlow) world.chasmGlow.scale.setScalar(14 + Math.sin(world.clock * 1.4) * 3 + world.night * 10);
  updateMotes(dt);
  purge(world.plants); purge(world.structures); purge(world.creatures); purge(world.effects); purge(world.sparks);

  waterUni.uT.value = world.clock; foamUni.uT.value = world.clock; grassUni.uT.value = world.clock;
  {   // things cutting the surface leave a wake
    const wk = waterUni.uWk.value; let n = 0;
    const push = (x, z, hx, hz) => { if (n < 4) { const d = Math.hypot(hx, hz) || 1; wk[n++].set(x, z, hx / d, hz / d); } };
    if (ferry) push(ferry.pos.x, ferry.pos.z, Math.sin(ferry.g.rotation.y), Math.cos(ferry.g.rotation.y));
    if (player.swim > .4) push(player.pos.x, player.pos.z, Math.sin(player.heading), Math.cos(player.heading));
    for (const c of world.creatures) {
      if (n >= 4) break;
      if (c.alive && c instanceof Leviathan && c.depth < 2.2) push(c.rx, c.rz, Math.sin(c.heading), Math.cos(c.heading));
    }
    for (let i = n; i < 4; i++) wk[i].set(0, 0, 0, 0);
  }
  renderPost();

  if (!booted) { booted = true; const b = document.getElementById('boot'); b.style.opacity = 0; setTimeout(() => b.remove(), 1300); }
}
requestAnimationFrame(frame);
})();
</script>
